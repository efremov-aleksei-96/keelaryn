name: Materialize Manager 4.17.12 pre-freeze exchange rollback fix

on:
  push:
    branches:
      - dev/manager-4.17.12
    paths:
      - .github/workflows/materialize-manager-4.17.12-prefreeze-exchange-rollback.yml

permissions:
  contents: write

concurrency:
  group: materialize-manager-4.17.12-prefreeze-exchange-rollback
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact one-shot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: dev/manager-4.17.12

      - name: Verify one-shot identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedParent='0cb01f115652120dd34e2ec21ba1a1eaa19760a1'
          $head=(git rev-parse HEAD).Trim().ToLowerInvariant()
          $parent=(git rev-parse HEAD^).Trim().ToLowerInvariant()
          if($parent-cne$expectedParent){throw "Unexpected workflow parent: $parent expected $expectedParent"}
          $changed=@(git diff --name-only "$expectedParent..$head")
          if($changed.Count-ne1-or$changed[0]-cne'.github/workflows/materialize-manager-4.17.12-prefreeze-exchange-rollback.yml'){throw('One-shot workflow commit is not isolated: '+($changed-join', '))}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Apply-Manager41712PreFreezeExchangeRollbackFix.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw('Materializer parser failure: '+(($errors|ForEach-Object Message)-join' | '))}
          Write-Host "One-shot identity PASS. HEAD=$head"

      - name: Apply product and permanent regression fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Apply-Manager41712PreFreezeExchangeRollbackFix.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $actual=@(git diff --name-only|Sort-Object)
          $expected=@('manager/product/tools/KeelarynMenu.ps1','tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')|Sort-Object
          if(($actual-join"`n")-cne($expected-join"`n")){throw('Unexpected product/regression diff: '+($actual-join', '))}
          Write-Host 'Exact product/regression diff: PASS.'

      - name: Run rollback and inherited regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-Manager4173ReviewRegression.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-Manager41712ReviewRegression.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File manager/product/tools/KeelarynMenu.ps1 -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'Exchange rollback + inherited regression chain: PASS.'

      - name: Record MGR-DEF-0029 and refresh public identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $utf8=New-Object Text.UTF8Encoding($false)
          function Write-Json([string]$Path,$Object){[IO.File]::WriteAllText((Resolve-Path $Path),((($Object|ConvertTo-Json -Depth 80).Replace("`r`n","`n"))+"`n"),$utf8)}

          $defectPath='tests/knowledge/defects/manager-4.17.12-prefreeze.json'
          $defect=Get-Content -LiteralPath $defectPath -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($defect.defects|Where-Object{[string]$_.id-ceq'MGR-DEF-0029'}).Count-ne0){throw 'MGR-DEF-0029 already exists.'}
          $newDefect=[pscustomobject][ordered]@{
            id='MGR-DEF-0029'
            title='ChatGPT CURRENT replacement deletes rollback bytes before post-publication verification'
            severity='P2'
            status='fixed'
            release_blocker=$true
            detected_in='4.17.12'
            detected_stage='pre_freeze_adversarial_review_repeat'
            defect_class='post-commit verification / rollback preservation'
            affected_surfaces=@('S-FRONTEND-INSTANCE-CONTEXT')
            preconditions='A previously prepared ChatGPT CURRENT exists, atomic File.Replace succeeds, and the subsequent SHA-256 verification fails or cannot complete.'
            bad_behavior='The replacement backup was deleted immediately after File.Replace and again in finally, before post-publication verification. A durable replacement followed by verification failure therefore destroyed the prior known exchange artifact even though rollback bytes had been created.'
            root_cause='Rollback cleanup was tied to successful atomic replacement rather than successful post-commit verification, collapsing durable commit and verified completion into one cleanup boundary.'
            root_cause_classes=@('RC-OUTCOME-001')
            violated_invariants=@('MH-POSTCOMMIT-001')
            related_defects=@('MGR-DEF-0028')
            permanent_regressions=@('tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')
            planned_regressions=@()
            fixed_in='4.17.12'
            evidence=@(
              [ordered]@{type='pre_freeze_reviewed_head';id='121a16d59f7d4e2a8dfa8122c90448718d4c976d'},
              [ordered]@{type='source_symbol';id='Copy-CurrentForChatGPT'},
              [ordered]@{type='project_transaction_rule';id='preserve_rollback_data_until_post_commit_verification'}
            )
          }
          $defect.defects=@($defect.defects)+@($newDefect)
          Write-Json $defectPath $defect

          $riskPath='tests/knowledge/risk-map.json'
          $risk=Get-Content -LiteralPath $riskPath -Raw -Encoding UTF8|ConvertFrom-Json
          $surface=@($risk.surfaces|Where-Object{[string]$_.id-ceq'S-FRONTEND-INSTANCE-CONTEXT'})
          if($surface.Count-ne1){throw 'S-FRONTEND-INSTANCE-CONTEXT risk surface is not unique.'}
          $surface=$surface[0]
          $surface.invariants=@(@($surface.invariants|ForEach-Object{[string]$_})+'MH-POSTCOMMIT-001'|Sort-Object -Unique)
          $surface.root_cause_classes=@(@($surface.root_cause_classes|ForEach-Object{[string]$_})+'RC-OUTCOME-001'|Sort-Object -Unique)
          $surface.symbols=@(@($surface.symbols|ForEach-Object{[string]$_})+'Copy-CurrentForChatGPT'|Sort-Object -Unique)
          $surface.regressions=@(@($surface.regressions|ForEach-Object{[string]$_})+@('tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')|Sort-Object -Unique)
          Write-Json $riskPath $risk

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Build-PublicFileManifest.ps1 -RepositoryRoot $PWD.Path -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $manifest=Get-Content -LiteralPath PUBLIC_FILE_MANIFEST.json -Raw -Encoding UTF8|ConvertFrom-Json
          $prov=Get-Content -LiteralPath PUBLIC_PROVENANCE.json -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$manifest.manager.version-cne'4.17.12'){throw 'Refreshed manifest version mismatch.'}
          $prov.source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
          $prov.source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
          $prov.development_status='unqualified_manager_4_17_12_prefreeze_findings_0028_0029_fixed_rerun_required'
          Write-Json 'PUBLIC_PROVENANCE.json' $prov

          $state=Get-Content -LiteralPath MANAGER_DEVELOPMENT_STATE.json -Raw -Encoding UTF8|ConvertFrom-Json
          $state.materialization.status='development_materialized_prefreeze_findings_0028_0029_regressions_pass'
          $state.qualification.risk_defect_gate.observed_status='stale_after_prefreeze_product_fix_0029_requires_exact_head_rerun'
          $state.qualification.risk_defect_gate.validated_development_head=$null
          $state.qualification.risk_defect_gate.candidate_freeze_permitted=$false
          $state.qualification.successor_4_17_12_development.pre_freeze_adversarial_review='MGR-DEF-0028_and_0029_found_and_fixed_exact_head_rerun_required'
          $state.next_exact_goal.description='Re-run exact-head Development Validation and full-successor Risk/Defect Gate after MGR-DEF-0029 rollback-preservation fix, then repeat PR-equivalent adversarial review on the new exact 4.17.12 head. Freeze only after the repeated review is clean.'
          Write-Json 'MANAGER_DEVELOPMENT_STATE.json' $state

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Test-ManagerEngineeringKnowledge.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Build-PublicFileManifest.ps1 -RepositoryRoot $PWD.Path -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Verify-PublicCandidateMetadata.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Verify-PublicRepository.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host ('Refreshed managed digest: '+[string]$manifest.manager.gate_managed_content_sha256)
          Write-Host 'MGR-DEF-0029 knowledge + public identity refresh: PASS.'

      - name: Commit validated pre-freeze rollback fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager/product/tools/KeelarynMenu.ps1 tools/Invoke-Manager4173ReviewRegression.ps1 tools/Invoke-Manager41712ReviewRegression.ps1 tests/knowledge/defects/manager-4.17.12-prefreeze.json tests/knowledge/risk-map.json PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json MANAGER_DEVELOPMENT_STATE.json
          $actual=@(git diff --cached --name-only|Sort-Object)
          $expected=@('manager/product/tools/KeelarynMenu.ps1','tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1','tests/knowledge/defects/manager-4.17.12-prefreeze.json','tests/knowledge/risk-map.json','PUBLIC_FILE_MANIFEST.json','PUBLIC_PROVENANCE.json','MANAGER_DEVELOPMENT_STATE.json')|Sort-Object
          if(($actual-join"`n")-cne($expected-join"`n")){throw('Unexpected staged pre-freeze rollback paths: '+($actual-join', '))}
          git commit -m 'Manager 4.17.12: preserve ChatGPT CURRENT rollback through verification'
          git push origin HEAD:dev/manager-4.17.12

# One-shot development materializer only. No candidate is issued or frozen here.

          if($dev.PSObject.Properties.Name -contains 'prefreeze_rollback_preservation_fix'){$dev.PSObject.Properties.Remove('prefreeze_rollback_preservation_fix')}
          $dev|Add-Member -NotePropertyName prefreeze_rollback_preservation_fix -NotePropertyValue ([pscustomobject][ordered]@{defect_id='MGR-DEF-0033';status='materialized_unqualified_development';review_comment_id='4013015495';reviewed_prefix_head=$env:PREFX_HEAD;fix='revalidate matching global source immediately before rollback deletion; retain verified destination and report partial durable handoff when source preservation cannot be proven';permanent_regression='ER-104';exact_green_requalification='required_before_freeze'})
          Write-Json $provPath $prov

          # Regenerate the cryptographic public manifest after the product-byte change, then bind
          # development/provenance metadata to the regenerated managed-set identity.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $manifest=Get-Content -LiteralPath (Join-Path $root 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $managed=[string]$manifest.manager.gate_managed_content_sha256;$installSha=[string]$manifest.manager.installation_sha256
          $state=Get-Content -LiteralPath $statePath -Raw -Encoding UTF8|ConvertFrom-Json;$state.materialization.managed_content_sha256=$managed;$state.materialization.installation_sha256=$installSha;Write-Json $statePath $state
          $prov=Get-Content -LiteralPath $provPath -Raw -Encoding UTF8|ConvertFrom-Json;$prov.source_manager_gate_managed_content_sha256=$managed;$prov.source_manager_installation_sha256=$installSha;Write-Json $provPath $prov

          # Parser guard before creating the local commit.
          foreach($p in @($runtime,$harness,$validator)){$tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors);if(@($errors).Count-ne0){throw('Parser failed '+$p+': '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}}
          Write-Host "MGR-DEF-0033 materialization: PASS; managed=$managed"

      - name: Verify isolated change set
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $allowed=@(
            'MANAGER_DEVELOPMENT_STATE.json',
            'PUBLIC_FILE_MANIFEST.json',
            'PUBLIC_PROVENANCE.json',
            'manager/product/runtime/Keelaryn__Manager.ps1',
            'tests/knowledge/defects/manager-4.17.13-prefreeze.json',
            'tests/knowledge/entry-reachability-supplemental.json',
            'tools/Invoke-ManagerEntryReachabilityMatrix.ps1',
            'tools/Test-ManagerEntryReachabilityKnowledge.ps1'
          )
          $changed=@(git status --short | ForEach-Object{($_.Substring(3)).Replace('\','/')})
          $unexpected=@($changed|Where-Object{$allowed-cnotcontains$_})
          if($unexpected.Count-ne0){throw('Unexpected changed paths: '+([string]::Join(',',@($unexpected))))}
          foreach($p in $allowed){if($changed-cnotcontains$p){throw('Expected changed path missing: '+$p)}}
          Write-Host 'Isolated change set: PASS'
          git diff --stat

      - name: Create exact local development commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'Aleksei Efremov'
          git config user.email 'efremov.aleksei.96@gmail.com'
          git add -- MANAGER_DEVELOPMENT_STATE.json PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json manager/product/runtime/Keelaryn__Manager.ps1 tests/knowledge/defects/manager-4.17.13-prefreeze.json tests/knowledge/entry-reachability-supplemental.json tools/Invoke-ManagerEntryReachabilityMatrix.ps1 tools/Test-ManagerEntryReachabilityKnowledge.ps1
          git commit -m 'Manager 4.17.13: preserve verified rollback destination on source loss'
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $head=(git rev-parse HEAD).Trim().ToLowerInvariant()
          "PATCHED_HEAD=$head" >> $env:GITHUB_ENV
          Write-Host "Exact local patched head: $head"

      - name: Run full exact-local development validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-41713-mgr-def-0033-'+$env:GITHUB_RUN_ID)
          "PATCH_EVIDENCE=$out\evidence" >> $env:GITHUB_ENV
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -OutputDirectory "$out"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Reverify authoritative remote before commit publication
        shell: powershell
        env:
          EXPECTED_PARENT: 5dab4933d9a9430cba629b27693091b7c8613c9f
        run: |
          $ErrorActionPreference='Stop'
          $remote=([string](git ls-remote origin refs/heads/dev/manager-4.17.13)).Trim()
          if($LASTEXITCODE-ne0-or-not$remote){throw 'Could not resolve authoritative remote dev head before publication.'}
          $remoteHead=($remote -split '\s+')[0].ToLowerInvariant()
          if($remoteHead-cne$env:EXPECTED_PARENT){throw "Commit-boundary remote identity changed: expected=$env:EXPECTED_PARENT actual=$remoteHead"}
          $parent=(git rev-parse HEAD^).Trim().ToLowerInvariant()
          if($parent-cne$env:EXPECTED_PARENT){throw "Local patched commit parent mismatch: expected=$env:EXPECTED_PARENT actual=$parent"}
          Write-Host 'Commit-boundary identity revalidation: PASS'

      - name: Publish exact tested commit to authoritative dev branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git push origin HEAD:refs/heads/dev/manager-4.17.13
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host "Published tested dev head: $env:PATCHED_HEAD"

      - name: Upload patch qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.13-mgr-def-0033-${{ github.run_attempt }}

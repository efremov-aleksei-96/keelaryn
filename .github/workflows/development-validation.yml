name: Manager 4.17.13 rollback preservation patch transaction

on:
  push:
    branches:
      - 'gate/manager-4.17.13-p1-rollback-preservation'

permissions:
  contents: write

concurrency:
  group: keelaryn-manager-41713-rollback-preservation-patch
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout patch runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patcher
          persist-credentials: false

      - name: Checkout authoritative development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/manager-4.17.13
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Apply, validate and publish exact patch transaction
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\patcher\tools\GATE_RUN_41713_MGR_DEF_0033.ps1" -PatcherPath "$env:GITHUB_WORKSPACE\patcher\tools\GATE_APPLY_41713_MGR_DEF_0033.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE\work" -ExpectedHead "5dab4933d9a9430cba629b27693091b7c8613c9f"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload patch qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.13-mgr-def-0033-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\keelaryn-41713-mgr-def-0033\evidence\DEVELOPMENT_VALIDATION.json
            ${{ runner.temp }}\keelaryn-41713-mgr-def-0033\evidence\MANAGER_RISK_CONTEXT.json
            ${{ runner.temp }}\keelaryn-41713-mgr-def-0033\evidence\MANAGER_RISK_CONTEXT.md
            ${{ runner.temp }}\keelaryn-41713-mgr-def-0033\evidence\RISK_DEFECT_GATE_POLICY_CHECK.json
          if-no-files-found: warn
          retention-days: 5

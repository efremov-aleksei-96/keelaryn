          $supp=Get-Content -LiteralPath $suppPath -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($supp.scenarios|Where-Object{[string]$_.id-ceq'ER-104'}).Count-ne0){throw 'ER-104 already exists unexpectedly.'}

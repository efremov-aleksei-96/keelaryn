name: Development validation

on:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'manager/**'
      - 'tests/knowledge/**'
      - 'PUBLIC_FILE_MANIFEST.json'
      - 'PUBLIC_PROVENANCE.json'
      - 'MANAGER_DEVELOPMENT_STATE.json'
      - 'MANAGER_ENGINEERING_ROADMAP.md'
      - 'ASTRA_ESCALATION.md'
      - 'tools/Invoke-DevelopmentValidation.ps1'
      - 'tools/Invoke-ManagerQualificationScheduler.ps1'
      - 'tools/Test-ManagerQualificationProofManifest.ps1'
      - 'tools/Invoke-ManagerHistoricalFlatRegression.ps1'
      - 'tools/Build-PublicFileManifest.ps1'
      - 'tools/Verify-PublicCandidateMetadata.ps1'
      - 'tools/Verify-PublicRepository.ps1'
      - 'tools/Test-ManagerEngineeringKnowledge.ps1'
      - 'tools/Test-ManagerQualificationArchitecture.ps1'
      - 'tools/Build-ManagerEntryReachabilityPlan.ps1'
      - 'tools/Test-ManagerEntryOracleContract.ps1'
      - 'tools/Invoke-ManagerBoundedEntryReachability.ps1'
      - 'tools/Build-ManagerRiskContext.ps1'
      - 'tools/Invoke-ManagerRiskDefectGate.ps1'
      - 'tools/Invoke-ManagerRiskContextRegression.ps1'
      - 'tools/Invoke-Manager41711ReviewRegression.ps1'
      - 'tools/Invoke-Manager41712ReviewRegression.ps1'
      - 'tools/Invoke-ManagerRecoveryBehaviorRegression.ps1'
      - 'tools/Invoke-Manager41713ReviewRegression.ps1'
      - 'tools/Test-ManagerEntryReachabilityKnowledge.ps1'
      - 'tools/Test-ManagerEntryPolicyCompleteness.ps1'
      - 'tools/Invoke-ManagerEntryReachabilityMatrix.ps1'
      - 'tools/Verify-ManagerReleaseInstructions.ps1'
      - 'tools/Invoke-Manager41710ReviewRegression.ps1'
      - 'tools/Invoke-Manager4179ConvergenceRegression.ps1'
      - 'tools/Invoke-Manager4178ReviewRegression.ps1'
      - 'tools/Invoke-Manager4177ReviewRegression.ps1'
      - 'tools/Invoke-Manager4176ReviewRegression.ps1'
      - 'tools/Invoke-Manager4175ReviewRegression.ps1'
      - 'tools/Invoke-Manager4174ReviewRegression.ps1'
      - 'tools/Invoke-Manager4174BootstrapRegression.ps1'
      - 'tools/Invoke-Manager4173ReviewRegression.ps1'
      - 'tools/Invoke-Manager4172ReviewRegression.ps1'
      - 'tools/Verify-DevelopmentGovernance.ps1'
      - 'DEVELOPMENT_GOVERNANCE.json'
      - '.github/workflows/development-validation.yml'
      - '.github/workflows/entry-reachability-validation.yml'
      - '.github/workflows/manager-risk-defect-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-validation:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify development governance
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-DevelopmentGovernance.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify GitHub Actions supply-chain policy
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-GitHubActionsPolicy.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify qualification architecture contract
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Test-ManagerQualificationArchitecture.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify public source manifest reproducibility
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Build-PublicFileManifest.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify public candidate metadata consistency
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicCandidateMetadata.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare development evidence path
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP ('keelaryn-development-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          "KEELARYN_DEVELOPMENT_ROOT=$out" >> $env:GITHUB_ENV
          "KEELARYN_DEVELOPMENT_EVIDENCE=$out\evidence" >> $env:GITHUB_ENV

      - name: Run disposable development validation
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -OutputDirectory "$env:KEELARYN_DEVELOPMENT_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compact development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keelaryn-development-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.KEELARYN_DEVELOPMENT_EVIDENCE }}\DEVELOPMENT_VALIDATION.json
            ${{ env.KEELARYN_DEVELOPMENT_EVIDENCE }}\MANAGER_RISK_CONTEXT.json
            ${{ env.KEELARYN_DEVELOPMENT_EVIDENCE }}\MANAGER_RISK_CONTEXT.md
            ${{ env.KEELARYN_DEVELOPMENT_EVIDENCE }}\QUALIFICATION_EXECUTION_RECEIPT.json
            ${{ env.KEELARYN_DEVELOPMENT_EVIDENCE }}\RISK_DEFECT_GATE_POLICY_CHECK.json
          if-no-files-found: warn
          retention-days: 3

# Engineering knowledge, qualification architecture, compact task risk context, public manifest/provenance consistency and risk-context lifecycle checks are development checks.
# One qualification scheduler owns same-SHA same-boundary behavioral proof execution, including bounded state-machine-driven Entry Reachability. The strict Risk/Defect Gate verifies its exact receipt and does not execute child regressions.
# Historical recursive source adapters are retained byte-for-byte as static provenance identities; current behavioral qualification executes their assertion bodies once through the disposable flat historical runner.
# Legacy count-based Entry artifacts are static migration provenance only; the bounded executor derives its plan from canonical winning-rule/control-flow semantics and runs each selected edge once.
# Changes to the dedicated Entry model workflow also trigger this Development Validation boundary so ownership cannot drift without scheduler revalidation.
# The strict Manager Risk/Defect Gate remains fail-closed while release blockers are open. Source Gate, Full Gate and production acceptance remain separate fresh trust boundaries.
# Manager 4.17.13 remains unqualified and unfrozen until consolidation, product transaction resolution, exact-head validation, full-successor Risk/Defect assessment and fresh semantic/adversarial review all pass.

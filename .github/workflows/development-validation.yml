name: Development validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-full-successor-risk-4.17.13
  cancel-in-progress: false

jobs:
  full-successor-risk-defect-gate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout gate runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebind workspace to exact qualified target
        shell: powershell
        env:
          TARGET_BRANCH: dev/manager-4.17.13
          TARGET_BASE: bdd1fa38ce680304f59764ae7a9482d6b1728053
          TARGET_HEAD: 5dab4933d9a9430cba629b27693091b7c8613c9f
        run: |
          $ErrorActionPreference='Stop'
          $wrapper=(git rev-parse --verify 'HEAD^{commit}').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $parent=(git rev-parse --verify 'HEAD^^{commit}').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if($parent -cne $env:TARGET_HEAD){throw "Gate-runner parent mismatch: expected=$env:TARGET_HEAD actual=$parent"}
          $changed=@(git diff --name-only "$($env:TARGET_HEAD)..$wrapper")
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if($changed.Count -ne 1 -or ([string]$changed[0]) -cne '.github/workflows/development-validation.yml'){
            throw ('Gate-runner isolation mismatch: '+([string]::Join(',',@($changed))))
          }
          $remoteLine=([string](& git ls-remote origin ("refs/heads/"+$env:TARGET_BRANCH))).Trim()
          if($LASTEXITCODE -ne 0 -or -not $remoteLine){throw 'Failed to resolve authoritative remote development branch.'}
          $remoteHead=($remoteLine -split '\s+')[0].ToLowerInvariant()
          if($remoteHead -cne $env:TARGET_HEAD){throw "Authoritative development branch moved: expected=$env:TARGET_HEAD actual=$remoteHead"}
          git checkout --detach $env:TARGET_HEAD
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $actual=(git rev-parse --verify 'HEAD^{commit}').Trim().ToLowerInvariant()
          if($actual -cne $env:TARGET_HEAD){throw "Detached target identity mismatch: expected=$env:TARGET_HEAD actual=$actual"}
          & git merge-base --is-ancestor $env:TARGET_BASE $env:TARGET_HEAD
          if($LASTEXITCODE -ne 0){throw 'Full-successor base is not an ancestor of exact target head.'}
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-full-successor-risk-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          "KEELARYN_RISK_BASE=$env:TARGET_BASE" >> $env:GITHUB_ENV
          "KEELARYN_RISK_HEAD=$env:TARGET_HEAD" >> $env:GITHUB_ENV
          "KEELARYN_RISK_OUT=$out" >> $env:GITHUB_ENV
          Write-Host "Gate runner wrapper: $wrapper"
          Write-Host "Exact target head: $actual"
          Write-Host "Full-successor base: $env:TARGET_BASE"

      - name: Verify exact-target GitHub Actions supply-chain policy
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-GitHubActionsPolicy.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact full-successor Risk Defect Gate
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-ManagerRiskDefectGate.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -BaseCommit "$env:KEELARYN_RISK_BASE" -HeadCommit "$env:KEELARYN_RISK_HEAD" -OutputDirectory "$env:KEELARYN_RISK_OUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact full-successor risk evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-risk-full-successor-5dab4933-${{ github.run_attempt }}
          path: |
            ${{ env.KEELARYN_RISK_OUT }}\RISK_DEFECT_GATE.json
            ${{ env.KEELARYN_RISK_OUT }}\MANAGER_RISK_CONTEXT.json
            ${{ env.KEELARYN_RISK_OUT }}\MANAGER_RISK_CONTEXT.md
          if-no-files-found: error
          retention-days: 3

# Ephemeral gate-runner branch only. The job verifies that this branch differs from the exact target
# solely by this workflow file, validates the authoritative dev branch identity, then detaches the
# workspace back to the exact target head before executing the repository's strict Risk/Defect Gate.

name: Align Framework r24 self-test PASS label

on:
  push:
    branches:
      - 'maintenance/fix-framework-r24-revision-label'

permissions:
  contents: write

jobs:
  align-r24-selftest-label:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/framework-r24
          fetch-depth: 0
          persist-credentials: true

      - name: Align exact self-test PASS label and refresh manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $path=Join-Path $root 'tests\framework\manager-gate\Test-ManagerGateFramework.ps1'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $old='FRAMEWORK r23 SELFTEST: PASS'
          $new='FRAMEWORK r24 SELFTEST: PASS'
          if(([regex]::Matches($text,[regex]::Escape($old))).Count-ne1){throw 'Expected exactly one stale r23 final self-test label.'}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText($path,$text,$utf8)

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $changed=@(& git diff --name-only)
          $expected=@('PUBLIC_FILE_MANIFEST.json','tests/framework/manager-gate/Test-ManagerGateFramework.ps1')
          foreach($p in $expected){if($changed-notcontains$p){throw('Expected change missing: '+$p)}}
          if($changed.Count-ne$expected.Count){throw('Unexpected changes: '+([string]::Join(', ',$changed)))}
          if(@($changed|Where-Object{$_-like'manager/*'}).Count-ne0){throw 'Manager source changed.'}

          git config user.name 'Aleksei Efremov'
          git config user.email 'efremov.aleksei.96@gmail.com'
          git add -- PUBLIC_FILE_MANIFEST.json tests/framework/manager-gate/Test-ManagerGateFramework.ps1
          git commit -m 'Gate Framework r24: align self-test PASS label'
          git push origin HEAD:dev/framework-r24

name: Operation control r0007 production stage prep gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_production_stage.py'
      - 'tests/core/test_operation_control_r0007_production_stage.py'
      - '.github/workflows/operation-control-r0007-production-stage-prep-r0001.yml'
      - 'tools/operation_control_r0007_stage.py'
      - 'tools/operation_control_r0007_vps.py'
      - 'docs/candidates/operation-control-r0007-20260921-01.json'
      - 'docs/evidence/D0_02D_LEGACY_RUNTIME_RECONCILE_2026-09-21T201610Z.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-production-stage-prep-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FROZEN_SOURCE: 833123b6a7ad2c61087ee8a86700bb9ad8a46298
      MATERIALIZER_BLOB: ece36ad98d4a15442f5f081db76345525fe1b8c1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax-check production-stage-prep tooling without residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "tools/operation_control_r0007_production_stage.py",
              "tests/core/test_operation_control_r0007_production_stage.py",
          ):
              raw = Path(name).read_text(encoding="utf-8")
              compile(raw, name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Verify frozen materializer Git identity
        run: |
          set -euo pipefail
          observed="$(git rev-parse "$FROZEN_SOURCE:deploy/zero-based-vps/materialize_payload.py")"
          test "$observed" = "$MATERIALIZER_BLOB"

      - name: Run production-stage-prep regression tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s tests/core -p 'test_operation_control_r0007_production_stage.py' -v
          test -z "$(git status --porcelain)"

      - name: Qualify authorized production-stage surface without VPS mutation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/OPERATION_CONTROL_R0007_PRODUCTION_STAGE_PREP.json"
          stdout="$RUNNER_TEMP/production-stage-prep-stdout.json"

          PYTHONDONTWRITEBYTECODE=1 python3 -B             tools/operation_control_r0007_production_stage.py qualify             --repository-root "$GITHUB_WORKSPACE"             --output "$out"             > "$stdout"

          cmp "$stdout" "$out"

          python3 - "$out" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_scenarios = {
              "authorization_scope": "EXACT_STAGE_ONLY_FAIL_CLOSED",
              "exact_authorized_stage": "STAGED_EXACT_ANCHORS_UNCHANGED",
              "exact_replay": "ALREADY_STAGED_EXACT_NO_PUBLICATION",
              "foreign_destination": "FAIL_CLOSED_UNTOUCHED",
              "interrupted_residue": "RECOVERY_REQUIRED_UNTOUCHED",
              "postpublication_uncertainty": "DURABLE_EXACT_RETAINED_RECONCILE_REQUIRED",
              "mutation_boundary_drift": "ABORTED_BEFORE_PUBLICATION",
              "postpublication_boundary_drift": "EXACT_RELEASE_RETAINED_ACTIVATION_BLOCKED",
          }
          expected_auth = {
              "schema": "keelaryn.operation-control-r0007-production-stage-authorization.v1",
              "scope": "R0007_RELEASE_STAGE_ONLY",
              "candidate": "operation-control-r0007-20260921-01",
              "source_commit": "833123b6a7ad2c61087ee8a86700bb9ad8a46298",
              "source_tree": "bbca9e3a17162e12a7a0f649138e8c469518ad2a",
              "payload_sha256": "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9",
              "payload_size": 414534,
              "file_count": 208,
              "production_stage_authorized": True,
              "activation_authorized": False,
              "drive_content_mutation_authorized": False,
              "legacy_hub_mutation_authorized": False,
              "writer_mutation_authorized": False,
              "credential_mutation_authorized": False,
          }

          if value.get("schema") != "keelaryn.operation-control-r0007-production-stage-prep.v1":
              raise SystemExit("production-stage-prep schema mismatch")
          if value.get("gate_revision") != "operation-control-r0007-production-stage-prep-r0001":
              raise SystemExit("production-stage-prep gate revision mismatch")
          if value.get("candidate") != "operation-control-r0007-20260921-01":
              raise SystemExit("production-stage candidate mismatch")
          if value.get("source_commit") != "833123b6a7ad2c61087ee8a86700bb9ad8a46298":
              raise SystemExit("production-stage source mismatch")
          if value.get("source_tree") != "bbca9e3a17162e12a7a0f649138e8c469518ad2a":
              raise SystemExit("production-stage tree mismatch")
          if value.get("materializer_git_blob") != "ece36ad98d4a15442f5f081db76345525fe1b8c1":
              raise SystemExit("production-stage materializer identity mismatch")

          expected_payload = {
              "source_commit": "833123b6a7ad2c61087ee8a86700bb9ad8a46298",
              "payload_sha256": "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9",
              "payload_size": 414534,
              "file_count": 208,
          }
          if value.get("payload") != expected_payload:
              raise SystemExit("production-stage payload identity mismatch")
          if value.get("authorization_contract") != expected_auth:
              raise SystemExit("production-stage authorization contract mismatch")
          if value.get("scenario_count") != 8:
              raise SystemExit("production-stage scenario count mismatch")
          if value.get("scenarios") != expected_scenarios:
              raise SystemExit(f"production-stage scenarios mismatch: {value.get('scenarios')}")
          if value.get("production_surface_function") != "execute_authorized_stage":
              raise SystemExit("production-stage surface function mismatch")
          if value.get("production_stage_cli_exposed") is not False:
              raise SystemExit("production-stage prep exposes real stage CLI")
          if value.get("real_vps_stage_performed") is not False:
              raise SystemExit("production-stage prep claims a real VPS stage")
          if value.get("activation_implemented") is not False:
              raise SystemExit("production-stage prep unexpectedly implements activation")
          if value.get("release_deletion_allowed") is not False:
              raise SystemExit("production-stage prep permits staged release deletion")
          if value.get("blind_retry_allowed") is not False:
              raise SystemExit("production-stage prep permits blind retry")
          if value.get("fresh_live_revalidation_required") is not True:
              raise SystemExit("production-stage prep omits fresh live revalidation")
          if value.get("postpublication_anchor_reconcile_required") is not True:
              raise SystemExit("production-stage prep omits postpublication anchor reconcile")
          if value.get("legacy_hub_authority_scope") != "RUNTIME_SAFETY_ONLY":
              raise SystemExit("production-stage prep widens legacy Hub authority")
          if value.get("drive_content_mutation_allowed") is not False:
              raise SystemExit("production-stage prep authorizes Drive mutation")
          if value.get("production_mutation_allowed") is not False:
              raise SystemExit("production-stage prep authorizes real production mutation")
          if value.get("production_qualified") is not False:
              raise SystemExit("production-stage prep incorrectly claims production qualification")
          if value.get("next_action") != "AUTHORIZE_AND_EXECUTE_SEPARATE_REAL_STAGE_TRANSACTION":
              raise SystemExit("production-stage next action mismatch")

          recorded = value.get("recorded_live_boundary", {})
          if recorded.get("legacy_hub", {}).get("authority_scope") != "RUNTIME_SAFETY_ONLY":
              raise SystemExit("recorded legacy Hub authority mismatch")
          if recorded.get("r0007_transition_gate") != "PASS":
              raise SystemExit("recorded transition qualification missing")
          PY

          if grep -Eq '"(old_hub_root_id|new_hub_root_id|KEELARYN_GITHUB_OPERATIONS_TOKEN|token)"' "$out"; then
            echo "production-stage-prep evidence leaks forbidden authority material" >&2
            exit 1
          fi

          test -z "$(git status --porcelain)"

      - name: Upload compact production-stage-prep evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0007-production-stage-prep-r0001-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0007_PRODUCTION_STAGE_PREP.json
          if-no-files-found: error
          retention-days: 3

name: Manager 4.13 lifecycle parser diagnostic

on:
  push:
    branches: [manager-4.13.0-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-4.13-lifecycle-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manager-4.13.0-lifecycle
          fetch-depth: 0

      - name: Apply asserted lifecycle patch
        shell: powershell
        run: |
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix1.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix2.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PowerShell parser and executable ASCII diagnostic
        shell: powershell
        run: |
          $install=Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\manager\product\install\INSTALLATION.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $failed=$false
          foreach($rel in @($install.managed_files)){
            $path=Join-Path "$env:GITHUB_WORKSPACE\manager" ([string]$rel).Replace('/','\')
            $ext=[System.IO.Path]::GetExtension($path)
            if($ext-ieq'.ps1'){
              $tokens=$null;$errors=$null
              [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
              foreach($e in @($errors)){
                $failed=$true
                $line=[int]$e.Extent.StartLineNumber
                $column=[int]$e.Extent.StartColumnNumber
                $endLine=[int]$e.Extent.EndLineNumber
                $endColumn=[int]$e.Extent.EndColumnNumber
                $extentText=([string]$e.Extent.Text).Replace("`r",'').Replace("`n",'\\n')
                Write-Host ('PARSER_ERROR file='+$rel+' line='+$line+' column='+$column+' endLine='+$endLine+' endColumn='+$endColumn+' message='+$e.Message+' extent='+$extentText)
                if($line-gt0){
                  $sourceLines=Get-Content -LiteralPath $path -Encoding UTF8
                  $from=[Math]::Max(1,$line-2)
                  $to=[Math]::Min($sourceLines.Count,$line+2)
                  for($n=$from;$n-le$to;$n++){Write-Host ('SOURCE '+$n.ToString().PadLeft(5)+' | '+$sourceLines[$n-1])}
                }
              }
            }
            if($ext-ieq'.ps1' -or $ext-ieq'.cmd'){
              $bytes=[System.IO.File]::ReadAllBytes($path)
              if(@($bytes|Where-Object{$_-ge128}).Count-ne0){
                $failed=$true
                Write-Host ('ASCII_ERROR file='+$rel)
              }
            }
          }
          if($failed){exit 1}
          Write-Host 'MANAGER_4_13_LIFECYCLE_PARSER_DIAGNOSTIC=PASS'

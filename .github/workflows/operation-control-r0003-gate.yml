name: Operation control r0003 gate

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0003_vps.py'
      - '.github/workflows/operation-control-r0003-gate.yml'
      - 'docs/candidates/operation-control-r0003-20260920-01.json'
      - 'docs/candidates/operation-control-r0003-20260920-01.gate.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0003-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SelfTest r0003 qualification driver
        run: |
          set -euo pipefail
          python3 -B tools/operation_control_r0003_vps.py selftest > "$RUNNER_TEMP/selftest.json"
          python3 -m py_compile tools/operation_control_r0003_vps.py

      - name: Rebuild exact frozen r0003 candidate payload
        env:
          FROZEN_COMMIT: 18885db5baa479fde080568b116ff32c0fead07a
          FROZEN_TREE: b77fe079e1ee55f1b9be20d6363ae8c063a8664e
          EXPECTED_PAYLOAD: 80050c8adda76080b91b5d71dd3ce75a6463ef189850e74dd144ff882035fee8
          EXPECTED_SIZE: '348890'
          EXPECTED_COUNT: '188'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          git worktree add --detach "$work" "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git -C "$work" status --porcelain)"

          python3 "$work/deploy/zero-based-vps/build_payload.py" \
            --repo-root "$work" \
            --source-commit "$FROZEN_COMMIT" \
            --output "$RUNNER_TEMP/first.tar.gz" > "$RUNNER_TEMP/first.json"
          python3 "$work/deploy/zero-based-vps/build_payload.py" \
            --repo-root "$work" \
            --source-commit "$FROZEN_COMMIT" \
            --output "$RUNNER_TEMP/second.tar.gz" > "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.tar.gz" "$RUNNER_TEMP/second.tar.gz"

          python3 - "$RUNNER_TEMP/first.json" "$EXPECTED_PAYLOAD" "$EXPECTED_SIZE" "$EXPECTED_COUNT" <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          expected={
              "payload_sha256":sys.argv[2],
              "payload_size":int(sys.argv[3]),
              "file_count":int(sys.argv[4]),
              "source_commit":"18885db5baa479fde080568b116ff32c0fead07a",
          }
          observed={key:v[key] for key in expected}
          if observed != expected:
              raise SystemExit(f"frozen payload mismatch: {observed}")
          PY

      - name: Emit compact r0003 gate evidence
        env:
          OUT: ${{ runner.temp }}/OPERATION_CONTROL_R0003_GATE.json
        run: |
          python3 - "$OUT" <<'PY'
          import json, os, sys
          value={
              "schema":"keelaryn.operation-control-gate-evidence.v1",
              "gate_revision":"operation-control-gate-r0005",
              "candidate":"operation-control-r0003-20260920-01",
              "frozen_source_commit":"18885db5baa479fde080568b116ff32c0fead07a",
              "frozen_source_tree":"b77fe079e1ee55f1b9be20d6363ae8c063a8664e",
              "payload_sha256":"80050c8adda76080b91b5d71dd3ce75a6463ef189850e74dd144ff882035fee8",
              "payload_size":348890,
              "file_count":188,
              "rejected_predecessor":"operation-control-r0002-20260920-01",
              "historical_materialized_predecessor":"operation-control-r0001-20260920-01",
              "driver_selftest":True,
              "driver_read_only_reconcile_surface":True,
              "driver_separate_materialize_surface":True,
              "driver_read_only_qualify_surface":True,
              "driver_bootstrap_resume_surface":True,
              "driver_dedicated_config_dir":True,
              "driver_explicit_status_actor":True,
              "driver_requires_rejected_r0002_release_absent":True,
              "deterministic_rebuild":True,
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "production_qualified":False,
          }
          with open(sys.argv[1],"w",encoding="utf-8",newline="\n") as f:
              json.dump(value,f,ensure_ascii=False,sort_keys=True,separators=(",",":"))
              f.write("\n")
          PY

      - name: Upload compact r0003 gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0003-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0003_GATE.json
          if-no-files-found: error
          retention-days: 3

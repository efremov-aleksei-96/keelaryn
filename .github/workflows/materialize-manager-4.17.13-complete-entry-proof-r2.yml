name: Manager 4.17.13 complete degraded entry proof r2

on:
  push:
    branches:
      - 'maintenance/prefreeze-review-fixes-4.17.13-r1'
    paths:
      - '.github/workflows/materialize-manager-4.17.13-complete-entry-proof-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-4.17.13-init-registry-entry-proof
  cancel-in-progress: true

jobs:
  materialize-and-prove:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout proof materializers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/prefreeze-review-fixes-4.17.13-r1
          path: materializer
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact authoritative development base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/manager-4.17.13
          path: target
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize complete proof R2, qualify exact head, and publish only after green
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='6023c4cf505393820bc803a765e0744eefbabda5'
          $target=Join-Path $env:GITHUB_WORKSPACE 'target'
          $materializer=Join-Path $env:GITHUB_WORKSPACE 'materializer\tools'
          $evidence=Join-Path $env:RUNNER_TEMP 'manager-41713-complete-entry-proof-r2'
          $stage78=Join-Path $evidence 'stage78'
          "KEELARYN_41713_COMPLETE_ENTRY_EVIDENCE=$evidence" >> $env:GITHUB_ENV

          $actual=(git -C $target rev-parse HEAD).Trim().ToLowerInvariant()
          if($actual-cne$base){throw ('Authoritative dev moved before complete proof R2: '+$actual)}

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $materializer 'Materialize-Manager41713InitializeRegistryCoverageR1.ps1') -RepositoryRoot $target -ExpectedBase $base -EvidenceRoot $stage78
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          if(@(git -C $target diff --name-only -- manager).Count-ne0){throw 'Manager product bytes changed in 78-scenario staging proof.'}

          git -C $target config user.name 'Aleksei Efremov'
          git -C $target config user.email 'efremov.aleksei.96@gmail.com'
          git -C $target add -- tests/knowledge/entry-reachability.json tools/Invoke-ManagerEntryReachabilityMatrix.ps1 tools/Test-ManagerEntryReachabilityKnowledge.ps1
          git -C $target commit -m 'TEMP: stage registry-init degraded entry proof'
          if($LASTEXITCODE-ne0){throw 'Temporary 78-scenario staging commit failed.'}
          $stageHead=(git -C $target rev-parse HEAD).Trim().ToLowerInvariant()

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $materializer 'Materialize-Manager41713RegistryDocumentEntryR2.ps1') -RepositoryRoot $target -ExpectedBase $stageHead -EvidenceRoot $evidence
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          if(@(git -C $target diff --name-only -- manager).Count-ne0){throw 'Manager product bytes changed in registry-document R2 proof.'}

          git -C $target reset --soft $base
          if($LASTEXITCODE-ne0){throw 'Failed to collapse temporary proof staging commit.'}
          git -C $target add -- tests/knowledge/entry-reachability.json tools/Invoke-ManagerEntryReachabilityMatrix.ps1 tools/Test-ManagerEntryReachabilityKnowledge.ps1
          $changed=@(git -C $target diff --cached --name-only)
          $expected=@('tests/knowledge/entry-reachability.json','tools/Invoke-ManagerEntryReachabilityMatrix.ps1','tools/Test-ManagerEntryReachabilityKnowledge.ps1')|Sort-Object
          if(([string]::Join('|',@($changed|Sort-Object)))-cne([string]::Join('|',$expected))){throw ('Unexpected final proof patch set: '+($changed-join', '))}
          if(@(git -C $target diff --cached --name-only -- manager).Count-ne0){throw 'Manager product bytes changed in complete proof R2 commit.'}
          git -C $target commit -m 'Manager 4.17.13: complete degraded entry proof'
          if($LASTEXITCODE-ne0){throw 'Complete proof R2 commit failed.'}

          $head=(git -C $target rev-parse HEAD).Trim().ToLowerInvariant()
          $tree=(git -C $target rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          $parent=(git -C $target rev-parse 'HEAD^').Trim().ToLowerInvariant()
          if($parent-cne$base){throw ('Complete proof R2 parent is not exact authoritative base: '+$parent)}
          if(@(git -C $target status --porcelain).Count-ne0){throw 'Complete proof R2 checkout is not clean after final commit.'}

          $matrix=Get-Content -LiteralPath (Join-Path $evidence 'ENTRY_REACHABILITY_RESULT.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if(-not[bool]$matrix.pass-or[int]$matrix.scenario_count-ne92-or[int]$matrix.executed_count-ne92){throw 'Expected exact 92/92 complete entry matrix R2 PASS.'}
          $docDispatch=@($matrix.scenarios|Where-Object{[string]$_.state-ceq'REGISTRY_DOCUMENT_INVALID'-and@('ListInstances','SwitchInstance','BindInstance') -ccontains [string]$_.action})
          if($docDispatch.Count-ne3-or@($docDispatch|Where-Object{-not[bool]$_.pass-or-not([string]$_.detail).Contains('reached action-level registry parsing')}).Count-ne0){throw 'Action-level invalid-registry dispatch proof is incomplete.'}

          $env:GITHUB_SHA=$head
          $devOut=Join-Path $evidence 'development-validation'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $target 'tools\Invoke-DevelopmentValidation.ps1') -RepositoryRoot $target -OutputDirectory $devOut
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $riskOut=Join-Path $evidence 'full-successor-risk-gate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $target 'tools\Invoke-ManagerRiskDefectGate.ps1') -RepositoryRoot $target -BaseCommit 'bdd1fa38ce680304f59764ae7a9482d6b1728053' -HeadCommit $head -OutputDirectory $riskOut
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $receipt=[ordered]@{
            schema='keelaryn.manager-prefreeze-complete-entry-proof.v2'
            manager_version='4.17.13'
            base=$base
            head=$head
            tree=$tree
            full_successor_base='bdd1fa38ce680304f59764ae7a9482d6b1728053'
            product_bytes_changed=$false
            entry_matrix_scenarios=92
            bind_changed_path_rebind_proof='inherited-pass'
            update_manager_install_restart_proof='inherited-pass'
            registry_init_invalid_active_entry_proof='pass'
            registry_document_invalid_entry_proof='pass'
            registry_document_action_dispatch_proof='pass'
            rejected_control_state_immutability='pass'
            development_validation='pass'
            full_successor_risk_defect_gate='pass'
            candidate_issued=$false
            production_qualified=$false
            completed_utc=[DateTime]::UtcNow.ToString('o')
          }
          $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'PREFREEZE_COMPLETE_ENTRY_PROOF.json') -Encoding UTF8

          Write-Host ('Validated complete proof R2 head: '+$head) -ForegroundColor Green
          Write-Host ('Validated complete proof R2 tree: '+$tree) -ForegroundColor Green
          git -C $target push origin HEAD:dev/manager-4.17.13
          if($LASTEXITCODE-ne0){throw 'Authoritative dev push failed.'}

      - name: Upload complete entry-proof R2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.13-complete-entry-proof-r2-${{ github.run_attempt }}
          path: ${{ env.KEELARYN_41713_COMPLETE_ENTRY_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 5

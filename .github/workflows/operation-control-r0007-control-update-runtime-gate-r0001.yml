name: Operation control r0007 control update runtime gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_control_update_runtime.py'
      - 'tools/operation_control_r0007_private_input.py'
      - 'deploy/zero-based-vps/operation_control_d0_update.py'
      - 'tests/core/test_operation_control_r0007_control_update_runtime.py'
      - '.github/workflows/operation-control-r0007-control-update-runtime-gate-r0001.yml'
      - 'docs/evidence/R0007_POST_STAGE_RECONCILE_*.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-control-update-runtime-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify post-stage authority and frozen transition identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("docs/evidence/R0007_POST_STAGE_RECONCILE_20260923.json")
              .read_text(encoding="utf-8")
          )
          if evidence.get("conclusion") != "PASS_POST_STAGE_COMPLETED_EXACT_CONTROL_PREDECESSOR_UNCHANGED":
              raise SystemExit("post-stage evidence is not exact PASS")
          if evidence.get("execution", {}).get("state") != "COMPLETED_EXACT":
              raise SystemExit("stage execution is not terminal exact")
          if evidence.get("execution", {}).get("release_state") != "STAGED_EXACT":
              raise SystemExit("r0007 release is not staged exact")
          if evidence.get("live_boundary", {}).get("control_source_commit") != "08f2e211f53764590f6ff0f05f86b2de62c14418":
              raise SystemExit("control predecessor mismatch")

          candidate = json.loads(
              Path("docs/candidates/operation-control-r0007-20260921-01.json")
              .read_text(encoding="utf-8")
          )
          if candidate.get("frozen_source_commit") != "833123b6a7ad2c61087ee8a86700bb9ad8a46298":
              raise SystemExit("frozen r0007 source mismatch")
          if candidate.get("payload", {}).get("sha256") != "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9":
              raise SystemExit("frozen r0007 payload mismatch")
          PY

      - name: Syntax-check control update runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0007_control_update_runtime.py",
              "tests/core/test_operation_control_r0007_control_update_runtime.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run control update runtime regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0007_control_update_runtime.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove narrow fixed production surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0007_control_update_runtime.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "update")',
              'INSTALL_ROOT = Path("/opt/keelaryn")',
              'UNIT_DIR = Path("/etc/systemd/system")',
              'UPDATE_ROOT = Path("/var/lib/keelaryn/operation-control-d0-updates")',
              'OLD_SOURCE = "08f2e211f53764590f6ff0f05f86b2de62c14418"',
              'NEW_SOURCE = "833123b6a7ad2c61087ee8a86700bb9ad8a46298"',
              'updater.update_d0_control_plane(',
              '"production_current_mutation_performed": False',
              '"legacy_hub_mutation_performed": False',
              '"drive_mutations_performed": False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing control-update safety contract: {needle}")
          forbidden = (
              'parser.add_argument("--install-root"',
              'parser.add_argument("--unit-dir"',
              'parser.add_argument("--credential-path"',
              'parser.add_argument("--operation-root"',
              'parser.add_argument("--transport-root"',
              'parser.add_argument("--update-root"',
              'parser.add_argument("--expected-old',
              'parser.add_argument("--expected-new',
              '"activate"',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe control-update surface: {needle}")
          PY

name: Operation control r0009 stage runtime gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0009_stage_runtime.py'
      - 'tools/operation_control_r0009_private_input.py'
      - 'tools/operation_control_r0009_stage_execution.py'
      - 'tests/core/test_operation_control_r0009_stage_runtime.py'
      - '.github/workflows/operation-control-r0009-stage-runtime-gate-r0001.yml'
      - 'docs/authorizations/operation-control-r0009-stage/**'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact authority remains inert-stage-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("docs/authorizations/operation-control-r0009-stage/92aea51ee7f80a8e8b84fffa9315bf9e.json")
          raw = path.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          if hashlib.sha256(raw).hexdigest() != "56c16168d4ad473757342251c2791fd148ef578630136f7626226425257b4919":
              raise SystemExit("r0009 authority SHA mismatch")
          if value.get("transaction_id") != "92aea51ee7f80a8e8b84fffa9315bf9e":
              raise SystemExit("r0009 authority transaction mismatch")
          if value.get("issuer_checkpoint") != "86aa3a92f860d9ab96ad54c6d75f9adbcf723026":
              raise SystemExit("r0009 authority issuer checkpoint mismatch")
          if value.get("boundary_evidence_sha256") != "d6ea834ff31d9a5269cee573009c256f6871e437ba5635c8d047602d8b1f0117":
              raise SystemExit("r0009 authority boundary SHA mismatch")
          if value.get("production_stage_authorized") is not True:
              raise SystemExit("stage permission absent")
          for key in (
              "activation_authorized",
              "drive_content_mutation_authorized",
              "legacy_hub_mutation_authorized",
              "writer_mutation_authorized",
              "credential_mutation_authorized",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"unsafe authority flag: {key}")
          PY

      - name: Compile stage-runtime tooling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0009_stage_runtime.py",
              "tests/core/test_operation_control_r0009_stage_runtime.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run stage-runtime regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s tests/core -p 'test_operation_control_r0009_stage_runtime.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove isolated narrow inert-stage surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0009_stage_runtime.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "stage")',
              'DEFAULT_INPUT_ROOT = private_input.DEFAULT_INPUT_ROOT',
              '/var/lib/keelaryn/operation-control/r0009-stage-witness',
              '/opt/keelaryn/releases',
              'execution.execute_once(',
              'activation_performed": False',
              'drive_mutations_performed": False',
              'release_publication_performed": None if stage_command else False',
              'stage_witness_mutation_performed": None if stage_command else False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing r0009 stage-runtime contract: {needle}")
          forbidden = (
              '/r0007-stage-input',
              '/r0007-stage-witness',
              '/r0008-stage-input',
              '/r0008-stage-witness',
              'parser.add_argument("--input-root"',
              'parser.add_argument("--witness-root"',
              'parser.add_argument("--releases-root"',
              'parser.add_argument("--repository-root"',
              '"activate"',
              'release_switch',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe/stale stage-runtime surface: {needle}")
          PY

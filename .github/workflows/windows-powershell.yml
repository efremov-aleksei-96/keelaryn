name: Windows PowerShell validation

# Deliberately manual-only.
#
# Keelaryn development and release gates run locally under tests/work. GitHub
# Actions is a public/milestone verification layer, not the primary development
# runner. This prevents every local development push from consuming hosted
# runner quota while a repository is private and keeps portfolio CI history
# focused on meaningful checkpoints.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-public-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-validation:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Manager version
        id: manager
        shell: powershell
        run: |
          $manager = Join-Path $env:GITHUB_WORKSPACE 'manager'
          $version = (Get-Content (Join-Path $manager '_manager_version.txt') -Raw -Encoding UTF8).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid Manager version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Manager version: $version"

      - name: Verify public repository boundary
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Manager SelfTest
        shell: powershell
        run: |
          $manager = Join-Path $env:GITHUB_WORKSPACE 'manager'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $manager 'Keelaryn__Manager.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build AI_CONTEXT
        shell: powershell
        run: |
          $manager = Join-Path $env:GITHUB_WORKSPACE 'manager'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $manager 'Keelaryn__Manager.ps1') -BuildAIContext
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deterministic BUILD_RELEASE x2
        shell: powershell
        run: |
          $manager = Join-Path $env:GITHUB_WORKSPACE 'manager'
          $script = Join-Path $manager 'Keelaryn__Manager.ps1'
          $version = '${{ steps.manager.outputs.version }}'
          $releasePath = Join-Path $manager "_releases\Keelaryn__Manager_RELEASE_v$version.json"

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -BuildRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = Get-Content $releasePath -Raw -Encoding UTF8 | ConvertFrom-Json
          $first = @{}
          foreach ($a in $release.artifacts) {
            $first[$a.role] = (Get-FileHash (Join-Path (Join-Path $manager '_releases') $a.path) -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -BuildRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release2 = Get-Content $releasePath -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($a in $release2.artifacts) {
            $actual = (Get-FileHash (Join-Path (Join-Path $manager '_releases') $a.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($first[$a.role] -ne $actual) {
              throw "Non-deterministic artifact: $($a.role)"
            }
          }

name: Windows source validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public repository boundary
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate current framework source gate
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $manager = Join-Path $root 'manager'
          $install = Get-Content (Join-Path $manager 'product\install\INSTALLATION.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $prov = Get-Content (Join-Path $root 'PUBLIC_PROVENANCE.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$install.manager_version
          $baseline = [string]$prov.source_gate_baseline_manager_version
          $builder = Join-Path $root 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          $gateZip = Join-Path $root ('tests\manager-' + $version + '.zip')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $builder -SourceRoot $manager -BaselineVersion $baseline -GateRevision 9001 -OutputPath $gateZip -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $work = Join-Path $root 'tests\work'
          Expand-Archive -LiteralPath $gateZip -DestinationPath $work -Force
          "candidate=$work\manager-$version" >> $env:GITHUB_ENV
          "gate_zip=$gateZip" >> $env:GITHUB_ENV
          "gate_version=$version" >> $env:GITHUB_ENV

      - name: Run Hub-blind SourceGate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:candidate\gate\Run-KeelarynManagerSourceGate.ps1" -ManagerRoot "$env:candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish exact SourceGate-qualified Manager gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keelaryn-manager-gate-${{ env.gate_version }}-${{ github.sha }}
          path: ${{ env.gate_zip }}
          if-no-files-found: error
          retention-days: 7

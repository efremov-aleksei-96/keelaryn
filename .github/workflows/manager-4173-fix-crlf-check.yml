name: Manager 4.17.3 harness CRLF fix

on:
  push:
    branches: ['dev/manager-4.17.3']
    paths: ['.github/workflows/manager-4173-fix-crlf-check.yml']

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: dev/manager-4.17.3
      - name: Make authoritative Windows diff check CRLF-aware
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE '.github\workflows\manager-4173-corrective-patch.yml'
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $old='git diff --cached --check;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}'
          $new='git -c core.whitespace=cr-at-eol diff --cached --check;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}'
          $first=$text.IndexOf($old,[StringComparison]::Ordinal)
          if($first-lt0){throw 'Expected non-CRLF-aware diff check not found.'}
          if($text.IndexOf($old,$first+$old.Length,[StringComparison]::Ordinal)-ge0){throw 'Diff-check patch anchor is not unique.'}
          $text=$text.Substring(0,$first)+$new+$text.Substring($first+$old.Length)
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          git diff -- .github/workflows/manager-4173-corrective-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/manager-4173-corrective-patch.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git commit -m 'Development: make 4.17.3 patch diff check CRLF-aware'
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git push origin HEAD:dev/manager-4.17.3
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

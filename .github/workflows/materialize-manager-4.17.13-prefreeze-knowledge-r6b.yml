name: Manager 4.17.13 prefreeze knowledge convergence r6b

on:
  push:
    branches:
      - 'maintenance/prefreeze-review-fixes-4.17.13-r1'
    paths:
      - '.github/workflows/materialize-manager-4.17.13-prefreeze-knowledge-r6b.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-4.17.13-prefreeze-knowledge-r6
  cancel-in-progress: true

jobs:
  materialize-and-prove:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - name: Checkout proof materializers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/prefreeze-review-fixes-4.17.13-r1
          path: materializer
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact authoritative development base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/manager-4.17.13
          path: target
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize R6b, qualify exact head, and publish only after green
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='6023c4cf505393820bc803a765e0744eefbabda5'
          $fullSuccessorBase='bdd1fa38ce680304f59764ae7a9482d6b1728053'
          $target=Join-Path $env:GITHUB_WORKSPACE 'target'
          $materializer=Join-Path $env:GITHUB_WORKSPACE 'materializer\tools\Materialize-Manager41713PrefreezeKnowledgeR6b.ps1'
          $evidence=Join-Path $env:RUNNER_TEMP 'manager-41713-prefreeze-knowledge-r6b'
          New-Item -ItemType Directory -Force -Path $evidence|Out-Null
          "KEELARYN_41713_R6B_EVIDENCE=$evidence" >> $env:GITHUB_ENV

          $actual=(git -C $target rev-parse HEAD).Trim().ToLowerInvariant()
          if($actual-cne$base){throw ('Authoritative dev moved before R6b materialization: '+$actual)}

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $materializer -RepositoryRoot $target -ExpectedBase $base -EvidenceRoot $evidence
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          if(@(git -C $target diff --name-only -- manager).Count-ne0){throw 'Manager product bytes changed in R6b knowledge convergence.'}

          git -C $target config user.name 'Aleksei Efremov'
          git -C $target config user.email 'efremov.aleksei.96@gmail.com'
          git -C $target add -- .github/workflows/entry-reachability-validation.yml MANAGER_DEVELOPMENT_STATE.json PUBLIC_PROVENANCE.json tests/knowledge/entry-reachability.json tests/knowledge/prefreeze-semantic-review.json tests/knowledge/risk-map.json tests/knowledge/state-machines/multi-hub.json tools/Invoke-ManagerEntryReachabilityMatrix.ps1 tools/Test-ManagerEngineeringKnowledge.ps1 tools/Test-ManagerEntryReachabilityKnowledge.ps1
          $changed=@(git -C $target diff --cached --name-only)
          $expected=@('.github/workflows/entry-reachability-validation.yml','MANAGER_DEVELOPMENT_STATE.json','PUBLIC_PROVENANCE.json','tests/knowledge/entry-reachability.json','tests/knowledge/prefreeze-semantic-review.json','tests/knowledge/risk-map.json','tests/knowledge/state-machines/multi-hub.json','tools/Invoke-ManagerEntryReachabilityMatrix.ps1','tools/Test-ManagerEngineeringKnowledge.ps1','tools/Test-ManagerEntryReachabilityKnowledge.ps1')|Sort-Object
          if(([string]::Join('|',@($changed|Sort-Object)))-cne([string]::Join('|',$expected))){throw ('Unexpected staged R6b patch set: '+($changed-join', '))}
          if(@(git -C $target diff --cached --name-only -- manager).Count-ne0){throw 'Manager product bytes are staged unexpectedly.'}
          git -C $target commit -m 'Manager 4.17.13: converge prefreeze knowledge model'
          if($LASTEXITCODE-ne0){throw 'R6b commit failed.'}

          $head=(git -C $target rev-parse HEAD).Trim().ToLowerInvariant()
          $tree=(git -C $target rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          $parent=(git -C $target rev-parse 'HEAD^').Trim().ToLowerInvariant()
          if($parent-cne$base){throw ('R6b parent mismatch: '+$parent)}
          if(@(git -C $target status --porcelain).Count-ne0){throw 'R6b checkout is not clean after commit.'}

          $matrix=Get-Content -LiteralPath (Join-Path $evidence 'r5\ENTRY_REACHABILITY_RESULT.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if(-not[bool]$matrix.pass-or[int]$matrix.scenario_count-ne96-or[int]$matrix.executed_count-ne96){throw 'R6b requires exact 96/96 entry matrix PASS.'}

          $env:GITHUB_SHA=$head
          $devOut=Join-Path $evidence 'development-validation'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $target 'tools\Invoke-DevelopmentValidation.ps1') -RepositoryRoot $target -OutputDirectory $devOut
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $riskOut=Join-Path $evidence 'full-successor-risk-gate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $target 'tools\Invoke-ManagerRiskDefectGate.ps1') -RepositoryRoot $target -BaseCommit $fullSuccessorBase -HeadCommit $head -OutputDirectory $riskOut
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $receipt=[ordered]@{
            schema='keelaryn.manager-prefreeze-knowledge-convergence.v3'
            manager_version='4.17.13'
            base=$base
            head=$head
            tree=$tree
            full_successor_base=$fullSuccessorBase
            classification='qualification_knowledge_state_machine_risk_map_ci_trigger'
            product_bytes_changed=$false
            entry_matrix_scenarios=96
            registry_document_invalid_scenarios=18
            state_machine_entry_oracle_consistency='pass'
            nondefault_state_machine_risk_mapping='complete'
            entry_workflow_state_machine_trigger='bound'
            current_degraded_initialize_semantics='explicit_success_without_old_current_dependency'
            pending_global_initialize_semantics='explicit_identity_bound_reconciliation'
            invalid_registry_initialize_semantics='operation_specific_rejection_after_dispatch'
            development_validation='pass'
            full_successor_risk_defect_gate='pass'
            candidate_issued=$false
            production_qualified=$false
            completed_utc=[DateTime]::UtcNow.ToString('o')
          }
          $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'PREFREEZE_KNOWLEDGE_CONVERGENCE.json') -Encoding UTF8

          Write-Host ('Validated R6b head: '+$head) -ForegroundColor Green
          Write-Host ('Validated R6b tree: '+$tree) -ForegroundColor Green
          git -C $target push origin HEAD:dev/manager-4.17.13
          if($LASTEXITCODE-ne0){throw 'Authoritative dev push failed.'}

      - name: Upload R6b qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.13-prefreeze-knowledge-r6b-${{ github.run_attempt }}
          path: ${{ env.KEELARYN_41713_R6B_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 5

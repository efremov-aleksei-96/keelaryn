name: Release policy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: keelaryn-release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enforce conditional distribution gate
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:EVENT_NAME-ne'pull_request'){
            Write-Host 'Manual release-policy validation: no PR dependency to enforce.' -ForegroundColor DarkGray
            exit 0
          }
          foreach($value in @($env:BASE_SHA,$env:HEAD_SHA)){
            if([string]::IsNullOrWhiteSpace($value)-or$value-notmatch'^[0-9a-fA-F]{40}$'){throw 'Release policy is missing a valid PR base/head SHA.'}
            & git cat-file -e ($value+'^{commit}')
            if($LASTEXITCODE-ne0){throw ('Release policy checkout is missing commit '+$value)}
          }

          $diffLines=@(& git diff --name-only --no-renames $env:BASE_SHA $env:HEAD_SHA 2>&1)
          if($LASTEXITCODE-ne0){throw ('git diff failed: '+(($diffLines|ForEach-Object{[string]$_})-join'; '))}
          $files=@($diffLines|ForEach-Object{([string]$_).Trim().Replace('\','/')}|Where-Object{$_})
          if($files.Count-eq0){throw 'Release policy found an empty PR diff.'}

          $governancePath=Join-Path $env:GITHUB_WORKSPACE 'REPOSITORY_GOVERNANCE.json'
          $governance=Get-Content -LiteralPath $governancePath -Raw -Encoding UTF8|ConvertFrom-Json
          $criticalPatterns=@($governance.release_policy.critical_paths|ForEach-Object{([string]$_).Trim()}|Where-Object{$_})
          if($criticalPatterns.Count-eq0){throw 'Repository governance release-critical path set is empty.'}
          if(@($criticalPatterns|Select-Object -Unique).Count-ne$criticalPatterns.Count){throw 'Repository governance release-critical paths contain duplicates.'}

          function Test-ReleaseCritical([string]$Path){
            foreach($pattern in $criticalPatterns){
              if($pattern.EndsWith('/**',[System.StringComparison]::Ordinal)){
                $prefix=$pattern.Substring(0,$pattern.Length-2)
                if($Path.StartsWith($prefix,[System.StringComparison]::Ordinal)){return $true}
              }elseif($Path.Equals($pattern,[System.StringComparison]::Ordinal)){
                return $true
              }
            }
            return $false
          }

          $critical=@($files|Where-Object{Test-ReleaseCritical ([string]$_)})
          if($critical.Count-eq0){
            Write-Host ('Release policy PASS: non-release PR; diff_files='+$files.Count) -ForegroundColor Green
            exit 0
          }

          Write-Host ('Release-critical PR detected. diff_files='+$files.Count+'; critical_files='+$critical.Count+'; waiting for distribution-gate on '+$env:HEAD_SHA) -ForegroundColor Cyan
          foreach($path in $critical){Write-Host ('  '+$path) -ForegroundColor DarkGray}

          $headers=@{
            'Accept'='application/vnd.github+json'
            'Authorization'='Bearer '+$env:GITHUB_TOKEN
            'User-Agent'='Keelaryn-Release-Policy'
            'X-GitHub-Api-Version'='2026-03-10'
          }
          $api='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY
          $deadline=(Get-Date).AddMinutes(35)
          while((Get-Date)-lt$deadline){
            $doc=Invoke-RestMethod -Method Get -Uri ($api+'/commits/'+$env:HEAD_SHA+'/check-runs?per_page=100') -Headers $headers -UseBasicParsing
            $matches=@($doc.check_runs|Where-Object{[string]$_.name-eq'distribution-gate'}|Sort-Object {[DateTimeOffset]::Parse([string]$_.started_at)} -Descending)
            if($matches.Count-gt0){
              $latest=$matches[0]
              $status=[string]$latest.status
              $conclusion=[string]$latest.conclusion
              if($status-eq'completed'){
                if($conclusion-eq'success'){
                  Write-Host ('Release policy PASS: distribution-gate succeeded for '+$env:HEAD_SHA) -ForegroundColor Green
                  exit 0
                }
                throw ('Release policy blocked: distribution-gate completed with '+$conclusion+'.')
              }
              Write-Host ('distribution-gate status='+$status+'; waiting...') -ForegroundColor DarkGray
            }else{
              Write-Host 'distribution-gate has not appeared yet; waiting...' -ForegroundColor DarkGray
            }
            Start-Sleep -Seconds 10
          }
          throw 'Release policy timed out waiting for distribution-gate on the exact current PR head.'

name: Release policy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: keelaryn-release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Enforce conditional distribution gate
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:EVENT_NAME-ne'pull_request'){
            Write-Host 'Manual release-policy validation: no PR dependency to enforce.' -ForegroundColor DarkGray
            exit 0
          }
          if([string]::IsNullOrWhiteSpace($env:PR_NUMBER)-or[string]::IsNullOrWhiteSpace($env:HEAD_SHA)){throw 'Release policy is missing PR identity.'}

          $headers=@{
            'Accept'='application/vnd.github+json'
            'Authorization'='Bearer '+$env:GITHUB_TOKEN
            'User-Agent'='Keelaryn-Release-Policy'
            'X-GitHub-Api-Version'='2026-03-10'
          }
          $api='https://api.github.com/repos/'+$env:GITHUB_REPOSITORY

          $files=@()
          $page=1
          while($true){
            $batch=@(Invoke-RestMethod -Method Get -Uri ($api+'/pulls/'+$env:PR_NUMBER+'/files?per_page=100&page='+$page) -Headers $headers -UseBasicParsing)
            $files += $batch
            if($batch.Count-lt100){break}
            $page++
            if($page-gt30){throw 'PR file list exceeds release-policy pagination safety limit.'}
          }

          function Test-ReleaseCritical([string]$Path){
            if($Path-eq'.github/workflows/public-release.yml'){return $true}
            if($Path.StartsWith('manager/',[System.StringComparison]::Ordinal)){return $true}
            if($Path-eq'PUBLIC_PROVENANCE.json'){return $true}
            if($Path-eq'REPOSITORY_GOVERNANCE.json'){return $true}
            if($Path-eq'README.md'){return $true}
            if($Path-eq'GETTING_STARTED.md'){return $true}
            if($Path-eq'docs/USING_WITH_CHATGPT.md'){return $true}
            if($Path-eq'docs/TROUBLESHOOTING.md'){return $true}
            return $false
          }

          $critical=@($files|Where-Object{Test-ReleaseCritical ([string]$_.filename)})
          if($critical.Count-eq0){
            Write-Host ('Release policy PASS: non-release PR; files='+$files.Count) -ForegroundColor Green
            exit 0
          }

          Write-Host ('Release-critical PR detected. files='+$critical.Count+'; waiting for distribution-gate on '+$env:HEAD_SHA) -ForegroundColor Cyan
          foreach($row in $critical){Write-Host ('  '+[string]$row.filename) -ForegroundColor DarkGray}

          $deadline=(Get-Date).AddMinutes(35)
          while((Get-Date)-lt$deadline){
            $doc=Invoke-RestMethod -Method Get -Uri ($api+'/commits/'+$env:HEAD_SHA+'/check-runs?per_page=100') -Headers $headers -UseBasicParsing
            $matches=@($doc.check_runs|Where-Object{[string]$_.name-eq'distribution-gate'}|Sort-Object {[DateTimeOffset]::Parse([string]$_.started_at)} -Descending)
            if($matches.Count-gt0){
              $latest=$matches[0]
              $status=[string]$latest.status
              $conclusion=[string]$latest.conclusion
              if($status-eq'completed'){
                if($conclusion-eq'success'){
                  Write-Host ('Release policy PASS: distribution-gate succeeded for '+$env:HEAD_SHA) -ForegroundColor Green
                  exit 0
                }
                throw ('Release policy blocked: distribution-gate completed with '+$conclusion+'.')
              }
              Write-Host ('distribution-gate status='+$status+'; waiting...') -ForegroundColor DarkGray
            }else{
              Write-Host 'distribution-gate has not appeared yet; waiting...' -ForegroundColor DarkGray
            }
            Start-Sleep -Seconds 10
          }
          throw 'Release policy timed out waiting for distribution-gate on the current PR head.'

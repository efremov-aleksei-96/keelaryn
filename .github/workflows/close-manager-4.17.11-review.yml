name: Close Manager 4.17.11 review blockers

on:
  push:
    branches:
      - 'dev/manager-4.17.11'
    paths:
      - '.github/workflows/close-manager-4.17.11-review.yml'

permissions:
  contents: write

concurrency:
  group: keelaryn-close-manager-4.17.11-review
  cancel-in-progress: false

jobs:
  close-review:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize one-shot script for Windows PowerShell 5.1
        shell: powershell
        run: |
          $p=Join-Path $env:GITHUB_WORKSPACE 'tools\Close-Manager41711Review.ps1'
          $utf8=New-Object Text.UTF8Encoding($false)
          $text=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8)
          $text=$text.Replace([string][char]0x2014,'-')
          [IO.File]::WriteAllText($p,$text,$utf8)

      - name: Execute coherent review closure transaction
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Close-Manager41711Review.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

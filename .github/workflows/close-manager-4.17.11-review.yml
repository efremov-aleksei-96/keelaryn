name: Close Manager 4.17.11 review blockers

on:
  push:
    branches:
      - 'dev/manager-4.17.11'
    paths:
      - '.github/workflows/close-manager-4.17.11-review.yml'

permissions:
  contents: write

concurrency:
  group: keelaryn-close-manager-4.17.11-review
  cancel-in-progress: false

jobs:
  close-review:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact closure base and review evidence controls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedParent='89d593b261b4e432fef2f62484cfbf3293ecf4cc'
          $parent=(git rev-parse HEAD^).Trim()
          if($parent-cne$expectedParent){throw('Unexpected closure parent: '+$parent+' expected='+$expectedParent)}
          $changed=@(git diff --name-only HEAD^ HEAD)
          if($changed.Count-ne1-or[string]$changed[0]-cne'.github/workflows/close-manager-4.17.11-review.yml'){throw('Unexpected closure bootstrap diff: '+([string]::Join(', ',@($changed))))}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-ManagerReleaseInstructions.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-Manager41711ReviewRegression.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Materialize durable defect closure and canonical validation integration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $root=$env:GITHUB_WORKSPACE
          $utf8=New-Object Text.UTF8Encoding($false)
          function Read-Json([string]$rel){Get-Content -LiteralPath (Join-Path $root $rel) -Raw -Encoding UTF8|ConvertFrom-Json}
          function Write-Json([string]$rel,$obj){
            $text=(($obj|ConvertTo-Json -Depth 60).Replace("`r`n","`n"))+"`n"
            [IO.File]::WriteAllText((Join-Path $root $rel),$text,$utf8)
          }
          function Add-UniqueString($values,[string]$value){
            $rows=@($values|ForEach-Object{[string]$_})
            if($rows-cnotcontains$value){$rows+=,$value}
            return @($rows)
          }
          function Replace-Once([string]$text,[string]$old,[string]$new,[string]$label){
            $first=$text.IndexOf($old,[StringComparison]::Ordinal)
            if($first-lt0){throw($label+' old text not found.')}
            if($text.IndexOf($old,$first+$old.Length,[StringComparison]::Ordinal)-ge0){throw($label+' old text is not unique.')}
            return $text.Substring(0,$first)+$new+$text.Substring($first+$old.Length)
          }

          $defRel='tests\knowledge\defects\manager-4.17.10-postfreeze.json'
          $def=Read-Json $defRel
          foreach($id in @('MGR-DEF-0024','MGR-DEF-0025')){
            $row=@($def.defects|Where-Object{[string]$_.id-ceq$id})
            if($row.Count-ne1){throw('Defect record count for '+$id+'='+$row.Count)}
            if([string]$row[0].status-cne'open'){throw($id+' must still be open before closure.')}
            $row[0].status='fixed'
            $row[0].fixed_in='4.17.11'
            $row[0].planned_regressions=@()
            if($id-ceq'MGR-DEF-0024'){$row[0].permanent_regressions=@('tools/Invoke-Manager41711ReviewRegression.ps1')}
            else{$row[0].permanent_regressions=@('tools/Verify-ManagerReleaseInstructions.ps1')}
            $e=@($row[0].evidence)
            $e+=,[pscustomobject]@{type='review_closure_workflow';id='34769051128';head='89d593b261b4e432fef2f62484cfbf3293ecf4cc'}
            $row[0].evidence=@($e)
          }
          Write-Json $defRel $def

          $auditRel='tests\knowledge\audits\post-4.17.10-public-review.json'
          $audit=Read-Json $auditRel
          if([string]$audit.audit_id-cne'MHA-41710-001'){throw 'Unexpected 4.17.10 audit identity.'}
          $audit.confirmed_open_defects=@()
          if($audit.PSObject.Properties.Name-cnotcontains'resolved_defects'){$audit|Add-Member -NotePropertyName resolved_defects -NotePropertyValue @('MGR-DEF-0024')}
          else{$audit.resolved_defects=@('MGR-DEF-0024')}
          $resolution=[pscustomobject]@{status='resolved';manager_version='4.17.11';permanent_regression='tools/Invoke-Manager41711ReviewRegression.ps1';evidence_run_id='34769051128';evidence_head='89d593b261b4e432fef2f62484cfbf3293ecf4cc'}
          if($audit.PSObject.Properties.Name-cnotcontains'resolution'){$audit|Add-Member -NotePropertyName resolution -NotePropertyValue $resolution}else{$audit.resolution=$resolution}
          Write-Json $auditRel $audit

          $riskRel='tests\knowledge\risk-map.json'
          $risk=Read-Json $riskRel
          foreach($sid in @('S-RUNTIME-INBOX','S-RUNTIME-HUB-UPDATE')){
            $surface=@($risk.surfaces|Where-Object{[string]$_.id-ceq$sid})
            if($surface.Count-ne1){throw('Risk surface count '+$sid+'='+$surface.Count)}
            $surface[0].regressions=Add-UniqueString $surface[0].regressions 'tools/Invoke-Manager41711ReviewRegression.ps1'
          }
          $ci=@($risk.surfaces|Where-Object{[string]$_.id-ceq'S-CI-DEVELOPMENT'})
          if($ci.Count-ne1){throw('S-CI-DEVELOPMENT count='+$ci.Count)}
          $ci[0].paths=Add-UniqueString $ci[0].paths 'tools/Verify-ManagerReleaseInstructions.ps1'
          $ci[0].regressions=Add-UniqueString $ci[0].regressions 'tools/Verify-ManagerReleaseInstructions.ps1'
          Write-Json $riskRel $risk

          $stateRel='MANAGER_DEVELOPMENT_STATE.json'
          $state=Read-Json $stateRel
          if([string]$state.lifecycle_state-cne'unqualified_development'-or[string]$state.authoritative_branch-cne'dev/manager-4.17.11'){throw 'Development state is not the expected 4.17.11 successor state.'}
          if([string]::Join('|',@($state.open_release_blockers))-cne'MGR-DEF-0024|MGR-DEF-0025'){throw 'Unexpected pre-closure blocker set.'}
          $state.open_release_blockers=@()
          $state.qualification.risk_defect_gate.status='required_pass_before_freeze'
          $state.qualification.risk_defect_gate.observed_status='pending_exact_head_development_validation_after_review_closure'
          $state.qualification.manager_4_17_11.review_closure='pass'
          if($state.qualification.manager_4_17_11.PSObject.Properties.Name-cnotcontains'review_closure_run_id'){$state.qualification.manager_4_17_11|Add-Member -NotePropertyName review_closure_run_id -NotePropertyValue '34769051128'}else{$state.qualification.manager_4_17_11.review_closure_run_id='34769051128'}
          if($state.qualification.manager_4_17_11.PSObject.Properties.Name-cnotcontains'review_closure_head'){$state.qualification.manager_4_17_11|Add-Member -NotePropertyName review_closure_head -NotePropertyValue '89d593b261b4e432fef2f62484cfbf3293ecf4cc'}else{$state.qualification.manager_4_17_11.review_closure_head='89d593b261b4e432fef2f62484cfbf3293ecf4cc'}
          $state.qualification.manager_4_17_11.development_validation='pending'
          $state.next_exact_goal.id='MANAGER-41711-DEVELOPMENT-VALIDATION-001'
          $state.next_exact_goal.description='Require exact-head canonical Development Validation and strict Risk/Defect Gate PASS with the 4.17.11 review regression and release-instruction identity guard integrated. Do not freeze until both checks pass on the same authoritative development source identity.'
          $state.bootstrap.required_first_actions=@(
            'Resolve dev/manager-4.17.11 live; remote branch is authoritative.',
            'Treat production Manager 4.17.10 as installed and accepted only in single-instance compatibility mode; do not activate multi-Hub.',
            'MGR-DEF-0024/MGR-DEF-0025 are fixed in 4.17.11 with permanent pre-freeze coverage; require canonical exact-head Development Validation and Risk/Defect Gate PASS.',
            'Do not freeze 4.17.11 until exact-head development evidence is green.'
          )
          Write-Json $stateRel $state

          $devRel='tools\Invoke-DevelopmentValidation.ps1'
          $devPath=Join-Path $root $devRel
          $dev=[IO.File]::ReadAllText($devPath)
          $old=@'
$knowledgeTools=@(
    'tools\Test-ManagerEngineeringKnowledge.ps1',
    'tools\Build-ManagerRiskContext.ps1',
    'tools\Invoke-ManagerRiskDefectGate.ps1',
    'tools\Invoke-ManagerRiskContextRegression.ps1'
)
'@
          $new=@'
$knowledgeTools=@(
    'tools\Test-ManagerEngineeringKnowledge.ps1',
    'tools\Build-ManagerRiskContext.ps1',
    'tools\Invoke-ManagerRiskDefectGate.ps1',
    'tools\Invoke-ManagerRiskContextRegression.ps1',
    'tools\Verify-ManagerReleaseInstructions.ps1',
    'tools\Invoke-Manager41711ReviewRegression.ps1'
)
'@
          $dev=Replace-Once $dev $old $new 'development parser tool list'
          $old=@'
Write-Host '[4/7] Run Manager 4.17.10 regression chain...'
foreach($regressionName in @('Invoke-Manager41710ReviewRegression.ps1')){
    $regression=Join-Path $RepositoryRoot ('tools\'+$regressionName)
    if(-not(Test-Path -LiteralPath $regression -PathType Leaf)){Fail('Manager 4.17.10 regression tool is missing: '+$regressionName)}
    Parse-File $regression
    Invoke-Child $regression @('-RepositoryRoot',$RepositoryRoot)
}
Write-Host 'Manager 4.17.10 regression chain: PASS' -ForegroundColor Green
'@
          $new=@'
Write-Host '[4/7] Run Manager review regression and release-identity chain...'
$releaseInstructionGuard=Join-Path $RepositoryRoot 'tools\Verify-ManagerReleaseInstructions.ps1'
Invoke-Child $releaseInstructionGuard @('-RepositoryRoot',$RepositoryRoot)
foreach($regressionName in @('Invoke-Manager41710ReviewRegression.ps1','Invoke-Manager41711ReviewRegression.ps1')){
    $regression=Join-Path $RepositoryRoot ('tools\'+$regressionName)
    if(-not(Test-Path -LiteralPath $regression -PathType Leaf)){Fail('Manager review regression tool is missing: '+$regressionName)}
    Parse-File $regression
    Invoke-Child $regression @('-RepositoryRoot',$RepositoryRoot)
}
Write-Host 'Manager 4.17.10 + 4.17.11 review regression and release-instruction chain: PASS' -ForegroundColor Green
'@
          $dev=Replace-Once $dev $old $new 'canonical review regression chain'
          [IO.File]::WriteAllText($devPath,$dev,$utf8)

          $wfRel='.github\workflows\development-validation.yml'
          $wfPath=Join-Path $root $wfRel
          $wf=[IO.File]::ReadAllText($wfPath)
          $wf=Replace-Once $wf "      - 'tools/Invoke-Manager41710ReviewRegression.ps1'" "      - 'tools/Invoke-Manager41711ReviewRegression.ps1'`n      - 'tools/Verify-ManagerReleaseInstructions.ps1'`n      - 'tools/Invoke-Manager41710ReviewRegression.ps1'" 'Development Validation trigger paths'
          $wf=$wf.Replace('# Invoke-DevelopmentValidation.ps1 owns the permanent Manager 4.17.10 regression chain, including real disposable Genesis -> registry activation -> Doctor execution. The workflow does not repeat that expensive chain.','# Invoke-DevelopmentValidation.ps1 owns the permanent Manager 4.17.10 + 4.17.11 regression chain, including real disposable registry-active Doctor and CANDIDATE-only UpdateHub execution plus the managed release-instruction identity guard. The workflow does not repeat that expensive chain.')
          [IO.File]::WriteAllText($wfPath,$wf,$utf8)

          $roadRel='MANAGER_ENGINEERING_ROADMAP.md'
          $roadPath=Join-Path $root $roadRel
          $road=[IO.File]::ReadAllText($roadPath)
          $r14='- **Required properties:** current/HEAD source remains fail-closed on parse errors; historical/base parse failure uses an explicit conservative path-level fallback; the fallback is visible in generated risk context; reusable tooling behaviors have permanent regressions; `PUBLIC_FILE_MANIFEST.json` is reproducible from the exact source tree; `PUBLIC_PROVENANCE.json` must identify the same Manager version, installation digest, managed-set digest, Framework revision and development baseline as the canonical source/state; an unqualified development line must not inherit a predecessor''s Full Gate/production acceptance receipt; changes to either metadata file or its verifier trigger ordinary development CI.'
          $r14new='- **Required properties:** current/HEAD source remains fail-closed on parse errors; historical/base parse failure uses an explicit conservative path-level fallback; the fallback is visible in generated risk context; reusable tooling behaviors have permanent regressions; product materializers must preserve exact source bytes outside intended edits and enforce structural/size/minimal-diff guards before commit; `PUBLIC_FILE_MANIFEST.json` is reproducible from the exact source tree; `PUBLIC_PROVENANCE.json` must identify the same Manager version, installation digest, managed-set digest, Framework revision and development baseline as the canonical source/state; an unqualified development line must not inherit a predecessor''s Full Gate/production acceptance receipt; changes to either metadata file or its verifier trigger ordinary development CI.'
          $road=Replace-Once $road $r14 $r14new 'R-014 materializer integrity lesson'
          if($road.Contains('### R-017 — Runtime state-matrix outcome qualification')){throw 'R-017 already exists unexpectedly.'}
          $r17=@'
### R-017 — Runtime state-matrix outcome qualification

- **Priority:** P1
- **Status:** ACTIVE
- **Goal:** move state-dependent runtime defects from post-freeze review into pre-freeze executable qualification by exercising real Manager paths across the relevant state/outcome matrix rather than relying on static/AST reachability alone.
- **Initial matrix:** single-instance compatibility; registry-active healthy; active metadata invalid; active Hub missing/corrupt; instance-owned pending CANDIDATE; stranded Manager-global Hub input; no-install outcome; Doctor diagnostics; UpdateHub completion reporting.
- **Required properties:** each state executes the real command path in a disposable sanitized environment; assertions cover both durable mutation and user-visible/diagnostic outcome; static checks remain supplemental; state-specific collectors/routing variables must be initialized and resolved before their first reachable use.
- **Trigger:** MGR-DEF-0023 escaped all green qualification because registry-active Doctor was not executed; MGR-DEF-0024 then escaped because the registry-active CANDIDATE-only no-install outcome was not executed. The 4.17.11 closure regression adds A21, but the general state matrix must become systematic rather than release-specific.
- **Dependency:** R-002 executable knowledge, R-003 multi-Hub convergence, and R-014 tooling self-regression.
- **Exit:** canonical Development Validation/qualification derives or maintains a bounded runtime state matrix and proves all required Doctor/SelfTest/update outcome cells before candidate freeze.

'@
          $road=Replace-Once $road '## Roadmap maintenance policy' ($r17+'## Roadmap maintenance policy') 'R-017 insertion'
          [IO.File]::WriteAllText($roadPath,$road,$utf8)

          foreach($rel in @(
            '.github\workflows\materialize-manager-4.17.11.yml',
            '.github\workflows\diagnose-manager-4.17.11-runtime.yml',
            '.github\workflows\repair-manager-4.17.11-runtime.yml',
            '.github\workflows\sync-manager-4.17.11-development-metadata.yml',
            '.github\workflows\validate-manager-4.17.11-review.yml',
            'tools\Apply-Manager41711ReleaseReviewFixes.ps1',
            '.github\workflows\close-manager-4.17.11-review.yml'
          )){
            $p=Join-Path $root $rel
            if(Test-Path -LiteralPath $p -PathType Leaf){Remove-Item -LiteralPath $p -Force}
          }

      - name: Validate closure state before commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          if(@(git diff --name-only -- manager).Count-ne0){throw 'Closure integration unexpectedly changes Manager product/source bytes.'}
          $parse=@('tools\Invoke-DevelopmentValidation.ps1','tools\Invoke-Manager41711ReviewRegression.ps1','tools\Verify-ManagerReleaseInstructions.ps1')
          foreach($rel in $parse){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $root $rel),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){throw($rel+': '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Test-ManagerEngineeringKnowledge.ps1" -RepositoryRoot "$root"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot "$root" -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicCandidateMetadata.ps1" -RepositoryRoot "$root"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$root"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git diff --check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Commit coherent review closure
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          $expected=@(
            '.github/workflows/close-manager-4.17.11-review.yml',
            '.github/workflows/development-validation.yml',
            '.github/workflows/diagnose-manager-4.17.11-runtime.yml',
            '.github/workflows/materialize-manager-4.17.11.yml',
            '.github/workflows/repair-manager-4.17.11-runtime.yml',
            '.github/workflows/sync-manager-4.17.11-development-metadata.yml',
            '.github/workflows/validate-manager-4.17.11-review.yml',
            'MANAGER_DEVELOPMENT_STATE.json',
            'MANAGER_ENGINEERING_ROADMAP.md',
            'tests/knowledge/audits/post-4.17.10-public-review.json',
            'tests/knowledge/defects/manager-4.17.10-postfreeze.json',
            'tests/knowledge/risk-map.json',
            'tools/Apply-Manager41711ReleaseReviewFixes.ps1',
            'tools/Invoke-DevelopmentValidation.ps1'
          )|Sort-Object
          $actual=@(git diff --cached --name-only)|Sort-Object
          if([string]::Join("`n",$actual)-cne[string]::Join("`n",$expected)){throw('Unexpected closure staged set: '+([string]::Join(', ',@($actual))))}
          git commit -m 'Manager 4.17.11: close post-freeze review blockers'
          git push origin HEAD:dev/manager-4.17.11

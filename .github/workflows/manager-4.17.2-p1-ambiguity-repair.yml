name: One-shot Manager 4.17.2 P1 ambiguity repair

on:
  push:
    branches:
      - 'dev/manager-4.17.2'
    paths:
      - '.github/workflows/manager-4.17.2-p1-ambiguity-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10

      - name: Apply transaction-safety repair
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Apply-Manager4172AmbiguousCommitFix.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Materialize Manager 4.17.12 pre-freeze CURRENT binding fix

on:
  push:
    branches:
      - dev/manager-4.17.12
    paths:
      - .github/workflows/materialize-manager-4.17.12-prefreeze-current-binding.yml

permissions:
  contents: write

concurrency:
  group: materialize-manager-4.17.12-prefreeze-current-binding
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact one-shot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: dev/manager-4.17.12

      - name: Verify one-shot identity and prepare materializer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedParent='a110b9383eea94b948611713b59eb090efafd799'
          $head=(git rev-parse HEAD).Trim().ToLowerInvariant()
          $parent=(git rev-parse HEAD^).Trim().ToLowerInvariant()
          if($parent-cne$expectedParent){throw "Unexpected workflow parent: $parent expected $expectedParent"}
          $changed=@(git diff --name-only "$expectedParent..$head")
          if($changed.Count-ne1-or$changed[0]-cne'.github/workflows/materialize-manager-4.17.12-prefreeze-current-binding.yml'){throw('One-shot workflow commit is not isolated: '+($changed-join', '))}

          $apply='tools/Apply-Manager41712PreFreezeCurrentBindingFix.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $apply),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw('Materializer parser failure: '+(($errors|ForEach-Object Message)-join' | '))}

          # Repair materializer-only template hazards in the disposable checkout; these bytes are never committed.
          $text=[IO.File]::ReadAllText((Resolve-Path $apply),[Text.Encoding]::UTF8)
          $text=$text.Replace("`$writer=New-Object IO.StreamWriter(`$entry.Open(),`$Utf8NoBom)","`$writer=New-Object IO.StreamWriter(`$entry.Open(),(New-Object Text.UTF8Encoding(`$false)))")
          [IO.File]::WriteAllText((Resolve-Path $apply),$text,(New-Object Text.UTF8Encoding($false)))

          # Pre-insert compression assemblies so the materializer's legacy string-anchor branch is not exercised.
          $menu='manager/product/tools/KeelarynMenu.ps1'
          $menuText=[IO.File]::ReadAllText((Resolve-Path $menu),[Text.Encoding]::UTF8)
          if(-not$menuText.Contains('Add-Type -AssemblyName System.IO.Compression.FileSystem')){
            $needle='$ErrorActionPreference=''Stop'''
            $replacement=$needle+"`r`nAdd-Type -AssemblyName System.IO.Compression`r`nAdd-Type -AssemblyName System.IO.Compression.FileSystem"
            $first=$menuText.IndexOf($needle,[StringComparison]::Ordinal)
            if($first-lt0-or$menuText.IndexOf($needle,$first+$needle.Length,[StringComparison]::Ordinal)-ge0){throw 'Frontend compression-assembly insertion anchor is not unique.'}
            $menuText=$menuText.Substring(0,$first)+$replacement+$menuText.Substring($first+$needle.Length)
            [IO.File]::WriteAllText((Resolve-Path $menu),$menuText,(New-Object Text.UTF8Encoding($false)))
          }

          # EOL-independent pre-insertion: the historical regression is LF in Git, while the old materializer template used CRLF literals.
          $reg3='tools/Invoke-Manager4173ReviewRegression.ps1'
          $reg3Text=[IO.File]::ReadAllText((Resolve-Path $reg3),[Text.Encoding]::UTF8)
          if(-not$reg3Text.Contains("Get-FunctionText `$menuPath 'Assert-FrontendCurrentArchiveBinding'")){
            $importAnchor="Invoke-Expression (Get-FunctionText `$menuPath 'Ensure-ChatGPTExchangeLayout')"
            $imports=$importAnchor+"`nInvoke-Expression (Get-FunctionText `$menuPath 'ConvertTo-CanonicalFrontendInstanceId')`nInvoke-Expression (Get-FunctionText `$menuPath 'Read-FrontendZipEntryJson')`nInvoke-Expression (Get-FunctionText `$menuPath 'Assert-FrontendCurrentArchiveBinding')"
            $first=$reg3Text.IndexOf($importAnchor,[StringComparison]::Ordinal)
            if($first-lt0-or$reg3Text.IndexOf($importAnchor,$first+$importAnchor.Length,[StringComparison]::Ordinal)-ge0){throw '4.17.3 regression import insertion anchor is not unique.'}
            $reg3Text=$reg3Text.Substring(0,$first)+$imports+$reg3Text.Substring($first+$importAnchor.Length)
            [IO.File]::WriteAllText((Resolve-Path $reg3),$reg3Text,(New-Object Text.UTF8Encoding($false)))
          }
          Write-Host "One-shot identity + materializer preparation PASS. HEAD=$head"

      - name: Apply product and permanent regression fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Apply-Manager41712PreFreezeCurrentBindingFix.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git checkout -- tools/Apply-Manager41712PreFreezeCurrentBindingFix.ps1
          $actual=@(git diff --name-only|Sort-Object)
          $expected=@('manager/product/tools/KeelarynMenu.ps1','tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')|Sort-Object
          if(($actual-join"`n")-cne($expected-join"`n")){throw('Unexpected product/regression diff: '+($actual-join', '))}
          Write-Host 'Exact product/regression diff: PASS.'

      - name: Run binding and inherited regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-Manager4173ReviewRegression.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-Manager41712ReviewRegression.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File manager/product/tools/KeelarynMenu.ps1 -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'CURRENT binding + inherited regression chain: PASS.'

      - name: Record MGR-DEF-0028 and refresh public identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $utf8=New-Object Text.UTF8Encoding($false)
          function Write-Json([string]$Path,$Object){[IO.File]::WriteAllText((Resolve-Path $Path),((($Object|ConvertTo-Json -Depth 80).Replace("`r`n","`n"))+"`n"),$utf8)}

          $defectPath='tests/knowledge/defects/manager-4.17.12-prefreeze.json'
          $defect=[ordered]@{
            schema='keelaryn.manager-defects.v1'
            scope='Pre-freeze adversarial review findings for Manager 4.17.12'
            defects=@([ordered]@{
              id='MGR-DEF-0028'
              title='ChatGPT CURRENT export does not validate embedded instance identity against captured multi-Hub context'
              severity='P1'
              status='fixed'
              release_blocker=$true
              detected_in='4.17.12'
              detected_stage='pre_freeze_adversarial_review'
              defect_class='instance-bound artifact identity / cross-instance exchange isolation'
              affected_surfaces=@('S-FRONTEND-INSTANCE-CONTEXT')
              preconditions='A multi-Hub active context resolves to instance A while its per-instance CURRENT file is replaced, stale, or otherwise contains INSTANCE/ARTIFACT identity for instance B or inconsistent identity metadata.'
              bad_behavior='Copy-CurrentForChatGPT previously proved only that source and destination paths came from one captured frontend context. It copied the CURRENT bytes without validating embedded instance_id, so a stale or cross-instance CURRENT could be exported into instance A ChatGPT exchange under the wrong identity.'
              root_cause='The frontend treated the per-instance CURRENT path as sufficient proof of artifact ownership instead of validating the instance-bound artifact identity under the same locked source bytes that were copied.'
              root_cause_classes=@('RC-CONTEXT-001')
              violated_invariants=@('MH-BINDING-001','MH-ISOLATION-001')
              related_defects=@('MGR-DEF-0026')
              permanent_regressions=@('tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')
              planned_regressions=@()
              fixed_in='4.17.12'
              evidence=@(
                [ordered]@{type='pre_freeze_reviewed_head';id='4f0e054c9d8a1bf6cddb9a2ae16fa1f2577b0173'},
                [ordered]@{type='source_symbol';id='Get-CurrentHubTransportPath'},
                [ordered]@{type='source_symbol';id='Copy-CurrentForChatGPT'},
                [ordered]@{type='invariant';id='MH-BINDING-001'}
              )
            })
          }
          [IO.File]::WriteAllText((Join-Path $PWD.Path $defectPath),((($defect|ConvertTo-Json -Depth 80).Replace("`r`n","`n"))+"`n"),$utf8)

          $riskPath='tests/knowledge/risk-map.json'
          $risk=Get-Content -LiteralPath $riskPath -Raw -Encoding UTF8|ConvertFrom-Json
          $surface=@($risk.surfaces|Where-Object{[string]$_.id-ceq'S-FRONTEND-INSTANCE-CONTEXT'})
          if($surface.Count-ne1){throw 'S-FRONTEND-INSTANCE-CONTEXT risk surface is not unique.'}
          $surface=$surface[0]
          $surface.invariants=@(@($surface.invariants|ForEach-Object{[string]$_})+'MH-BINDING-001'|Sort-Object -Unique)
          $surface.symbols=@(@($surface.symbols|ForEach-Object{[string]$_})+@('Assert-FrontendCurrentArchiveBinding','Get-CurrentHubTransportPath','Copy-CurrentForChatGPT')|Sort-Object -Unique)
          $surface.regressions=@(@($surface.regressions|ForEach-Object{[string]$_})+@('tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1')|Sort-Object -Unique)
          Write-Json $riskPath $risk

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Build-PublicFileManifest.ps1 -RepositoryRoot $PWD.Path -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $manifest=Get-Content -LiteralPath PUBLIC_FILE_MANIFEST.json -Raw -Encoding UTF8|ConvertFrom-Json
          $prov=Get-Content -LiteralPath PUBLIC_PROVENANCE.json -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$manifest.manager.version-cne'4.17.12'){throw 'Refreshed manifest version mismatch.'}
          $prov.source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
          $prov.source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
          $prov.development_status='unqualified_manager_4_17_12_prefreeze_finding_0028_fixed_rerun_required'
          Write-Json 'PUBLIC_PROVENANCE.json' $prov

          $state=Get-Content -LiteralPath MANAGER_DEVELOPMENT_STATE.json -Raw -Encoding UTF8|ConvertFrom-Json
          $state.materialization.status='development_materialized_prefreeze_current_binding_fix_regressions_pass'
          $state.qualification.risk_defect_gate.observed_status='stale_after_prefreeze_product_fix_requires_exact_head_rerun'
          $state.qualification.risk_defect_gate.validated_development_head=$null
          $state.qualification.risk_defect_gate.candidate_freeze_permitted=$false
          if($state.qualification.PSObject.Properties.Name-contains'successor_4_17_12_development'){$state.qualification.successor_4_17_12_development.pre_freeze_adversarial_review='MGR-DEF-0028_found_and_fixed_exact_head_rerun_required'}
          $state.next_exact_goal.description='Re-run exact-head Development Validation and full-successor Risk/Defect Gate after the MGR-DEF-0028 CURRENT identity-binding fix, then repeat PR-equivalent adversarial review on the new exact 4.17.12 head. Freeze only after the repeated review is clean.'
          Write-Json 'MANAGER_DEVELOPMENT_STATE.json' $state

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Test-ManagerEngineeringKnowledge.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Build-PublicFileManifest.ps1 -RepositoryRoot $PWD.Path -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Verify-PublicCandidateMetadata.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Verify-PublicRepository.ps1 -RepositoryRoot $PWD.Path
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host ('Refreshed managed digest: '+[string]$manifest.manager.gate_managed_content_sha256)
          Write-Host 'MGR-DEF-0028 knowledge + public identity refresh: PASS.'

      - name: Commit validated pre-freeze fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager/product/tools/KeelarynMenu.ps1 tools/Invoke-Manager4173ReviewRegression.ps1 tools/Invoke-Manager41712ReviewRegression.ps1 tests/knowledge/defects/manager-4.17.12-prefreeze.json tests/knowledge/risk-map.json PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json MANAGER_DEVELOPMENT_STATE.json
          $actual=@(git diff --cached --name-only|Sort-Object)
          $expected=@('manager/product/tools/KeelarynMenu.ps1','tools/Invoke-Manager4173ReviewRegression.ps1','tools/Invoke-Manager41712ReviewRegression.ps1','tests/knowledge/defects/manager-4.17.12-prefreeze.json','tests/knowledge/risk-map.json','PUBLIC_FILE_MANIFEST.json','PUBLIC_PROVENANCE.json','MANAGER_DEVELOPMENT_STATE.json')|Sort-Object
          if(($actual-join"`n")-cne($expected-join"`n")){throw('Unexpected staged pre-freeze fix paths: '+($actual-join', '))}
          git commit -m 'Manager 4.17.12: bind ChatGPT CURRENT export to instance identity'
          git push origin HEAD:dev/manager-4.17.12

# One-shot development materializer only. No candidate is issued or frozen here.

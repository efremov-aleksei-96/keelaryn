name: Candidate Manager 4.12.0 gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/candidate-manager-4.12.0.yml'
      - 'tests/candidates/manager-4.12.0-g1/**'

permissions:
  contents: read

concurrency:
  group: keelaryn-candidate-4.12.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate-gate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify production public base
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Get-Content "$env:GITHUB_WORKSPACE\manager\product\install\INSTALLATION.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$install.manager_version -ne '4.11.0') { throw 'Candidate patch base must be Manager 4.11.0.' }

      - name: Reconstruct exact 4.12.0 candidate source
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $parts = Join-Path $root 'tests\candidates\manager-4.12.0-g1'
          $patch = Join-Path $env:RUNNER_TEMP 'manager-4.12.0-g1.patch'
          cmd.exe /d /c "copy /b `"$parts\part1.patch`"+`"$parts\part2.patch`"+`"$parts\part3.patch`"+`"$parts\part4.patch`" `"$patch`" >nul"
          if ($LASTEXITCODE -ne 0) { throw 'Could not reconstruct candidate patch.' }

          $patchText = [System.IO.File]::ReadAllText($patch,[System.Text.Encoding]::UTF8).Replace("`r`n","`n")
          [System.IO.File]::WriteAllText($patch,$patchText,(New-Object System.Text.UTF8Encoding($false)))
          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '644c124a32c74fa229b79a8c7e0652fc88d18ca002dd214fe17fd86c74471383') { throw "Candidate patch hash mismatch: $patchHash" }

          $menu = Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($menu)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes).Replace("`r`n","`n")
          [System.IO.File]::WriteAllText($menu,$text,(New-Object System.Text.ASCIIEncoding))

          git apply --check --whitespace=nowarn "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'Manager 4.12.0 patch does not apply cleanly to public 4.11.0.' }
          git apply --whitespace=nowarn "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'Manager 4.12.0 patch application failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched LF-normalized candidate failed git diff --check.' }

          $text = [System.IO.File]::ReadAllText($menu,[System.Text.Encoding]::ASCII).Replace("`r`n","`n").Replace("`n","`r`n")
          [System.IO.File]::WriteAllText($menu,$text,(New-Object System.Text.ASCIIEncoding))

          $installPath = Join-Path $root 'manager\product\install\INSTALLATION.json'
          $install = Get-Content $installPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$install.manager_version -ne '4.12.0') { throw 'Patched Manager version is not 4.12.0.' }
          $installHash = (Get-FileHash -LiteralPath $installPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installHash -ne '7d616af1999a0071299044ac4f5f72d14f1bd74f5bc4fb280714db2076efaf77') { throw "Candidate INSTALLATION hash mismatch: $installHash" }

      - name: Build frozen-r9 gate and verify candidate identity
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $builder = Join-Path $root 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          $gateZip = Join-Path $env:RUNNER_TEMP 'manager-4.12.0.zip'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $builder -SourceRoot (Join-Path $root 'manager') -BaselineVersion '4.11.0' -GateRevision 1 -OutputPath $gateZip -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $work = Join-Path $root 'tests\work'
          Expand-Archive -LiteralPath $gateZip -DestinationPath $work -Force
          $candidate = Join-Path $work 'manager-4.12.0'
          $spec = Get-Content (Join-Path $candidate 'gate\GATE_SPEC.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$spec.candidate_version -ne '4.12.0') { throw 'Gate candidate version mismatch.' }
          if ([string]$spec.baseline_manager_version -ne '4.11.0') { throw 'Gate baseline mismatch.' }
          if ([int]$spec.framework_revision -ne 9) { throw 'Gate Framework revision mismatch.' }
          if ([int]$spec.gate_revision -ne 1) { throw 'Gate revision mismatch.' }
          if ([string]$spec.candidate_installation_sha256 -ne '7d616af1999a0071299044ac4f5f72d14f1bd74f5bc4fb280714db2076efaf77') { throw 'Gate INSTALLATION identity differs from issued candidate.' }
          if ([string]$spec.candidate_managed_content_sha256 -ne 'fb0137c9485475ba7af069d5f1b7fe97c1b16121b9b97d47b3669e0cd435b32b') { throw 'Gate managed-content identity differs from issued candidate.' }
          "CANDIDATE_ROOT=$candidate" >> $env:GITHUB_ENV

      - name: Run Windows PowerShell 5.1 SourceGate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:CANDIDATE_ROOT\gate\Run-KeelarynManagerSourceGate.ps1" -ManagerRoot "$env:CANDIDATE_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build candidate release and locate Generic DISTRIBUTION
        shell: powershell
        run: |
          $runtime = Join-Path $env:CANDIDATE_ROOT 'product\runtime\Keelaryn__Manager.ps1'
          $menu = Join-Path $env:CANDIDATE_ROOT 'product\tools\KeelarynMenu.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $menu -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -BuildRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dist = Join-Path $env:CANDIDATE_ROOT '_releases\Keelaryn__Manager_Distribution_v4.12.0.zip'
          if (-not (Test-Path -LiteralPath $dist -PathType Leaf)) { throw "Generic DISTRIBUTION missing: $dist" }
          "CANDIDATE_DIST=$dist" >> $env:GITHUB_ENV

      - name: Verify clean-install first-run wizard
        shell: powershell
        run: |
          function Invoke-Menu([string]$MenuPath,[string]$InputText) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = (Join-Path $PSHOME 'powershell.exe')
            $psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $MenuPath + '" -Action Menu -NoRootLauncher'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo = $psi
            [void]$p.Start()
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            $p.StandardInput.Write($InputText)
            $p.StandardInput.Close()
            $p.WaitForExit()
            $output = $outTask.Result + $errTask.Result
            if ($p.ExitCode -ne 0) { throw "Menu process failed with $($p.ExitCode): $output" }
            return $output
          }

          $temp = Join-Path $env:RUNNER_TEMP ('first_run_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -LiteralPath $env:CANDIDATE_DIST -DestinationPath $temp -Force
          $menu = Join-Path $temp 'keelaryn\manager\product\tools\KeelarynMenu.ps1'
          $output = Invoke-Menu $menu "3`r`n0`r`n"
          foreach ($token in @('Welcome to Keelaryn','Create a new Hub','Connect an existing Hub','Everyday')) {
            if (-not $output.Contains($token)) { throw "First-run output missing token: $token`n$output" }
          }

      - name: Verify source-checkout collision recovery path
        shell: powershell
        run: |
          function Invoke-Menu([string]$MenuPath,[string]$InputText) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = (Join-Path $PSHOME 'powershell.exe')
            $psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $MenuPath + '" -Action Menu -NoRootLauncher'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo = $psi
            [void]$p.Start()
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            $p.StandardInput.Write($InputText)
            $p.StandardInput.Close()
            $p.WaitForExit()
            $output = $outTask.Result + $errTask.Result
            if ($p.ExitCode -ne 0) { throw "Menu process failed with $($p.ExitCode): $output" }
            return $output
          }

          $temp = Join-Path $env:RUNNER_TEMP ('collision_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -LiteralPath $env:CANDIDATE_DIST -DestinationPath $temp -Force
          $root = Join-Path $temp 'keelaryn'
          $hub = Join-Path $root 'hub'
          New-Item -ItemType Directory -Path $hub | Out-Null
          Set-Content -LiteralPath (Join-Path $hub 'README.md') -Value 'repository boundary marker' -Encoding ASCII
          $menu = Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          $output = Invoke-Menu $menu "3`r`n0`r`n"
          foreach ($token in @('not an empty first-run state','Genesis will not overwrite it','source checkout is not a clean runtime installation')) {
            if (-not $output.Contains($token)) { throw "Recovery output missing token: $token`n$output" }
          }

      - name: Verify clean Genesis and Doctor backend path
        shell: powershell
        run: |
          $temp = Join-Path $env:RUNNER_TEMP ('genesis_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -LiteralPath $env:CANDIDATE_DIST -DestinationPath $temp -Force
          $root = Join-Path $temp 'keelaryn'
          $manager = Join-Path $root 'manager'
          $runtime = Join-Path $manager 'product\runtime\Keelaryn__Manager.ps1'
          $cfgPath = Join-Path $temp 'genesis.json'
          $cfg = [ordered]@{schema='keelaryn.genesis-input.v1';language='en';purpose='mixed';timezone='UTC';areas=@('Personal');projects=@('Getting Started')}
          [System.IO.File]::WriteAllText($cfgPath,(($cfg | ConvertTo-Json -Depth 5) + "`n"),(New-Object System.Text.UTF8Encoding($false)))
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -Genesis -GenesisConfigPath $cfgPath -GenesisConfirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'hub\_System\INSTANCE.json') -PathType Leaf)) { throw 'Genesis did not create canonical Hub identity.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -Doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

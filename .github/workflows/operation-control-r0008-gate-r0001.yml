name: Operation control r0008 gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - '.github/workflows/operation-control-r0008-gate-r0001.yml'
      - 'docs/candidates/operation-control-r0008-20260921-01.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0008-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable r0008 candidate receipt
        env:
          FROZEN_COMMIT: 20727893662cde92998d88ecdca730b69633eaaa
          FROZEN_TREE: c68bfe3dab53206439d1c42634f5c5ac602fb09c
          EXPECTED_PAYLOAD: bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d
          EXPECTED_SIZE: '428403'
          EXPECTED_COUNT: '217'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("docs/candidates/operation-control-r0008-20260921-01.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "keelaryn.operation-control-candidate.v1",
              "candidate": "operation-control-r0008-20260921-01",
              "frozen": True,
              "frozen_source_commit": os.environ["FROZEN_COMMIT"],
              "source_tree": os.environ["FROZEN_TREE"],
              "qualification_state": "FROZEN_NOT_PRODUCTION_QUALIFIED",
          }
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"candidate receipt mismatch for {key}")
          payload = value.get("payload")
          if payload != {
              "schema": "keelaryn.zero-vps-payload.v1",
              "sha256": os.environ["EXPECTED_PAYLOAD"],
              "size": int(os.environ["EXPECTED_SIZE"]),
              "file_count": int(os.environ["EXPECTED_COUNT"]),
          }:
              raise SystemExit("candidate payload identity mismatch")
          security = value.get("security_contract", {})
          if security.get("remote_allowlist") != [
              "PRODUCTION_SNAPSHOT",
              "RUNTIME_SELFTEST",
          ]:
              raise SystemExit("candidate remote allowlist mismatch")
          if security.get("remote_mutation_handlers") != 0:
              raise SystemExit("candidate exposes remote mutation handler")
          if security.get("old_hub_mutation_authorized") is not False:
              raise SystemExit("candidate authorizes old Hub mutation")
          PY

      - name: Check out exact frozen r0008 source
        env:
          FROZEN_COMMIT: 20727893662cde92998d88ecdca730b69633eaaa
          FROZEN_TREE: c68bfe3dab53206439d1c42634f5c5ac602fb09c
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          git worktree add --detach "$work" "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git -C "$work" status --porcelain)"

      - name: Run full frozen Core regression suite
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s "$work/tests/core" -p 'test_*.py'

      - name: Prove frozen cross-user relay DAC
        env:
          FROZEN_COMMIT: 20727893662cde92998d88ecdca730b69633eaaa
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          group_name='keelaryn-r0008-ci'
          transport_user='keelaryn-r0008-xport'
          sudo groupadd --system "$group_name"
          sudo useradd --system --no-create-home --gid "$group_name" --shell /usr/sbin/nologin "$transport_user"
          transport_uid="$(id -u "$transport_user")"
          shared_gid="$(getent group "$group_name" | cut -d: -f3)"
          test "$transport_uid" -ne 0
          test -n "$shared_gid"

          tmp="$(sudo mktemp -d /tmp/keelaryn-r0008-relay.XXXXXX)"
          trap 'sudo rm -rf "$tmp"' EXIT
          sudo chmod 0755 "$tmp"
          stage="$tmp/stage"
          sudo install -d -m 0755 "$stage"
          sudo cp -a "$work/core" "$stage/core"
          sudo cp "$work/tests/ci/operation_relay_cross_user.py" "$stage/operation_relay_cross_user.py"
          sudo find "$stage/core" -type d -exec chmod 0755 {} +
          sudo find "$stage/core" -type f -exec chmod 0644 {} +
          sudo chmod 0644 "$stage/operation_relay_cross_user.py"

          sudo install -d -m 0750 -o "$transport_user" -g "$group_name" "$tmp/transport"
          sudo -u "$transport_user" env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$stage/core"             /usr/bin/python3 -B "$stage/operation_relay_cross_user.py" transport-deliver             --root "$tmp/transport" --source-commit "$FROZEN_COMMIT"

          sudo install -d -m 0700 -o root -g root "$tmp/operations" "$tmp/control"
          sudo setpriv --reuid=0 --regid="$shared_gid" --clear-groups             --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs             env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$stage/core"             /usr/bin/python3 -B "$stage/operation_relay_cross_user.py" agent-process             --transport-root "$tmp/transport" --operation-root "$tmp/operations"             --control-root "$tmp/control" --source-commit "$FROZEN_COMMIT"             --expected-gid "$shared_gid"

          sudo -u "$transport_user" env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$stage/core"             /usr/bin/python3 -B "$stage/operation_relay_cross_user.py" transport-publish             --root "$tmp/transport" --source-commit "$FROZEN_COMMIT"

      - name: Rebuild exact frozen r0008 payload twice
        env:
          FROZEN_COMMIT: 20727893662cde92998d88ecdca730b69633eaaa
          EXPECTED_PAYLOAD: bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d
          EXPECTED_SIZE: '428403'
          EXPECTED_COUNT: '217'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          python3 "$work/deploy/zero-based-vps/build_payload.py"             --repo-root "$work" --source-commit "$FROZEN_COMMIT"             --output "$RUNNER_TEMP/first.tar.gz" > "$RUNNER_TEMP/first.json"
          python3 "$work/deploy/zero-based-vps/build_payload.py"             --repo-root "$work" --source-commit "$FROZEN_COMMIT"             --output "$RUNNER_TEMP/second.tar.gz" > "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.tar.gz" "$RUNNER_TEMP/second.tar.gz"

          python3 - "$RUNNER_TEMP/first.json" "$EXPECTED_PAYLOAD" "$EXPECTED_SIZE" "$EXPECTED_COUNT" "$FROZEN_COMMIT" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "payload_sha256": sys.argv[2],
              "payload_size": int(sys.argv[3]),
              "file_count": int(sys.argv[4]),
              "source_commit": sys.argv[5],
          }
          observed = {key: value[key] for key in expected}
          if observed != expected:
              raise SystemExit(f"frozen payload mismatch: {observed}")
          PY

      - name: Materialize and qualify frozen r0008 release
        env:
          FROZEN_COMMIT: 20727893662cde92998d88ecdca730b69633eaaa
          EXPECTED_PAYLOAD: bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          root="$RUNNER_TEMP/materialized"
          python3 "$work/deploy/zero-based-vps/materialize_payload.py"             --payload "$RUNNER_TEMP/first.tar.gz"             --releases-root "$root/releases"             --expected-source-commit "$FROZEN_COMMIT"             --expected-payload-sha256 "$EXPECTED_PAYLOAD"             > "$RUNNER_TEMP/materialized.json"

          release="$root/releases/$FROZEN_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B             "$release/deploy/zero-based-vps/target_host_validate.py"             --release "$release"             --expected-source-commit "$FROZEN_COMMIT"             --expected-payload-sha256 "$EXPECTED_PAYLOAD"             > "$RUNNER_TEMP/target-host.json"

          unit_dir="$RUNNER_TEMP/systemd"
          install -d -m 0755 "$unit_dir"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-operation-agent.service"             "$unit_dir/keelaryn-operation-agent.service"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-operation-transport.service"             "$unit_dir/keelaryn-operation-transport.service"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-production-snapshot@.service"             "$unit_dir/keelaryn-production-snapshot@.service"

          PYTHONDONTWRITEBYTECODE=1 python3 -B             "$release/deploy/zero-based-vps/operation_control_d0_validate.py"             --release "$release"             --expected-source-commit "$FROZEN_COMMIT"             --expected-payload-sha256 "$EXPECTED_PAYLOAD"             --installed-unit-dir "$unit_dir"             > "$RUNNER_TEMP/d0-control.json"

          python3 - "$release" "$RUNNER_TEMP/d0-control.json" <<'PY'
          import json, sys
          from pathlib import Path

          release = Path(sys.argv[1])
          d0 = json.load(open(sys.argv[2], encoding="utf-8"))
          if d0.get("remote_allowlist") != [
              "PRODUCTION_SNAPSHOT",
              "RUNTIME_SELFTEST",
          ]:
              raise SystemExit("materialized D0 allowlist mismatch")
          if d0.get("remote_mutation_handlers") != 0:
              raise SystemExit("materialized D0 release exposes mutation handler")
          if d0.get("snapshot_unit_policy_verified") is not True:
              raise SystemExit("snapshot worker policy not verified")
          if d0.get("installed_units_verified") is not True:
              raise SystemExit("installed D0 unit bytes not verified")

          forbidden = [
              path
              for path in release.rglob("*")
              if path.name == "__pycache__"
              or (path.is_file() and path.suffix in {".pyc", ".pyo"})
          ]
          if forbidden:
              raise SystemExit(
                  "frozen release mutated during qualification: "
                  + ", ".join(str(path.relative_to(release)) for path in forbidden[:10])
              )
          PY

      - name: Emit compact r0008 gate evidence
        env:
          OUT: ${{ runner.temp }}/OPERATION_CONTROL_R0008_GATE.json
        run: |
          python3 - "$OUT" <<'PY'
          import json, os, sys
          value = {
              "schema": "keelaryn.operation-control-d0-gate-evidence.v1",
              "gate_revision": "operation-control-d0-gate-r0001",
              "candidate": "operation-control-r0008-20260921-01",
              "frozen_source_commit": "20727893662cde92998d88ecdca730b69633eaaa",
              "frozen_source_tree": "c68bfe3dab53206439d1c42634f5c5ac602fb09c",
              "payload_sha256": "bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d",
              "payload_size": 428403,
              "file_count": 217,
              "predecessor_candidate": "operation-control-r0005-20260921-01",
              "full_frozen_core_suite": True,
              "cross_user_relay_dac_verified": True,
              "deterministic_rebuild": True,
              "materialization_verified": True,
              "target_host_validation": True,
              "d0_control_validator_verified": True,
              "remote_allowlist": [
                  "PRODUCTION_SNAPSHOT",
                  "RUNTIME_SELFTEST",
              ],
              "remote_mutation_handlers": 0,
              "old_hub_mutation_authorized": False,
              "production_mutations_performed": False,
              "drive_mutations_performed": False,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "production_qualified": False,
              "next_action": "DISPOSABLE_R0005_TO_R0008_QUALIFICATION",
          }
          with open(sys.argv[1], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(
                  value,
                  stream,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              stream.write("\n")
          PY

      - name: Upload compact r0008 gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0008-gate-r0001-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0008_GATE.json
          if-no-files-found: error
          retention-days: 3

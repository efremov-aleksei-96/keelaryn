name: Operation control r0008 boundary capture gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0008_boundary_capture.py'
      - 'tools/operation_control_r0008_vps.py'
      - 'tools/operation_control_r0008_stage_authority.py'
      - 'tests/core/test_operation_control_r0008_boundary_capture.py'
      - '.github/workflows/operation-control-r0008-boundary-capture-gate-r0001.yml'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact issued r0008 authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("docs/authorizations/operation-control-r0008-stage")
          path = root / "a6383609e9a6442ad86445ba62baff93.json"
          files = sorted(root.glob("*.json"))
          if files != [path]:
              raise SystemExit(f"unexpected r0008 authority set: {files}")
          raw = path.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          canonical = (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if raw != canonical:
              raise SystemExit("r0008 authority is not canonical")
          if hashlib.sha256(raw).hexdigest() != "2bc92df91d1272c30783879c794a36e066e5ad024a262c70ba09c33ec50e7864":
              raise SystemExit("r0008 authority SHA mismatch")
          exact = {
              "transaction_id": "a6383609e9a6442ad86445ba62baff93",
              "scope": "R0008_RELEASE_STAGE_ONLY",
              "candidate": "operation-control-r0008-20260923-01",
              "production_stage_authorized": True,
              "activation_authorized": False,
              "drive_content_mutation_authorized": False,
              "legacy_hub_mutation_authorized": False,
              "writer_mutation_authorized": False,
              "credential_mutation_authorized": False,
          }
          for key, expected in exact.items():
              if value.get(key) != expected:
                  raise SystemExit(f"r0008 authority mismatch: {key}")
          PY

      - name: Compile without residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0008_boundary_capture.py",
              "tests/core/test_operation_control_r0008_boundary_capture.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          PY
          test -z "$(git status --porcelain)"

      - name: Run boundary capture regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s tests/core -p 'test_operation_control_r0008_boundary_capture.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove narrow read-only surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0008_boundary_capture.py").read_text(encoding="utf-8")
          for needle in (
              'choices=("capture",)',
              'vps.reconcile()',
              'authority.validate_boundary_evidence(value)',
              '"production_mutations_performed": False',
              '"drive_mutations_performed": False',
          ):
              if needle not in raw:
                  raise SystemExit(f"missing boundary contract: {needle}")
          for needle in (
              "stage_once(",
              "materialize_payload(",
              "update_d0_control_plane(",
              "os.mkdir(",
              "write_text(",
              "write_bytes(",
          ):
              if needle in raw:
                  raise SystemExit(f"boundary capture write surface: {needle}")
          PY

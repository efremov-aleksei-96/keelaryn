name: One-shot Manager 4.17.5 pre-freeze single-context fix

on:
  push:
    branches:
      - 'dev/manager-4.17.5'
    paths:
      - '.github/workflows/manager-4.17.5-prefreeze-single-context-fix.yml'

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize single-to-multi context race correction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $runtime=Join-Path $root 'manager\product\runtime\Keelaryn__Manager.ps1'
          $menu=Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          $regression=Join-Path $root 'tools\Invoke-Manager4175ReviewRegression.ps1'
          function Replace-One([string]$Path,[string]$Old,[string]$New){$t=[IO.File]::ReadAllText($Path,[Text.Encoding]::UTF8);$i=$t.IndexOf($Old,[StringComparison]::Ordinal);if($i-lt0){throw('Patch anchor missing: '+$Old)};if($t.IndexOf($Old,$i+$Old.Length,[StringComparison]::Ordinal)-ge0){throw('Patch anchor non-unique: '+$Old)};[IO.File]::WriteAllText($Path,$t.Substring(0,$i)+$New+$t.Substring($i+$Old.Length),$utf8)}

          Replace-One $runtime '    [string]$ExpectedInstanceId' ("    [string]`$ExpectedInstanceId,`r`n    [switch]`$ExpectedSingleInstance")
          $expectedAnchor='if (-not [string]::IsNullOrWhiteSpace($ExpectedInstanceId)) {'
          $expectedPrefix="if(`$ExpectedSingleInstance-and-not`$UpdateHub){throw 'ExpectedSingleInstance is valid only with -UpdateHub.'}`r`nif(`$ExpectedSingleInstance-and-not[string]::IsNullOrWhiteSpace(`$ExpectedInstanceId)){throw 'ExpectedSingleInstance and ExpectedInstanceId are mutually exclusive.'}`r`n"+$expectedAnchor
          Replace-One $runtime $expectedAnchor $expectedPrefix
          $registryAnchor='$registry=Read-InstanceRegistryEarly'
          $registryNew=$registryAnchor+"`r`n    if(`$registry-and`$ExpectedSingleInstance){throw 'Multi-Hub registry appeared after this invocation captured single-instance Hub context. Retry the operation.'}"
          Replace-One $runtime $registryAnchor $registryNew

          Replace-One $menu '$hubExpectedInstanceId=$null' ("`$hubExpectedInstanceId=`$null`r`n    `$hubExpectedSingleInstance=`$false")
          Replace-One $menu 'if($ctx.RegistryActive){$hubExpectedInstanceId=[string]$ctx.InstanceId}' 'if($ctx.RegistryActive){$hubExpectedInstanceId=[string]$ctx.InstanceId}else{$hubExpectedSingleInstance=$true}'
          $argAnchor="if(`$hubExpectedInstanceId){`$hubArgs+=@('-ExpectedInstanceId',`$hubExpectedInstanceId)}"
          $argNew=$argAnchor+"`r`n    elseif(`$hubExpectedSingleInstance){`$hubArgs+=@('-ExpectedSingleInstance')}"
          Replace-One $menu $argAnchor $argNew

          $regText=[IO.File]::ReadAllText($regression,[Text.Encoding]::UTF8)
          $assertAnchor="Assert `$rt.Contains('[string]`$ExpectedInstanceId') 'missing ExpectedInstanceId';"
          $assertExtra="Assert `$rt.Contains('[switch]`$ExpectedSingleInstance') 'missing ExpectedSingleInstance';Assert `$mt.Contains('-ExpectedSingleInstance') 'frontend single-instance context token missing';"
          if(([regex]::Matches($regText,[regex]::Escape($assertAnchor))).Count-ne1){throw 'Regression structural anchor missing or non-unique.'}
          $regText=$regText.Replace($assertAnchor,$assertAnchor+$assertExtra)
          $behaviorAnchor="Invoke-Expression (F `$runtimePath 'Resolve-RegisteredInstanceContextEarly');`$ExpectedInstanceId='11111111-1111-1111-1111-111111111111';"
          $behaviorNew="Invoke-Expression (F `$runtimePath 'Resolve-RegisteredInstanceContextEarly');`$ExpectedSingleInstance=`$false;`$ExpectedInstanceId='11111111-1111-1111-1111-111111111111';"
          if(([regex]::Matches($regText,[regex]::Escape($behaviorAnchor))).Count-ne1){throw 'Regression behavior anchor missing or non-unique.'}
          $regText=$regText.Replace($behaviorAnchor,$behaviorNew)
          $guardAnchor="Assert `$blocked 'expected-instance guard did not fail closed'"
          $guardExtra=";`$ExpectedInstanceId=`$null;`$ExpectedSingleInstance=`$true;`$blocked=`$false;try{`$null=Resolve-RegisteredInstanceContextEarly}catch{`$blocked=`$_.Exception.Message.Contains('captured single-instance Hub context')};Assert `$blocked 'single-instance context guard did not fail closed'"
          if(([regex]::Matches($regText,[regex]::Escape($guardAnchor))).Count-ne1){throw 'Regression guard anchor missing or non-unique.'}
          $regText=$regText.Replace($guardAnchor,$guardAnchor+$guardExtra)
          [IO.File]::WriteAllText($regression,$regText,$utf8)

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $manifest=Get-Content (Join-Path $root 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $provPath=Join-Path $root 'PUBLIC_PROVENANCE.json'
          $prov=Get-Content $provPath -Raw -Encoding UTF8|ConvertFrom-Json
          $prov.source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
          $prov.source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
          $json=(($prov|ConvertTo-Json -Depth 40).Replace("`r`n","`n"))+"`n"
          [IO.File]::WriteAllText($provPath,$json,$utf8)

      - name: Validate corrected development tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicPresentation.ps1" -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Invoke-Manager4175ReviewRegression.ps1" -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\tools\KeelarynMenu.ps1" -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-4175-single-context-'+$env:GITHUB_RUN_ID)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot $root -OutputDirectory $out
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'MANAGER 4.17.5 SINGLE-CONTEXT RACE CORRECTION: PASS' -ForegroundColor Green

      - name: Publish corrected tree and remove one-shot workflow
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'keelaryn-development-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/workflows/manager-4.17.5-prefreeze-single-context-fix.yml'
          git add -- manager/product/runtime/Keelaryn__Manager.ps1 manager/product/tools/KeelarynMenu.ps1 tools/Invoke-Manager4175ReviewRegression.ps1 PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          if($LASTEXITCODE-ne0){throw 'Corrected diff whitespace validation failed.'}
          if(git diff --cached --quiet){throw 'Single-context correction produced no staged changes.'}
          git commit -m 'Manager 4.17.5: bind single-instance Hub imports'
          git push origin HEAD:dev/manager-4.17.5
          Write-Host 'Corrected Manager 4.17.5 tree pushed; one-shot workflow removed.' -ForegroundColor Green

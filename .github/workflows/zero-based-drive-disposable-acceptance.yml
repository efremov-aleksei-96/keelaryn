name: Zero-based Drive disposable acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_disposable:
        description: 'Type/select YES: this run may mutate only the dedicated disposable acceptance root'
        required: true
        type: choice
        options:
          - 'NO'
          - 'YES'
        default: 'NO'
      acceptance_root_id:
        description: 'Re-enter the dedicated disposable acceptance ROOT Drive file ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zero-based-drive-disposable-acceptance
  cancel-in-progress: false

jobs:
  live-drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEELARYN_DRIVE_ACCEPT_DISPOSABLE: 'YES'
      KEELARYN_GOOGLE_CLIENT_ID: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_ID }}
      KEELARYN_GOOGLE_CLIENT_SECRET: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_SECRET }}
      KEELARYN_GOOGLE_REFRESH_TOKEN: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_REFRESH_TOKEN }}
      KEELARYN_DISPOSABLE_ACCEPTANCE_ROOT_ID: ${{ secrets.KEELARYN_DISPOSABLE_ACCEPTANCE_ROOT_ID }}
      KEELARYN_ACCEPTANCE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed unless exact disposable gate is selected
        env:
          INPUT_CONFIRM: ${{ inputs.confirm_disposable }}
          INPUT_ROOT_ID: ${{ inputs.acceptance_root_id }}
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/dev/zero-based-keelaryn'
          test "$INPUT_CONFIRM" = 'YES'
          test -n "$KEELARYN_DISPOSABLE_ACCEPTANCE_ROOT_ID"
          test "$INPUT_ROOT_ID" = "$KEELARYN_DISPOSABLE_ACCEPTANCE_ROOT_ID"
          test -n "$KEELARYN_GOOGLE_CLIENT_ID"
          test -n "$KEELARYN_GOOGLE_CLIENT_SECRET"
          test -n "$KEELARYN_GOOGLE_REFRESH_TOKEN"
          test "$KEELARYN_DRIVE_ACCEPT_DISPOSABLE" = 'YES'

      - name: Show exact development identity
        run: |
          python3 --version
          git rev-parse HEAD

      - name: Compile exact live acceptance code
        run: python3 -m compileall -q core tests/live

      - name: Run guarded disposable Google Drive acceptance
        run: PYTHONPATH=core python3 tests/live/drive_disposable_acceptance.py

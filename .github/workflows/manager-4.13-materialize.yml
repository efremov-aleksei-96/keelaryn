name: Manager 4.13 controlled materialization

on:
  push:
    branches: [manager-4.13.0-lifecycle]
    paths:
      - '.github/workflows/manager-4.13-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-4.13-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manager-4.13.0-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Assert branch state and reproduce validated overlay
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git status --porcelain).Count -ne 0) { throw 'Materialization requires a clean checkout.' }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix1.py"
          if ($LASTEXITCODE-ne0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix2.py"
          if ($LASTEXITCODE-ne0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix4.py"
          if ($LASTEXITCODE-ne0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle-fix5.py"
          if ($LASTEXITCODE-ne0) { exit $LASTEXITCODE }
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-lifecycle.py"
          if ($LASTEXITCODE-ne0) { exit $LASTEXITCODE }

          $installPath="$env:GITHUB_WORKSPACE\manager\product\install\INSTALLATION.json"
          $installSha=(Get-FileHash -LiteralPath $installPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if($installSha-cne'5cf598b412168bde4f5e543c7a8eceb7f6170b22b7325c9e9b06bea6c316f32d'){throw('Validated INSTALLATION identity mismatch: '+$installSha)}
          $install=Get-Content -LiteralPath $installPath -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$install.manager_version-cne'4.13.0'-or[int]$install.managed_files.Count-ne67){throw 'Validated Manager version/managed-count mismatch.'}
          $prov=Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\PUBLIC_PROVENANCE.json" -Raw -Encoding UTF8|ConvertFrom-Json
          $managed=([string]$prov.source_manager_gate_managed_content_sha256).Trim().ToLowerInvariant()
          if($managed-cne'c6a99234dabc75ca69100046cf4450cf85763891adba279a6062e511799599ab'){throw('Validated managed-content identity mismatch: '+$managed)}
          if([bool]$prov.production_validation.full_gate_pass-or-not[string]::IsNullOrWhiteSpace([string]$prov.production_validation.tested_update_sha256)){throw 'Materialization must remain an unqualified candidate.'}
          git diff --exit-code -- tests/framework/manager-gate
          if($LASTEXITCODE-ne0){throw 'Frozen Gate Framework r11 changed during materialization.'}

      - name: Revalidate materialized product tree before commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          # Public source verification must see a source-only repository tree.
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          # Manager execution is isolated so fresh-install runtime state cannot contaminate repository source.
          $lab=Join-Path $env:RUNNER_TEMP ('materialized-manager-'+[guid]::NewGuid().ToString('N'))
          $manager=Join-Path $lab 'manager'
          try{
            New-Item -ItemType Directory -Force -Path $lab|Out-Null
            Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\manager" -Destination $manager -Recurse -Force
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
            if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$manager\product\tools\KeelarynMenu.ps1" -SelfTest
            if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          }finally{
            if(Test-Path -LiteralPath $lab){Remove-Item -LiteralPath $lab -Recurse -Force -ErrorAction SilentlyContinue}
          }

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\manager-4.13-release-contract-selftest.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          if(Test-Path -LiteralPath "$env:GITHUB_WORKSPACE\manager\state"){throw 'Repository manager/state appeared during isolated validation.'}

      - name: Remove development scaffolding and commit exact bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $devFiles=@(
            '.github/MANAGER_4_13_DEVELOPMENT_CHECKPOINT.md',
            '.github/manager-4.13-lifecycle-fix1.py',
            '.github/manager-4.13-lifecycle-fix2.py',
            '.github/manager-4.13-lifecycle-fix3.py',
            '.github/manager-4.13-lifecycle-fix4.py',
            '.github/manager-4.13-lifecycle-fix5.py',
            '.github/manager-4.13-lifecycle.py',
            '.github/manager-4.13-release-contract-selftest.ps1',
            '.github/workflows/manager-4.13-lifecycle-v4.yml',
            '.github/workflows/manager-4.13-materialize.yml'
          )
          foreach($rel in $devFiles){
            $path=Join-Path $env:GITHUB_WORKSPACE $rel.Replace('/','\')
            if(Test-Path -LiteralPath $path){git rm -f -- $rel; if($LASTEXITCODE-ne0){throw('Could not remove development scaffold: '+$rel)}}
          }

          $status=@(git status --short)
          if($status.Count-lt1){throw 'Materialization produced no commit changes.'}
          Write-Host 'Materialized candidate change set:'
          $status|ForEach-Object{Write-Host $_}
          git diff --check
          if($LASTEXITCODE-ne0){throw 'git diff --check failed.'}
          git diff --exit-code -- tests/framework/manager-gate
          if($LASTEXITCODE-ne0){throw 'Frozen Gate Framework r11 changed.'}

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(manager): materialize validated 4.13 lifecycle'
          if($LASTEXITCODE-ne0){throw 'Materialization commit failed.'}
          git push origin HEAD:manager-4.13.0-lifecycle
          if($LASTEXITCODE-ne0){throw 'Materialization push failed.'}

name: Operation control r0007 stage execution gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_stage_execution.py'
      - 'tests/core/test_operation_control_r0007_stage_execution.py'
      - '.github/workflows/operation-control-r0007-stage-execution-gate-r0001.yml'
      - 'tools/operation_control_r0007_stage_authority.py'
      - 'tools/operation_control_r0007_stage_authority_issue.py'
      - 'tools/operation_control_r0007_production_stage.py'
      - 'tools/operation_control_r0007_stage.py'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-stage-execution-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove no real stage authorization record exists
        run: |
          set -euo pipefail
          if [ -d docs/authorizations/operation-control-r0007-stage ]; then
            if find docs/authorizations/operation-control-r0007-stage -type f -print -quit | grep -q .; then
              echo "D0-02I must not issue a real production-stage authorization." >&2
              exit 1
            fi
          fi

      - name: Syntax-check stage execution tooling without residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "tools/operation_control_r0007_stage_execution.py",
              "tests/core/test_operation_control_r0007_stage_execution.py",
          ):
              raw = Path(name).read_text(encoding="utf-8")
              compile(raw, name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run stage execution regression tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0007_stage_execution.py' -v
          test -z "$(git status --porcelain)"

      - name: Qualify one-shot authority execution and recovery
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/OPERATION_CONTROL_R0007_STAGE_EXECUTION_QUALIFICATION.json"
          stdout="$RUNNER_TEMP/stage-execution-stdout.json"

          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            tools/operation_control_r0007_stage_execution.py qualify \
            --output "$out" \
            > "$stdout"

          cmp "$stdout" "$out"

          python3 - "$out" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_scenarios = {
              "happy_path": "COMPLETED_EXACT",
              "exact_replay": "IDEMPOTENT_COMPLETED_EXACT",
              "crash_before_publication": "RECONCILE_REQUIRED_NO_BLIND_RETRY",
              "crash_after_publication": "RECOVERED_WITHOUT_REPUBLICATION",
              "stale_boundary": "FAIL_BEFORE_PREPARED",
              "payload_mismatch": "FAIL_BEFORE_PREPARED",
              "foreign_prepared": "FAIL_CLOSED_UNTOUCHED",
              "unattributed_staged_release": "FAIL_CLOSED_NO_CLAIM",
              "completed_without_prepared": "FAIL_CLOSED",
          }

          if value.get("schema") != "keelaryn.operation-control-r0007-stage-execution-qualification.v1":
              raise SystemExit("stage-execution schema mismatch")
          if value.get("gate_revision") != "operation-control-r0007-stage-execution-gate-r0001":
              raise SystemExit("stage-execution gate revision mismatch")
          if value.get("candidate") != "operation-control-r0007-20260921-01":
              raise SystemExit("stage-execution candidate mismatch")
          if value.get("source_commit") != "833123b6a7ad2c61087ee8a86700bb9ad8a46298":
              raise SystemExit("stage-execution source mismatch")
          if value.get("source_tree") != "bbca9e3a17162e12a7a0f649138e8c469518ad2a":
              raise SystemExit("stage-execution tree mismatch")
          if value.get("payload_sha256") != "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9":
              raise SystemExit("stage-execution payload mismatch")
          if value.get("payload_size") != 414534 or value.get("file_count") != 208:
              raise SystemExit("stage-execution payload size/count mismatch")
          if value.get("authority_scope") != "R0007_RELEASE_STAGE_ONLY":
              raise SystemExit("stage-execution authority scope mismatch")
          if value.get("prepared_schema") != "keelaryn.operation-control-r0007-stage-execution-prepared.v1":
              raise SystemExit("stage-execution PREPARED schema mismatch")
          if value.get("completed_schema") != "keelaryn.operation-control-r0007-stage-execution-completed.v1":
              raise SystemExit("stage-execution COMPLETED schema mismatch")
          if value.get("physical_commit_authority") != "EXACT_IMMUTABLE_RELEASE_DIRECTORY":
              raise SystemExit("stage-execution physical commit authority mismatch")
          if value.get("execution_attribution") != "IMMUTABLE_PREPARED_COMPLETED_WITNESSES":
              raise SystemExit("stage-execution attribution model mismatch")
          for key in (
              "prepared_before_publication",
              "payload_verified_before_prepared",
              "fresh_live_boundary_matches_authority_evidence_before_prepared",
              "completed_written_only_after_exact_release_and_post_reconcile",
          ):
              if value.get(key) is not True:
                  raise SystemExit(f"stage-execution required invariant missing: {key}")
          for key in (
              "blind_retry_after_prepared_without_release_allowed",
              "republish_after_exact_staged_release_allowed",
              "claim_unattributed_staged_release_allowed",
              "activation_authorized",
              "real_authorization_record_issued",
              "real_vps_stage_performed",
              "production_mutation_allowed",
              "drive_content_mutation_allowed",
              "production_qualified",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"stage-execution unsafe flag: {key}")
          if value.get("scenario_count") != 9:
              raise SystemExit("stage-execution scenario count mismatch")
          if value.get("scenarios") != expected_scenarios:
              raise SystemExit(f"stage-execution scenarios mismatch: {value.get('scenarios')}")
          if value.get("next_action") != "DESIGN_REAL_STAGE_ISSUANCE_AND_EXECUTION_TRANSACTION":
              raise SystemExit("stage-execution next action mismatch")
          PY

          if grep -Eq '"(old_hub_root_id|new_hub_root_id|KEELARYN_GITHUB_OPERATIONS_TOKEN|token)"' "$out"; then
            echo "stage-execution evidence leaks forbidden authority material" >&2
            exit 1
          fi

          test -z "$(git status --porcelain)"

      - name: Upload compact stage-execution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0007-stage-execution-gate-r0001-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0007_STAGE_EXECUTION_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 3

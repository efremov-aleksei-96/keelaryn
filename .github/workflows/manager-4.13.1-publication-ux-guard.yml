name: Manager 4.13.1 publication UX guard fix

on:
  push:
    branches: [manager-4.13.1]
    paths:
      - '.github/workflows/manager-4.13.1-publication-ux-guard.yml'

permissions:
  contents: write

concurrency:
  group: manager-4.13.1-publication-ux-guard
  cancel-in-progress: true

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manager-4.13.1
          fetch-depth: 0

      - name: Add mandatory production UX publication guard
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\public-release.yml'
          $text = [System.IO.File]::ReadAllText($path,[System.Text.Encoding]::UTF8)
          $old = "            if (-not [bool]`$prov.production_validation.production_doctor_pass) { throw 'Publication refused: provenance does not record a production Doctor PASS.' }`r`n            `$tested = ([string]`$prov.production_validation.tested_update_sha256).Trim().ToLowerInvariant()"
          $new = "            if (-not [bool]`$prov.production_validation.production_doctor_pass) { throw 'Publication refused: provenance does not record a production Doctor PASS.' }`r`n            if (-not [bool]`$prov.production_validation.production_ux_smoke_pass) { throw 'Publication refused: provenance does not record a production UX smoke PASS.' }`r`n            `$tested = ([string]`$prov.production_validation.tested_update_sha256).Trim().ToLowerInvariant()"
          if(([regex]::Matches($text,[regex]::Escape($old))).Count -ne 1){throw 'Publication guard sentinel mismatch.'}
          $text=$text.Replace($old,$new)
          $oldMsg="            Write-Host 'Publication authorization: production Full Gate + Doctor + tested UPDATE identity present.' -ForegroundColor Green"
          $newMsg="            Write-Host 'Publication authorization: production Full Gate + Doctor + UX smoke + tested UPDATE identity present.' -ForegroundColor Green"
          if(([regex]::Matches($text,[regex]::Escape($oldMsg))).Count -ne 1){throw 'Publication authorization message sentinel mismatch.'}
          $text=$text.Replace($oldMsg,$newMsg)
          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))

          $managerDiff = git diff --name-only -- manager
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          if($managerDiff){throw ('Manager bytes changed unexpectedly: '+($managerDiff -join ', '))}

          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\manager-4.13.1-publication-ux-guard.yml') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.github/workflows/public-release.yml' '.github/workflows/manager-4.13.1-publication-ux-guard.yml'
          git diff --cached --check -- ':!manager/**'
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git commit -m 'fix(release): require production UX smoke before publish'
          git push origin HEAD:manager-4.13.1

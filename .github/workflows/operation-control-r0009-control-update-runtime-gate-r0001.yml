name: Operation control r0009 control update runtime gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0009_control_update_runtime.py'
      - 'tools/operation_control_r0009_private_input.py'
      - 'tools/operation_control_r0009_stage_execution.py'
      - 'deploy/zero-based-vps/operation_control_d0_update.py'
      - 'tests/core/test_operation_control_r0009_control_update_runtime.py'
      - '.github/workflows/operation-control-r0009-control-update-runtime-gate-r0001.yml'
      - 'docs/evidence/R0009_STAGE_COMPLETED_20260924.json'
      - 'docs/candidates/operation-control-r0009-20260924-01.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0009-control-update-runtime-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact r0009 staged authority and transition identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("docs/evidence/R0009_STAGE_COMPLETED_20260924.json")
              .read_text(encoding="utf-8")
          )
          if evidence.get("conclusion") != "PASS_R0009_STAGE_COMPLETED_AND_POSTVERIFIED_EXACT":
              raise SystemExit("r0009 stage completion evidence is not exact PASS")
          post = evidence.get("post_stage_reconcile", {}).get("execution", {})
          if post.get("state") != "COMPLETED_EXACT":
              raise SystemExit("r0009 stage execution is not terminal exact")
          if post.get("release_state") != "STAGED_EXACT":
              raise SystemExit("r0009 release is not staged exact")
          if post.get("witness_root_state") != "PRESENT":
              raise SystemExit("r0009 stage witness is not present")
          if evidence.get("live_boundary", {}).get("control_source_commit") != "08f2e211f53764590f6ff0f05f86b2de62c14418":
              raise SystemExit("control predecessor mismatch")

          candidate = json.loads(
              Path("docs/candidates/operation-control-r0009-20260924-01.json")
              .read_text(encoding="utf-8")
          )
          if candidate.get("frozen_source_commit") != "e42a4f156abb048f5c8f0bd1884fcae51674a55f":
              raise SystemExit("frozen r0009 source mismatch")
          payload = candidate.get("payload", {})
          if payload.get("sha256") != "8592a314b084a2a1ccc1608168b3c0776cccb1277ffc049f42f3efd5291d4876":
              raise SystemExit("frozen r0009 payload mismatch")
          if payload.get("size") != 442514 or payload.get("file_count") != 227:
              raise SystemExit("frozen r0009 payload dimensions mismatch")
          control = candidate.get("control_update_transaction", {})
          if control.get("deterministic_id") != "24e9df7d9d305450acd11a8dc8f638769ad87444a9b5d16c8befed76a89c52ce":
              raise SystemExit("r0009 control-update transaction mismatch")
          rejected = candidate.get("rejected_attempt", {})
          if rejected.get("candidate") != "operation-control-r0008-20260923-01":
              raise SystemExit("rejected r0008 candidate provenance mismatch")
          if rejected.get("terminal_state") != "ROLLED_BACK_EXACT" or rejected.get("retry_allowed") is not False:
              raise SystemExit("rejected r0008 disposition mismatch")
          if rejected.get("control_update_transaction_id") == control.get("deterministic_id"):
              raise SystemExit("r0009 transaction reuses rejected r0008 identity")
          history = candidate.get("rejected_history", [])
          rejected_ids = {
              item.get("control_update_transaction_id")
              for item in history
              if item.get("terminal_state") == "ROLLED_BACK_EXACT"
              and item.get("retry_allowed") is False
          }
          if {
              "4832c22f208742c3cf5a8e32a79fbf92bfb037acd81f21d1331904cb54f68073",
              "83e20aeecd4ecd7a8288816065fa700ab3e99b8017177df215e18e03695d4e58",
          } - rejected_ids:
              raise SystemExit("r0007/r0008 rejected transaction history incomplete")
          if control.get("deterministic_id") in rejected_ids:
              raise SystemExit("r0009 control-update transaction reuses rejected identity")
          if candidate.get("defect_fix_contract", {}) != {
              "predecessor_defect_candidate": "operation-control-r0008-20260923-01",
              "predecessor_defect_evidence": "docs/evidence/R0008_SYSTEMD_TEMPLATE_DIAGNOSIS_20260924.json",
              "generic_active_probe_semantics_changed": False,
              "template_probe": "SYSTEMD_ACTIVE_INSTANCE_PATTERN",
              "template_pattern": "keelaryn-production-snapshot@*.service",
              "template_probe_fail_closed": True,
              "bare_template_is_active_forbidden": True,
          }:
              raise SystemExit("r0009 systemd template defect-fix contract mismatch")
          PY

      - name: Syntax-check control update runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0009_control_update_runtime.py",
              "tests/core/test_operation_control_r0009_control_update_runtime.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run control update runtime regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0009_control_update_runtime.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove narrow fixed production surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0009_control_update_runtime.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "update")',
              'INSTALL_ROOT = Path("/opt/keelaryn")',
              'UNIT_DIR = Path("/etc/systemd/system")',
              'UPDATE_ROOT = Path("/var/lib/keelaryn/operation-control-d0-updates")',
              'WITNESS_ROOT = Path(',
              '"/var/lib/keelaryn/operation-control/r0009-stage-witness"',
              'OLD_SOURCE = "08f2e211f53764590f6ff0f05f86b2de62c14418"',
              'NEW_SOURCE = "e42a4f156abb048f5c8f0bd1884fcae51674a55f"',
              'NEW_PAYLOAD = "8592a314b084a2a1ccc1608168b3c0776cccb1277ffc049f42f3efd5291d4876"',
              'CONTROL_UPDATE_TRANSACTION_ID = "24e9df7d9d305450acd11a8dc8f638769ad87444a9b5d16c8befed76a89c52ce"',
              'template_active_probe=updater._template_has_active_instances,',
              'updater.update_d0_control_plane(',
              '"production_current_mutation_performed": False',
              '"legacy_hub_mutation_performed": False',
              '"drive_mutations_performed": False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing r0009 control-update safety contract: {needle}")
          forbidden = (
              'operation_control_r0007_private_input.py',
              'operation_control_r0008_private_input.py',
              '20727893662cde92998d88ecdca730b69633eaaa',
              'bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d',
              '83e20aeecd4ecd7a8288816065fa700ab3e99b8017177df215e18e03695d4e58',
              '833123b6a7ad2c61087ee8a86700bb9ad8a46298',
              'c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9',
              'parser.add_argument("--install-root"',
              'parser.add_argument("--unit-dir"',
              'parser.add_argument("--credential-path"',
              'parser.add_argument("--operation-root"',
              'parser.add_argument("--transport-root"',
              'parser.add_argument("--update-root"',
              'parser.add_argument("--expected-old',
              'parser.add_argument("--expected-new',
              '"activate"',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe or stale r0009 control-update surface: {needle}")
          PY

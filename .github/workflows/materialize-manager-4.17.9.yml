name: Materialize Manager 4.17.9

on:
  push:
    branches:
      - 'dev/manager-4.17.9'
    paths:
      - '.github/workflows/materialize-manager-4.17.9.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keelaryn-materialize-manager-4.17.9
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact one-shot source identity
        shell: powershell
        run: |
          $expectedParent='7ce4575f3568aaa2211323af2d39989920f3b843'
          $parent=(git rev-parse HEAD^).Trim()
          if ($parent -cne $expectedParent) { throw ('Unexpected materialization parent: '+$parent+' expected='+$expectedParent) }
          $changed=@(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or [string]$changed[0] -cne '.github/workflows/materialize-manager-4.17.9.yml') {
            throw ('Unexpected workflow-publication diff: '+([string]::Join(', ',@($changed))))
          }
          $runtimeHash=(git hash-object -- 'manager/product/runtime/Keelaryn__Manager.ps1').Trim()
          if ($runtimeHash -cne '6b920ba7d63fcd991ccdcd8bde4b8636e6c025e2') { throw ('Unexpected 4.17.8 runtime blob: '+$runtimeHash) }
          $transformHash=(git hash-object -- 'tools/Apply-Manager4179Convergence.ps1').Trim()
          if ($transformHash -cne 'a7be2f784b36d4a75d8650ac5954ba25587272ba') { throw ('Unexpected convergence transformer blob: '+$transformHash) }

      - name: Parse one-shot tooling
        shell: powershell
        run: |
          foreach($path in @('tools\Apply-Manager4179Convergence.ps1','tools\Finalize-Manager4179Materialization.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){throw ($path+' parser failure: '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          }

      - name: Materialize Manager 4.17.9 convergence source
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Apply-Manager4179Convergence.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Finalize-Manager4179Materialization.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run permanent convergence regression before publication
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-Manager4179ConvergenceRegression.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and publish exact development mutation
        shell: powershell
        run: |
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE\tools\Apply-Manager4179Convergence.ps1" -Force
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE\tools\Finalize-Manager4179Materialization.ps1" -Force
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE\.github\workflows\materialize-manager-4.17.9.yml" -Force
          $allowed=@(
            '.github/workflows/materialize-manager-4.17.9.yml',
            'MANAGER_DEVELOPMENT_STATE.json',
            'PUBLIC_FILE_MANIFEST.json',
            'PUBLIC_PROVENANCE.json',
            'manager/README_FIRST.md',
            'manager/product/install/INSTALLATION.json',
            'manager/product/manager_release.json',
            'manager/product/runtime/Keelaryn__Manager.ps1',
            'tools/Apply-Manager4179Convergence.ps1',
            'tools/Finalize-Manager4179Materialization.ps1'
          )
          $changed=@(git status --porcelain | ForEach-Object { $_.Substring(3).Replace('\','/') })
          if($changed.Count-eq0){throw 'Materializer produced no repository changes.'}
          $unexpected=@($changed|Where-Object{$allowed-notcontains$_})
          if($unexpected.Count){throw('Unexpected materializer path(s): '+([string]::Join(', ',@($unexpected))))}
          foreach($required in @('manager/product/runtime/Keelaryn__Manager.ps1','manager/product/install/INSTALLATION.json','manager/product/manager_release.json','PUBLIC_FILE_MANIFEST.json','PUBLIC_PROVENANCE.json')){
            if($changed-notcontains$required){throw('Required materialized path missing from diff: '+$required)}
          }
          git diff --check -- ':!manager/**' ':!tests/framework/**'
          if($LASTEXITCODE-ne0){throw 'Non-authoritative text diff check failed.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Manager 4.17.9: converge multi-Hub recovery transactions'
          git push origin HEAD:dev/manager-4.17.9

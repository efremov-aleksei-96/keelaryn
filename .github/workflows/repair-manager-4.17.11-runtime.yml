name: Repair Manager 4.17.11 runtime materialization

on:
  push:
    branches:
      - 'dev/manager-4.17.11'
    paths:
      - '.github/workflows/repair-manager-4.17.11-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keelaryn-repair-manager-4.17.11-runtime
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore base runtime and apply exact byte-preserving edits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='9307b9ebb66dbff2a36b48957783958c66d28801'
          $path='manager/product/runtime/Keelaryn__Manager.ps1'
          $expectedBaseSha='f233c216540702ac1838b19c991e7397a1e549993a8cbf206f11b7a854954755'
          git checkout $base -- $path
          $baseSha=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if($baseSha-cne$expectedBaseSha){throw('Restored base runtime identity mismatch: '+$baseSha)}

          $bytes=[IO.File]::ReadAllBytes($path)
          $utf8=New-Object Text.UTF8Encoding($false,$true)
          $text=$utf8.GetString($bytes)
          $roundtrip=$utf8.GetBytes($text)
          if($roundtrip.Length-ne$bytes.Length){throw 'UTF-8 roundtrip byte length mismatch before edits.'}
          for($i=0;$i-lt$bytes.Length;$i++){if($bytes[$i]-ne$roundtrip[$i]){throw('UTF-8 roundtrip mismatch at byte '+$i)}}

          function Replace-One([string]$input,[string]$old,[string]$new,[string]$label){
            $first=$input.IndexOf($old,[StringComparison]::Ordinal)
            if($first-lt0){throw($label+' not found.')}
            $second=$input.IndexOf($old,$first+$old.Length,[StringComparison]::Ordinal)
            if($second-ge0){throw($label+' is not unique.')}
            return $input.Substring(0,$first)+$new+$input.Substring($first+$old.Length)
          }

          $text=Replace-One $text '$ManagerVersion = "4.17.10"'.Replace('\"','"') '$ManagerVersion = "4.17.11"'.Replace('\"','"') 'Manager version marker'
          $old='    $pendingCandidates=@(Get-ChildItem -LiteralPath $Inbox -File -Filter ''*.zip'' -ErrorAction SilentlyContinue | Where-Object { $_.Name.StartsWith(''Keelaryn__Hub_CANDIDATE_'',[System.StringComparison]::OrdinalIgnoreCase) -or $_.Name.StartsWith([string]$LegacyCoreCompat.CandidatePrefix,[System.StringComparison]::OrdinalIgnoreCase) }).Count'
          $new='    $pendingCandidates=@(Get-ChildItem -LiteralPath $HubInbox -File -Filter ''*.zip'' -ErrorAction SilentlyContinue | Where-Object { $_.Name.StartsWith(''Keelaryn__Hub_CANDIDATE_'',[System.StringComparison]::OrdinalIgnoreCase) -or $_.Name.StartsWith([string]$LegacyCoreCompat.CandidatePrefix,[System.StringComparison]::OrdinalIgnoreCase) }).Count'
          $text=Replace-One $text $old $new 'Invoke-Update pending CANDIDATE inventory'
          [IO.File]::WriteAllBytes((Resolve-Path $path),$utf8.GetBytes($text))

      - name: Prove minimal runtime delta
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='9307b9ebb66dbff2a36b48957783958c66d28801'
          $path='manager/product/runtime/Keelaryn__Manager.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw('Runtime parser failure: '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          $defs=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.FunctionDefinitionAst]},$true)|Where-Object{$_.Name-ceq'Invoke-RegisterExistingInstance'})
          if($defs.Count-ne1){throw('Runtime structural duplication remains: Invoke-RegisterExistingInstance count='+$defs.Count)}
          $runtime=[IO.File]::ReadAllText((Resolve-Path $path))
          if(([regex]::Matches($runtime,'(?m)^\$ManagerVersion = "4\.17\.11"\r?$')).Count-ne1){throw 'Current version marker is not unique.'}
          $update=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.FunctionDefinitionAst]-and$n.Name-ceq'Invoke-Update'},$true))
          if($update.Count-ne1){throw('Invoke-Update count='+$update.Count)}
          $pending=[regex]::Matches([string]$update[0].Extent.Text,'(?m)^\s*\$pendingCandidates=@\(Get-ChildItem -LiteralPath \$(?<inbox>\w+) -File -Filter ''\*\.zip''')
          if($pending.Count-ne1-or$pending[0].Groups['inbox'].Value-cne'HubInbox'){throw 'Invoke-Update pendingCandidates is not uniquely bound to $HubInbox.'}

          $num=(git diff --numstat $base -- $path).Trim()
          Write-Host ('Runtime diff numstat: '+$num)
          if($num-notmatch '^(\d+)\s+(\d+)\s+') {throw 'Could not parse runtime diff numstat.'}
          $add=[int]$Matches[1];$del=[int]$Matches[2]
          if($add-gt4-or$del-gt4){throw('Runtime delta is not minimal: +'+$add+' -'+$del)}
          $size=(Get-Item -LiteralPath $path).Length
          if($size-lt560000-or$size-gt570000){throw('Runtime size outside expected narrow range after repair: '+$size)}
          Write-Host ('Minimal runtime repair: PASS. bytes='+$size+' definitions='+$defs.Count) -ForegroundColor Green

      - name: Commit repaired runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager/product/runtime/Keelaryn__Manager.ps1
          $staged=@(git diff --cached --name-only)
          if($staged.Count-ne1-or[string]$staged[0]-cne'manager/product/runtime/Keelaryn__Manager.ps1'){throw('Unexpected staged repair paths: '+([string]::Join(', ',$staged)))}
          git commit -m 'Manager 4.17.11: restore minimal runtime delta'
          git push origin HEAD:dev/manager-4.17.11

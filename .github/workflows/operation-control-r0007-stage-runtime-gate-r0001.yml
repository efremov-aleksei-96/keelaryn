name: Operation control r0007 stage runtime gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_stage_runtime.py'
      - 'tools/operation_control_r0007_stage_execution.py'
      - 'tools/operation_control_r0007_private_input.py'
      - 'tests/core/test_operation_control_r0007_stage_runtime.py'
      - '.github/workflows/operation-control-r0007-stage-runtime-gate-r0001.yml'
      - 'docs/authorizations/operation-control-r0007-stage/**'
      - 'docs/evidence/R0007_PRIVATE_INPUT_ACQUIRE_*.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-stage-runtime-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact real authority and acquired-input evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority = Path("docs/authorizations/operation-control-r0007-stage/e7869ce5efd9d63da191e30f7c4e2c2b.json")
          raw = authority.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          canonical = (
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n"
          ).encode("utf-8")
          if raw != canonical:
              raise SystemExit("real authority is not canonical")
          if hashlib.sha256(raw).hexdigest() != "002c725f8ddcd5ad1a579116d37ec4aad58521356bf11e57103f0babe81527f8":
              raise SystemExit("real authority SHA mismatch")
          if value.get("transaction_id") != "e7869ce5efd9d63da191e30f7c4e2c2b":
              raise SystemExit("real authority transaction mismatch")
          if value.get("production_stage_authorized") is not True:
              raise SystemExit("real authority does not permit inert stage")
          for key in (
              "activation_authorized",
              "drive_content_mutation_authorized",
              "legacy_hub_mutation_authorized",
              "writer_mutation_authorized",
              "credential_mutation_authorized",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"unsafe authority flag: {key}")

          evidence_path = Path("docs/evidence/R0007_PRIVATE_INPUT_ACQUIRE_20260922.json")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          input_state = evidence.get("input_state", {})
          identity = input_state.get("identity", {})
          if evidence.get("conclusion") != "PASS_PRIVATE_INPUT_ACQUIRED_EXACT":
              raise SystemExit("private-input acquire evidence is not PASS")
          if input_state.get("state") != "INPUT_EXACT" or input_state.get("exact") is not True:
              raise SystemExit("private input was not exact")
          expected = {
              "source_commit": "833123b6a7ad2c61087ee8a86700bb9ad8a46298",
              "payload_sha256": "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9",
              "payload_size": 414534,
              "file_count": 208,
          }
          if identity != expected:
              raise SystemExit("acquired private-input identity mismatch")
          mutations = evidence.get("mutations", {})
          for key in (
              "release_publication",
              "stage_witness",
              "activation",
              "legacy_hub",
              "writer",
              "credential",
              "drive",
          ):
              if mutations.get(key) is not False:
                  raise SystemExit(f"unexpected prior acquire mutation: {key}")
          PY

      - name: Syntax-check stage runtime tooling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0007_stage_runtime.py",
              "tests/core/test_operation_control_r0007_stage_runtime.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run stage runtime regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0007_stage_runtime.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove production CLI is narrow and inert-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0007_stage_runtime.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "stage")',
              '/opt/keelaryn/releases',
              'DEFAULT_INPUT_ROOT = private_input.DEFAULT_INPUT_ROOT',
              '/var/lib/keelaryn/operation-control/r0007-stage-witness',
              'execution.execute_once(',
              'activation_performed": False',
              'drive_mutations_performed": False',
              'release_publication_performed": None if stage_command else False',
              'stage_witness_mutation_performed": None if stage_command else False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing stage-runtime safety contract: {needle}")
          forbidden = (
              'parser.add_argument("--repository-root"',
              'parser.add_argument("--input-root"',
              'parser.add_argument("--releases-root"',
              'parser.add_argument("--witness-root"',
              'parser.add_argument("--output"',
              '"activate"',
              'release_switch',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe stage-runtime surface: {needle}")
          PY

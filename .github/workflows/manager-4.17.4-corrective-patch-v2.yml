name: Manager 4.17.4 corrective patch v2

on:
  push:
    branches:
      - 'dev/manager-4.17.4'
    paths:
      - '.github/workflows/manager-4.17.4-corrective-patch-v2.yml'

permissions:
  contents: write

concurrency:
  group: manager-4174-corrective-patch-v2
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: dev/manager-4.17.4

      - name: Apply exact 4.17.4 transaction patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $utf8=New-Object System.Text.UTF8Encoding($false)
          function Read-Text([string]$Path){return [IO.File]::ReadAllText($Path,[Text.Encoding]::UTF8)}
          function Write-Text([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$utf8)}
          function Replace-ExactText([string]$Path,[string]$Old,[string]$New,[string]$Label){
            $text=Read-Text $Path
            $first=$text.IndexOf($Old,[StringComparison]::Ordinal)
            if($first-lt0){throw("Patch anchor missing: $Label")}
            if($text.IndexOf($Old,$first+$Old.Length,[StringComparison]::Ordinal)-ge0){throw("Patch anchor not unique: $Label")}
            Write-Text $Path ($text.Substring(0,$first)+$New+$text.Substring($first+$Old.Length))
            Write-Host ("PATCH PASS: $Label") -ForegroundColor Green
          }
          function Replace-FunctionDefinition([string]$Path,[string]$Name,[string]$NewText){
            $text=Read-Text $Path
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)
            if(@($errors).Count-ne0){throw('Parser failed before function replacement: '+$Name+'; '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
            $rows=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.FunctionDefinitionAst]-and$n.Name-eq$Name},$true))
            if($rows.Count-ne1){throw('Expected exactly one function '+$Name+'; actual='+$rows.Count)}
            $node=$rows[0]
            Write-Text $Path ($text.Substring(0,$node.Extent.StartOffset)+$NewText+$text.Substring($node.Extent.EndOffset))
            Write-Host ('PATCH PASS: function '+$Name) -ForegroundColor Green
          }

          $runtime=Join-Path $root 'manager\product\runtime\Keelaryn__Manager.ps1'
          $install=Join-Path $root 'manager\product\install\INSTALLATION.json'
          $policy=Join-Path $root 'manager\product\manager_release.json'
          $readme=Join-Path $root 'manager\README_FIRST.md'

          $newState=@'
          function New-RegisteredInstanceStateFromVault([string]$InstanceId,[string]$VaultPath) {
              $paths=Get-InstanceStatePaths $InstanceId
              if(Test-Path -LiteralPath $paths.Root){throw('Instance state already exists: '+$paths.Root)}
              if(-not(Test-Path -LiteralPath $script:InstancesStateRoot -PathType Container)){New-Item -ItemType Directory -Force -Path $script:InstancesStateRoot|Out-Null}
              $staging=Join-Path $script:InstancesStateRoot ('.staging-'+$InstanceId+'-'+[guid]::NewGuid().ToString('N'))
              try{
                  New-Item -ItemType Directory -Force -Path (Join-Path $staging 'baseline'),(Join-Path $staging 'inbox'),(Join-Path $staging 'history\checkpoints'),(Join-Path $staging 'history\rollback')|Out-Null
                  $current=Join-Path $staging 'baseline\Keelaryn__Hub_CURRENT.zip'
                  Write-PortableHubZip $VaultPath $current 'Keelaryn__Hub'
                  $session=Open-HubZipInspectionSession $current
                  if(-not$session){throw 'Generated per-instance CURRENT failed ZIP validation.'}
                  try{
                      $state=Read-ZipState $current $session
                      $artifact=Read-ZipArtifactManifest $current $session
                      if(-not$state-or-not$artifact-or[string]$state.InstanceId-ne$InstanceId-or[string]$artifact.InstanceId-ne$InstanceId){throw 'Generated per-instance CURRENT identity mismatch.'}
                      $analysis=Get-PortableVaultAnalysis $VaultPath
                      $hash=Get-ZipHashPair $current $session
                      if([string]$analysis.ContentHash-ne[string]$hash.ContentHash-or[string]$analysis.PayloadHash-ne[string]$hash.PayloadHash){throw 'Generated per-instance CURRENT differs from source Hub.'}
                  }finally{Close-HubZipInspectionSession $session}
                  Move-DirectoryFailIfDestinationExists $staging $paths.Root
                  return $paths
              }finally{if(Test-Path -LiteralPath $staging){Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue}}
          }
          '@.Trim()
          Replace-FunctionDefinition $runtime 'New-RegisteredInstanceStateFromVault' $newState

          $newRegister=@'
          function Invoke-RegisterExistingInstance([string]$Path,[string]$Name,[bool]$Activate=$false) {
              if(-not(Test-Path -LiteralPath $script:InstanceRegistryFile -PathType Leaf)){throw 'Initialize the multi-Hub registry before registering another Hub.'}
              $registry=Get-ManagerInstanceRegistry
              $full=Assert-RegisteredVaultStructuralSafetyEarly $Path
              if(-not(& $TestHubCandidate $full)){throw('Registration target is not a valid Keelaryn Hub: '+$full)}
              $state=Read-VaultMetadataAt $full
              $artifact=Read-VaultArtifactManifestAt $full
              if(-not$state-or-not$artifact-or-not$state.InstanceId-or[string]$artifact.InstanceId-ne[string]$state.InstanceId){throw 'Registration target lacks a consistent canonical instance identity.'}
              $id=[string]$state.InstanceId
              $display=if($Name){$Name}else{Split-Path $full -Leaf}
              if(-not$display){$display='Hub-'+$id.Substring(0,8)}
              $pathKey=Get-KeelarynNormalizedPathKey $full
              $sameId=@($registry.instances|Where-Object{[string]$_.instance_id-eq$id})
              $samePath=@($registry.instances|Where-Object{(Get-KeelarynNormalizedPathKey ([string]$_.vault_path))-eq$pathKey})
              if($sameId.Count-gt0-or$samePath.Count-gt0){
                  if($sameId.Count-eq1-and$samePath.Count-eq1-and[string]$sameId[0].instance_id-eq[string]$samePath[0].instance_id){
                      if($Activate){return Invoke-SwitchRegisteredInstance $id}
                      Write-Host 'Hub is already registered.' -ForegroundColor Green
                      return 0
                  }
                  throw 'Registration conflicts with an existing instance_id or Hub path.'
              }
              foreach($row in @($registry.instances)){
                  if(Test-KeelarynPathOverlap $full ([string]$row.vault_path)){throw('Hub path overlaps registered Hub '+[string]$row.name+': '+[string]$row.vault_path)}
                  if(([string]$row.name).Normalize([System.Text.NormalizationForm]::FormC).ToLowerInvariant()-eq$display.Normalize([System.Text.NormalizationForm]::FormC).ToLowerInvariant()){throw('Instance display name is already registered: '+$display)}
              }
              $candidateRow=[pscustomobject]@{instance_id=$id;name=$display;vault_path=$full;registered_utc=(Get-Date).ToUniversalTime().ToString('o')}
              $paths=$null
              $registryCommitted=$false
              $registryWriteStarted=$false
              try{
                  $paths=New-RegisteredInstanceStateFromVault $id $full
                  # The generated state and source Hub can change after staging validation. Revalidate
                  # the exact published pair immediately before instances.json becomes authoritative.
                  $null=Assert-RegisteredInstanceBaseline $candidateRow
                  $newRows=@($registry.instances)+@($candidateRow)
                  $registryWriteStarted=$true
                  Write-ManagerInstanceRegistry ([ordered]@{schema='keelaryn.manager.instances.v1';registry_revision=([int]$registry.registry_revision+1);instances=@($newRows)})
                  $registryCommitted=$true
                  Write-Host ('Registered Hub: '+$display+' | '+$id) -ForegroundColor Green
                  if($Activate){return Invoke-SwitchRegisteredInstance $id}
                  return 0
              }catch{
                  $primary=$_.Exception.Message
                  $verificationFailure=$null
                  $registryNotCommitted=$false
                  if(-not$registryCommitted){
                      if(-not$registryWriteStarted){
                          $registryNotCommitted=$true
                      }else{
                          try{
                              $after=Get-ManagerInstanceRegistry
                              $durable=@($after.instances|Where-Object{
                                  [string]$_.instance_id-eq$id -and
                                  (Get-KeelarynNormalizedPathKey ([string]$_.vault_path))-eq$pathKey -and
                                  [string]$_.name-ceq$display
                              })
                              $identityOrPath=@($after.instances|Where-Object{
                                  [string]$_.instance_id-eq$id -or
                                  (Get-KeelarynNormalizedPathKey ([string]$_.vault_path))-eq$pathKey
                              })
                              if($durable.Count-eq1 -and $identityOrPath.Count-eq1){
                                  $registryCommitted=$true
                              }elseif($durable.Count-eq0 -and $identityOrPath.Count-eq0){
                                  $registryNotCommitted=$true
                              }else{
                                  $verificationFailure=('Registry verification returned ambiguous matching rows: exact={0}; identity_or_path={1}.' -f $durable.Count,$identityOrPath.Count)
                              }
                          }catch{
                              $verificationFailure=$_.Exception.Message
                          }
                      }
                  }
                  if($registryNotCommitted -and $paths -and (Test-Path -LiteralPath $paths.Root)){
                      try{
                          # Delete only state that still proves it belongs to this exact Hub/instance.
                          $null=Assert-RegisteredInstanceBaseline $candidateRow
                          Remove-Item -LiteralPath $paths.Root -Recurse -Force -ErrorAction Stop
                      }catch{
                          throw('Hub registration failed before registry commit and per-instance state rollback could not be completed safely. Primary: '+$primary+' Rollback: '+$_.Exception.Message)
                      }
                  }
                  if($registryCommitted){throw('Hub registration durable commit succeeded, but subsequent operation failed; registered state was preserved. '+$primary)}
                  if($registryWriteStarted -and -not$registryNotCommitted){
                      if([string]::IsNullOrWhiteSpace([string]$verificationFailure)){$verificationFailure='Registry verification could not establish whether the write committed.'}
                      throw('Hub registration registry commit status is ambiguous after a write failure; registered state was preserved. Primary failure: '+$primary+' Commit verification failure: '+$verificationFailure)
                  }
                  throw
              }
          }
          '@.Trim()
          Replace-FunctionDefinition $runtime 'Invoke-RegisterExistingInstance' $newRegister

          $newGenesis=@'
          function Invoke-GenesisRegisteredInstance([string]$TargetPath,[string]$DisplayName,[string]$ConfigPath,[bool]$Confirmed) {
              if(-not$script:InstanceRegistryActive){throw 'Multi-Hub registry is not active; initialize it from the existing Hub first.'}
              Assert-InvocationInstanceUnchanged
              $registry=Get-ManagerInstanceRegistry
              $activeBefore=Read-ActiveInstanceEarly
              $target=Assert-NewRegisteredHubTargetPathSafe $TargetPath
              $name=([string]$DisplayName).Trim()
              if(-not$name){$name=Split-Path $target -Leaf}
              if(-not$name-or$name.Length-gt64-or$name-match'[\x00-\x1F]'){throw 'New Hub display name is invalid.'}
              $nameKey=$name.Normalize([System.Text.NormalizationForm]::FormC).ToLowerInvariant()
              if(@($registry.instances|Where-Object{([string]$_.name).Normalize([System.Text.NormalizationForm]::FormC).ToLowerInvariant()-eq$nameKey}).Count-ne0){
                  throw('Instance display name is already registered: '+$name)
              }

              $managerWorkRoot=$WorkRoot
              $tx=Join-Path $managerWorkRoot ('instance_genesis_'+[guid]::NewGuid().ToString('N'))
              $txVault=Join-Path $tx 'vault'
              $txState=Join-Path $tx 'instance-state'
              $txWork=Join-Path $tx 'work'
              $CurrentZip=Join-Path $txState 'baseline\Keelaryn__Hub_CURRENT.zip'
              $Checkpoints=Join-Path $txState 'history\checkpoints'
              $Rollback=Join-Path $txState 'history\rollback'
              $HubInbox=Join-Path $txState 'inbox'
              $WorkRoot=$txWork
              $Vault=$txVault
              $publishedVault=$false
              $publishedState=$false
              $registryCommitted=$false
              $registryWriteStarted=$false
              $instanceId=$null
              $candidateRow=$null
              try{
                  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $CurrentZip),$Checkpoints,$Rollback,$HubInbox,$WorkRoot|Out-Null
                  $rc=Invoke-Genesis $ConfigPath $Confirmed
                  if($rc-ne0){throw('Nested Genesis failed with ExitCode '+$rc+'.')}
                  $vaultReady=Test-Path -LiteralPath $Vault -PathType Container
                  $currentReady=Test-Path -LiteralPath $CurrentZip -PathType Leaf
                  if(-not$vaultReady -and -not$currentReady){
                      if([string]::IsNullOrWhiteSpace($ConfigPath)-and-not$Confirmed){
                          Write-Host 'Registered Genesis cancelled; no Hub was created.' -ForegroundColor DarkGray
                          return 0
                      }
                      throw 'Nested non-interactive Genesis returned success without staged Hub/CURRENT.'
                  }
                  if(-not$vaultReady -or -not$currentReady){throw 'Nested Genesis returned success with partial staged Hub/CURRENT state.'}
                  $state=Read-VaultMetadataAt $Vault
                  $artifact=Read-VaultArtifactManifestAt $Vault
                  if(-not$state-or-not$artifact-or-not$state.InstanceId-or[string]$artifact.InstanceId-ne[string]$state.InstanceId){throw 'Staged registered Genesis identity is invalid.'}
                  $instanceId=[string]$state.InstanceId
                  if(@($registry.instances|Where-Object{[string]$_.instance_id-eq$instanceId}).Count-ne0){throw('Generated Genesis instance_id unexpectedly collides with registry: '+$instanceId)}
                  $paths=Get-InstanceStatePaths $instanceId
                  if(Test-Path -LiteralPath $paths.Root){throw('Generated instance state destination already exists: '+$paths.Root)}
                  $session=Open-HubZipInspectionSession $CurrentZip
                  if(-not$session){throw 'Staged registered Genesis CURRENT is invalid.'}
                  try{
                      $zs=Read-ZipState $CurrentZip $session
                      $za=Read-ZipArtifactManifest $CurrentZip $session
                      $analysis=Get-PortableVaultAnalysis $Vault
                      $zh=Get-ZipHashPair $CurrentZip $session
                      if(-not$zs-or-not$za-or[string]$zs.InstanceId-ne$instanceId-or[string]$za.InstanceId-ne$instanceId){throw 'Staged registered Genesis CURRENT identity mismatch.'}
                      if([string]$analysis.ContentHash-ne[string]$zh.ContentHash-or[string]$analysis.PayloadHash-ne[string]$zh.PayloadHash){throw 'Staged registered Genesis Hub/CURRENT content mismatch.'}
                  }finally{Close-HubZipInspectionSession $session}

                  $hubsRoot=Split-Path -Parent $target
                  if(-not(Test-Path -LiteralPath $hubsRoot -PathType Container)){New-Item -ItemType Directory -Path $hubsRoot|Out-Null}
                  $hubsRootItem=Get-Item -LiteralPath $hubsRoot -Force -ErrorAction Stop
                  if(($hubsRootItem.Attributes-band[System.IO.FileAttributes]::ReparsePoint)-ne0){throw('Canonical hubs root became unsafe before commit: '+$hubsRoot)}
                  New-Item -ItemType Directory -Force -Path $script:InstancesStateRoot|Out-Null

                  Move-DirectoryFailIfDestinationExists $Vault $target
                  $publishedVault=$true
                  Move-DirectoryFailIfDestinationExists $txState $paths.Root
                  $publishedState=$true

                  $candidateRow=[pscustomobject]@{
                      instance_id=$instanceId
                      name=$name
                      vault_path=$target
                      registered_utc=(Get-Date).ToUniversalTime().ToString('o')
                  }
                  # Validate the exact published Hub/state pair immediately before registry commit.
                  $null=Assert-RegisteredInstanceBaseline $candidateRow
                  $newRows=@($registry.instances)+@($candidateRow)
                  $registryWriteStarted=$true
                  Write-ManagerInstanceRegistry ([ordered]@{
                      schema='keelaryn.manager.instances.v1'
                      registry_revision=([int]$registry.registry_revision+1)
                      instances=@($newRows)
                  })
                  $registryCommitted=$true

                  $committed=Get-ManagerInstanceRegistry
                  $row=@($committed.instances|Where-Object{[string]$_.instance_id-eq$instanceId})
                  if($row.Count-ne1-or[string]$row[0].vault_path-cne$target-or[string]$row[0].name-cne$name){throw 'Registered Genesis commit verification failed.'}
                  $null=Assert-RegisteredInstanceBaseline $row[0]
                  $activeAfter=Read-ActiveInstanceEarly
                  if([string]$activeAfter.instance_id-ne[string]$activeBefore.instance_id){throw 'Registered Genesis unexpectedly changed the active Hub.'}

                  Write-Host ('New Hub created and registered: '+$name) -ForegroundColor Green
                  Write-Host ('instance_id: '+$instanceId)
                  Write-Host ('path: '+$target)
                  Write-Host 'Active Hub was not changed.' -ForegroundColor DarkGray
                  return 0
              }
              catch{
                  $primary=$_.Exception.Message
                  $verificationFailure=$null
                  $registryNotCommitted=$false
                  if(-not$registryCommitted){
                      if(-not$registryWriteStarted){
                          $registryNotCommitted=$true
                      }else{
                          try{
                              $after=Get-ManagerInstanceRegistry
                              $targetKey=Get-KeelarynNormalizedPathKey $target
                              $durable=@($after.instances|Where-Object{
                                  [string]$_.instance_id-eq$instanceId -and
                                  (Get-KeelarynNormalizedPathKey ([string]$_.vault_path))-eq$targetKey -and
                                  [string]$_.name-ceq$name
                              })
                              $identityOrPath=@($after.instances|Where-Object{
                                  [string]$_.instance_id-eq$instanceId -or
                                  (Get-KeelarynNormalizedPathKey ([string]$_.vault_path))-eq$targetKey
                              })
                              if($durable.Count-eq1 -and $identityOrPath.Count-eq1){
                                  $registryCommitted=$true
                              }elseif($durable.Count-eq0 -and $identityOrPath.Count-eq0){
                                  $registryNotCommitted=$true
                              }else{
                                  $verificationFailure=('Registry verification returned ambiguous matching rows: exact={0}; identity_or_path={1}.' -f $durable.Count,$identityOrPath.Count)
                              }
                          }catch{
                              $verificationFailure=$_.Exception.Message
                          }
                      }
                  }
                  if($registryNotCommitted){
                      $cleanupErrors=New-Object System.Collections.ArrayList
                      if($publishedState-and$publishedVault-and$candidateRow){
                          try{
                              # Prove the published pair still belongs to this generated instance before deletion.
                              $null=Assert-RegisteredInstanceBaseline $candidateRow
                              if(Test-Path -LiteralPath $paths.Root){Remove-Item -LiteralPath $paths.Root -Recurse -Force -ErrorAction Stop}
                              if(Test-Path -LiteralPath $target){Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop}
                              $publishedState=$false;$publishedVault=$false
                          }catch{[void]$cleanupErrors.Add('published pair: '+$_.Exception.Message)}
                      }elseif($publishedVault-and-not$publishedState){
                          try{
                              $actualId=& $ReadBoundInstanceId $target
                              if(-not$instanceId-or$actualId-ne$instanceId){throw 'Published Hub ownership could not be proven.'}
                              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
                              $publishedVault=$false
                          }catch{[void]$cleanupErrors.Add('vault: '+$_.Exception.Message)}
                      }elseif($publishedState){
                          [void]$cleanupErrors.Add('state: published state exists without a published Hub; ownership cleanup refused.')
                      }
                      if($cleanupErrors.Count-ne0){throw('Registered Genesis failed before registry commit and rollback cleanup could not be completed safely. Primary: '+$primary+' Cleanup: '+([string]::Join(' | ',@($cleanupErrors))))}
                      throw('Registered Genesis failed before registry commit; published Hub/state were rolled back. '+$primary)
                  }
                  if($registryCommitted){throw('Registered Genesis durable registry commit succeeded, but subsequent operation failed; published Hub/state were preserved. '+$primary)}
                  if($registryWriteStarted){
                      if([string]::IsNullOrWhiteSpace([string]$verificationFailure)){$verificationFailure='Registry verification could not establish whether the write committed.'}
                      throw('Registered Genesis registry commit status is ambiguous after a write failure; published Hub/state were preserved. Primary failure: '+$primary+' Commit verification failure: '+$verificationFailure)
                  }
                  throw
              }
              finally{
                  if(Test-Path -LiteralPath $tx){Remove-Item -LiteralPath $tx -Recurse -Force -ErrorAction SilentlyContinue}
              }
          }
          '@.Trim()
          Replace-FunctionDefinition $runtime 'Invoke-GenesisRegisteredInstance' $newGenesis

          Replace-ExactText $runtime '$ManagerVersion = "4.17.3"' '$ManagerVersion = "4.17.4"' 'runtime version'
          Replace-ExactText $install '"manager_version": "4.17.3"' '"manager_version": "4.17.4"' 'INSTALLATION version'
          Replace-ExactText $policy '"manager_version":  "4.17.3"' '"manager_version":  "4.17.4"' 'release-policy version'
          Replace-ExactText $readme '# Keelaryn Manager 4.17.3' "# Keelaryn Manager 4.17.4`r`nManager 4.17.4 is the corrective successor to rejected candidate 4.17.3. It generalizes fail-if-exists directory publication to per-instance state creation, performs fresh published-baseline validation immediately before registry commits, and preserves/reports durable or ambiguous registered-Genesis commit outcomes without destructive rollback.`r`n`r`n## 4.17.3 context" 'README version/context'

          foreach($path in @($runtime,(Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'),(Join-Path $root 'tools\Invoke-Manager4174ReviewRegression.ps1'))){
              $tokens=$null;$errors=$null
              [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
              if(@($errors).Count-ne0){throw('Parser failed: '+$path+'; '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          }

          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $manifest=Get-Content -LiteralPath (Join-Path $root 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $prov=[ordered]@{
              schema='keelaryn.public-repository-provenance.v2'
              role='public_source_sync_candidate'
              source_manager_version='4.17.4'
              source_gate_baseline_manager_version='4.17.2'
              source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
              source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
              production_validation=[ordered]@{full_gate_pass=$false;gate_revision=$null;framework_revision=24;tested_update_sha256=$null;production_doctor_pass=$false;production_ux_smoke_pass=$false;production_managed_content_prefix=$null}
              personal_hub_included=$false
              manager_runtime_state_included=$false
              local_test_evidence_included=$false
              gate_framework=[ordered]@{version='2.0';revision=24;windows_qualified=$true;frozen_for_manager_candidate=$false}
              license=[ordered]@{spdx_id='MIT';file='LICENSE';copyright='Copyright (c) 2026 Keelaryn contributors'}
              public_candidate_revision=6
              git_checkout_contract=[ordered]@{manager_authoritative_tree_attribute='-text';framework_authoritative_tree_attribute='-text';core_autocrlf_true_roundtrip_required=$true}
              known_nonsecret_source_hygiene_notes=@('manager/product/docs/TESTING.md retains a maintainer-local D:\0\0__Core example for historical/maintainer qualification context; it is not a product installation default.')
              ci_policy=[ordered]@{github_actions='pull_request + main push + manual';hosted_scope='repository verification + Hub-blind SourceGate + hosted disposable Full Gate + Generic DISTRIBUTION smoke';full_gate='CURRENT-backed Windows Full Gate plus production Doctor, production UX smoke and Hub immutability before publication';update_identity='when full_gate_pass=true, PR and main BuildRelease UPDATE SHA-256 must equal production_validation.tested_update_sha256; publish consumes those gated bytes'}
              known_nonsecret_hygiene_notes=@('manager/product/docs/TESTING.md retains a maintainer-local D:\0\0__Core example; it is not a product default.')
          }
          Write-Text (Join-Path $root 'PUBLIC_PROVENANCE.json') ((($prov|ConvertTo-Json -Depth 30).Replace("`r`n","`n"))+"`n")

      - name: Validate corrected product
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $runtime=Join-Path $root 'manager\product\runtime\Keelaryn__Manager.ps1'
          $menu=Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Invoke-Manager4174ReviewRegression.ps1') -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runtime -SelfTest
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $menu -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $sourceState=Join-Path $root 'manager\state'
          if(Test-Path -LiteralPath $sourceState){Remove-Item -LiteralPath $sourceState -Recurse -Force}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Verify-PublicRepository.ps1') -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Commit validated 4.17.4 development bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git status --short
          if(-not(git status --porcelain)){throw 'Corrective patch produced no changes.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git commit -m 'Manager 4.17.4: harden multi-Hub publication commit boundaries'
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          git push origin HEAD:dev/manager-4.17.4
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

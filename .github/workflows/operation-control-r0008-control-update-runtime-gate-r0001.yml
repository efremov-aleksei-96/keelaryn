name: Operation control r0008 control update runtime gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0008_control_update_runtime.py'
      - 'tools/operation_control_r0008_private_input.py'
      - 'tools/operation_control_r0008_stage_execution.py'
      - 'deploy/zero-based-vps/operation_control_d0_update.py'
      - 'tests/core/test_operation_control_r0008_control_update_runtime.py'
      - '.github/workflows/operation-control-r0008-control-update-runtime-gate-r0001.yml'
      - 'docs/evidence/R0008_STAGE_COMPLETED_20260923.json'
      - 'docs/candidates/operation-control-r0008-20260923-01.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0008-control-update-runtime-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact r0008 staged authority and transition identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("docs/evidence/R0008_STAGE_COMPLETED_20260923.json")
              .read_text(encoding="utf-8")
          )
          if evidence.get("conclusion") != "PASS_R0008_STAGE_COMPLETED_AND_POSTVERIFIED_EXACT":
              raise SystemExit("r0008 stage completion evidence is not exact PASS")
          post = evidence.get("post_stage_reconcile", {}).get("execution", {})
          if post.get("state") != "COMPLETED_EXACT":
              raise SystemExit("r0008 stage execution is not terminal exact")
          if post.get("release_state") != "STAGED_EXACT":
              raise SystemExit("r0008 release is not staged exact")
          if post.get("witness_root_state") != "PRESENT":
              raise SystemExit("r0008 stage witness is not present")
          if evidence.get("live_boundary", {}).get("control_source_commit") != "08f2e211f53764590f6ff0f05f86b2de62c14418":
              raise SystemExit("control predecessor mismatch")

          candidate = json.loads(
              Path("docs/candidates/operation-control-r0008-20260923-01.json")
              .read_text(encoding="utf-8")
          )
          if candidate.get("frozen_source_commit") != "20727893662cde92998d88ecdca730b69633eaaa":
              raise SystemExit("frozen r0008 source mismatch")
          payload = candidate.get("payload", {})
          if payload.get("sha256") != "bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d":
              raise SystemExit("frozen r0008 payload mismatch")
          if payload.get("size") != 428403 or payload.get("file_count") != 217:
              raise SystemExit("frozen r0008 payload dimensions mismatch")
          control = candidate.get("control_update_transaction", {})
          if control.get("deterministic_id") != "83e20aeecd4ecd7a8288816065fa700ab3e99b8017177df215e18e03695d4e58":
              raise SystemExit("r0008 control-update transaction mismatch")
          rejected = candidate.get("rejected_attempt", {})
          if rejected.get("terminal_state") != "ROLLED_BACK_EXACT" or rejected.get("retry_allowed") is not False:
              raise SystemExit("rejected r0007 disposition mismatch")
          if rejected.get("control_update_transaction_id") == control.get("deterministic_id"):
              raise SystemExit("r0008 transaction reuses rejected r0007 identity")
          PY

      - name: Syntax-check control update runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0008_control_update_runtime.py",
              "tests/core/test_operation_control_r0008_control_update_runtime.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run control update runtime regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0008_control_update_runtime.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove narrow fixed production surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0008_control_update_runtime.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "update")',
              'INSTALL_ROOT = Path("/opt/keelaryn")',
              'UNIT_DIR = Path("/etc/systemd/system")',
              'UPDATE_ROOT = Path("/var/lib/keelaryn/operation-control-d0-updates")',
              'WITNESS_ROOT = Path(',
              '"/var/lib/keelaryn/operation-control/r0008-stage-witness"',
              'OLD_SOURCE = "08f2e211f53764590f6ff0f05f86b2de62c14418"',
              'NEW_SOURCE = "20727893662cde92998d88ecdca730b69633eaaa"',
              'NEW_PAYLOAD = "bc74c0e5b7eba90465fb8d59c5bb9a619ebc1f2c737c06fbf357ae062c5b374d"',
              'CONTROL_UPDATE_TRANSACTION_ID = "83e20aeecd4ecd7a8288816065fa700ab3e99b8017177df215e18e03695d4e58"',
              'updater.update_d0_control_plane(',
              '"production_current_mutation_performed": False',
              '"legacy_hub_mutation_performed": False',
              '"drive_mutations_performed": False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing r0008 control-update safety contract: {needle}")
          forbidden = (
              'operation_control_r0007_private_input.py',
              '833123b6a7ad2c61087ee8a86700bb9ad8a46298',
              'c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9',
              'parser.add_argument("--install-root"',
              'parser.add_argument("--unit-dir"',
              'parser.add_argument("--credential-path"',
              'parser.add_argument("--operation-root"',
              'parser.add_argument("--transport-root"',
              'parser.add_argument("--update-root"',
              'parser.add_argument("--expected-old',
              'parser.add_argument("--expected-new',
              '"activate"',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe or stale r0008 control-update surface: {needle}")
          PY

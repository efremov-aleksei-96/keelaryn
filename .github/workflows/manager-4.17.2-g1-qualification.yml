name: One-shot Manager 4.17.2 g2 qualification

on:
  push:
    branches:
      - 'dev/manager-4.17.2'
    paths:
      - '.github/workflows/manager-4.17.2-g1-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 8b189526f8b5e5a9b631eaa173fccdd0b11e64cc
      CANDIDATE_TREE: 82104b974c95b327b9c870609a1f8887ee73793a
      CANDIDATE_TAG: provenance/candidate-manager-4.17.2-g1
      BASELINE_REF: v4.16.3
      BASELINE_SHA: 872ad3d21fb29062a7de2185353c039d5fb3b0a6
    steps:
      - name: Checkout control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact production-qualified baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $candidateSha=(git -C $candidate rev-parse HEAD).Trim()
          $candidateTree=(git -C $candidate rev-parse 'HEAD^{tree}').Trim()
          $baselineSha=(git -C $baseline rev-parse HEAD).Trim()
          if($candidateSha-cne$env:CANDIDATE_SHA){throw "Candidate SHA mismatch: $candidateSha"}
          if($candidateTree-cne$env:CANDIDATE_TREE){throw "Candidate tree mismatch: $candidateTree"}
          if($baselineSha-cne$env:BASELINE_SHA){throw "Baseline SHA mismatch: $baselineSha"}
          $install=Get-Content (Join-Path $candidate 'manager\product\install\INSTALLATION.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $manifest=Get-Content (Join-Path $candidate 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $framework=(Get-Content (Join-Path $candidate 'tests\framework\manager-gate\FRAMEWORK_REVISION.txt') -Raw -Encoding UTF8).Trim()
          if([string]$install.manager_version-cne'4.17.2'){throw 'Candidate Manager version mismatch.'}
          if([string]$manifest.manager.gate_managed_content_sha256-cne'e0a3ae9641979556fa9aa2060a6c7c5cdaa23f52c040fc24ea43122e862dd102'){throw 'Candidate managed digest mismatch.'}
          if($framework-cne'24'){throw "Framework revision mismatch: $framework"}
          Write-Host 'Frozen candidate identity: PASS'

      - name: Verify immutable candidate provenance tag
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $control=Join-Path $env:GITHUB_WORKSPACE 'control'
          $ref='refs/tags/'+$env:CANDIDATE_TAG
          $existing=@(git -C $control ls-remote --tags origin $ref)
          if($LASTEXITCODE-ne0){throw 'Failed to query candidate provenance tag.'}
          if($existing.Count-ne1){throw ('Expected exactly one immutable candidate tag row; actual='+$existing.Count)}
          $actual=([string]$existing[0]).Split("`t")[0]
          if($actual-cne$env:CANDIDATE_SHA){throw "Candidate tag collision: $actual"}
          Write-Host 'Candidate provenance tag points to exact frozen SHA.'

      - name: Build and run ordinary SourceGate g2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $root=Join-Path $env:RUNNER_TEMP ('keelaryn-manager-4.17.2-g2-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $gateZip=Join-Path $root 'manager-4.17.2.zip'
          $builder=Join-Path $candidate 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $builder -SourceRoot (Join-Path $candidate 'manager') -BaselineVersion 4.16.3 -GateRevision 2 -OutputPath $gateZip -Force
          if($LASTEXITCODE-ne0){throw "Gate build failed: exit=$LASTEXITCODE"}

          # SourceGate intentionally requires the canonical keelaryn\tests\work\manager-<version> layout.
          $keelarynRoot=Join-Path $root 'keelaryn'
          $work=Join-Path $keelarynRoot 'tests\work'
          New-Item -ItemType Directory -Force -Path $work|Out-Null
          Expand-Archive -LiteralPath $gateZip -DestinationPath $work -Force
          $gateRoot=Join-Path $work 'manager-4.17.2'
          $expectedGateRoot=Join-Path $keelarynRoot 'tests\work\manager-4.17.2'
          if([IO.Path]::GetFullPath($gateRoot)-cne[IO.Path]::GetFullPath($expectedGateRoot)){throw 'Qualification harness failed to construct canonical gate path.'}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $gateRoot 'gate\Run-KeelarynManagerSourceGate.ps1') -ManagerRoot $gateRoot
          if($LASTEXITCODE-ne0){throw "SourceGate g2 failed: exit=$LASTEXITCODE"}
          "ORDINARY_GATE_ROOT=$root" >> $env:GITHUB_ENV
          "ORDINARY_GATE_WORK=$work" >> $env:GITHUB_ENV
          "ORDINARY_GATE_ZIP=$gateZip" >> $env:GITHUB_ENV
          Write-Host 'ORDINARY SOURCE GATE g2: PASS'

      - name: Run exact-candidate disposable Full Gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $workspace=Join-Path $env:RUNNER_TEMP ('keelaryn-manager-4.17.2-disposable-'+$env:GITHUB_RUN_ID)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-DisposableManagerFullGate.ps1') -CandidateManagerRoot (Join-Path $candidate 'manager') -BaselineManagerRoot (Join-Path $baseline 'manager') -FrameworkRoot (Join-Path $candidate 'tests\framework\manager-gate') -WorkspaceRoot $workspace -CandidateRef $env:CANDIDATE_SHA -BaselineRef $env:BASELINE_SHA -GateRevision 9002
          if($LASTEXITCODE-ne0){throw "Disposable Full Gate failed: exit=$LASTEXITCODE"}
          "DISPOSABLE_GATE_ROOT=$workspace" >> $env:GITHUB_ENV
          Write-Host 'DISPOSABLE FULL GATE g9002: PASS'

      - name: Upload compact qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.2-g2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ORDINARY_GATE_ZIP }}
            ${{ env.ORDINARY_GATE_WORK }}\manager-4.17.2\gate\results\**
            ${{ env.DISPOSABLE_GATE_ROOT }}\evidence\**
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-shot workflow after successful qualification
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $control=Join-Path $env:GITHUB_WORKSPACE 'control'
          $workflow='.github/workflows/manager-4.17.2-g1-qualification.yml'
          git -C $control pull --ff-only origin dev/manager-4.17.2
          if($LASTEXITCODE-ne0){throw 'Failed to synchronize control checkout before cleanup.'}
          git -C $control rm -- $workflow
          if($LASTEXITCODE-ne0){throw 'Failed to stage one-shot workflow removal.'}
          git -C $control config user.name 'keelaryn-qualification-bot'
          git -C $control config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $control commit -m 'Qualification: remove one-shot Manager 4.17.2 g2 workflow'
          if($LASTEXITCODE-ne0){throw 'Failed to commit one-shot workflow removal.'}
          git -C $control push origin 'HEAD:refs/heads/dev/manager-4.17.2'
          if($LASTEXITCODE-ne0){throw 'Failed to push one-shot workflow removal.'}

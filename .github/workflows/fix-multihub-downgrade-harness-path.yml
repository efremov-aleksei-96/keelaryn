name: Fix multi-Hub downgrade harness compatibility

on:
  push:
    branches:
      - 'maintenance/fix-multihub-downgrade-harness-path'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Support legacy Doctor report identity proof
        shell: powershell
        run: |
          $path=Join-Path $env:GITHUB_WORKSPACE 'tests\manager\Invoke-MultiHubDowngradeCompatibility.ps1'
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $old='    if(([string]$report.instance_id).ToLowerInvariant()-ne$ExpectedId){Fail(''Doctor resolved the wrong active instance under Manager ''+[string]$report.manager_version+''.'')}'
          $new=@'
    if($null-ne$report.PSObject.Properties['instance_id']){
        if(([string]$report.instance_id).ToLowerInvariant()-ne$ExpectedId){Fail('Doctor resolved the wrong active instance under Manager '+[string]$report.manager_version+'.')}
    }else{
        # 4.16.3 predates the report-level instance_id field. Its resolved identity is
        # still proven by the same binding document that Doctor reports as binding.resolve.
        $legacyBinding=Read-Json (Join-Path $ManagerRoot 'state\binding.json')
        if(([string]$legacyBinding.instance_id).ToLowerInvariant()-ne$ExpectedId){Fail('Legacy Doctor binding resolved the wrong active instance.')}
    }
'@
          $new=$new.TrimEnd("`r","`n")
          $matches=([regex]::Matches($text,[regex]::Escape($old))).Count
          if($matches -eq 0 -and $text.Contains('4.16.3 predates the report-level instance_id field')){Write-Host 'Legacy Doctor harness compatibility already corrected.';exit 0}
          if($matches -ne 1){throw "Unexpected legacy Doctor assertion marker count: $matches"}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw (@($errors).Message -join '; ')}
          git diff --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $changed=@(git status --porcelain)
          if($changed.Count-ne1-or(-not([string]$changed[0]).Contains('tests/manager/Invoke-MultiHubDowngradeCompatibility.ps1'))){throw('Unexpected changed files: '+($changed-join' | '))}
          git config user.name 'Aleksei Efremov'
          git config user.email 'efremov.aleksei.96@gmail.com'
          git add -- tests/manager/Invoke-MultiHubDowngradeCompatibility.ps1
          git commit -m 'tests: support legacy Doctor report schema'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git push origin HEAD:maintenance/fix-multihub-downgrade-harness-path
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

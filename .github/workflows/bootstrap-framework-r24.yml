name: Clean Framework r24 self-test bytes

on:
  push:
    branches:
      - 'dev/framework-r24'

permissions:
  contents: write

jobs:
  clean-selftest:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/framework-r24
          fetch-depth: 0
          persist-credentials: true

      - name: Restore r23 self-test bytes and apply only r24 semantic edits
        shell: bash
        run: |
          set -euo pipefail
          git show bbeafa3251558289444b0e707fc2433fa132238d:tests/framework/manager-gate/Test-ManagerGateFramework.ps1 > tests/framework/manager-gate/Test-ManagerGateFramework.ps1

      - name: Apply byte-preserving r24 self-test edits and refresh manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $path=Join-Path $root 'tests\framework\manager-gate\Test-ManagerGateFramework.ps1'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $nl=if($text.Contains("`r`n")){"`r`n"}else{"`n"}
          $text=$text.Replace("if(`$revision-cne'23')","if(`$revision-cne'24')")
          $text=$text.Replace('expected revision 23','expected revision 24')
          $text=$text.Replace('Framework r23','Framework r24')
          $text=$text.Replace('keelaryn_framework_r23','keelaryn_framework_r24')
          $needle="    if(@(`$errors).Count-ne0){throw('FullGate template parser failure before Doctor-contract extraction: '+([string]::Join(' | ',@(`$errors|ForEach-Object{`$_.Message}))))}"+$nl
          if(-not$text.Contains($needle)){throw 'Could not locate Doctor self-test insertion point.'}
          $insertLines=@(
            '    $fullGateText=[System.IO.File]::ReadAllText($fullGateTemplate,[System.Text.Encoding]::UTF8)',
            '    if(-not$fullGateText.Contains(''$baselineDoctor=Run-DoctorForGate $mgr $true'')){throw ''Framework r24 Full Gate baseline Doctor is not routed through Run-DoctorForGate.''}',
            '    if(-not$fullGateText.Contains(''$baselineReport=$baselineDoctor.Report'')){throw ''Framework r24 Full Gate baseline report is not bound to the validated Doctor result.''}',
            '    if($fullGateText.Contains(''$null=Run-Manager $mgr @(''''-Doctor'''') $true'')){throw ''Framework r24 Full Gate still contains the unsafe generic baseline Doctor call-site.''}'
          )
          $insert=[string]::Join($nl,$insertLines)+$nl
          $text=$text.Replace($needle,$needle+$insert)
          [IO.File]::WriteAllText($path,$text,$utf8)

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $changed=@(& git diff --name-only)
          $expected=@('PUBLIC_FILE_MANIFEST.json','tests/framework/manager-gate/Test-ManagerGateFramework.ps1')
          foreach($p in $expected){if($changed-notcontains$p){throw('Expected cleanup change missing: '+$p)}}
          if($changed.Count-ne$expected.Count){throw('Unexpected cleanup changes: '+([string]::Join(', ',$changed)))}

          git config user.name 'Aleksei Efremov'
          git config user.email 'efremov.aleksei.96@gmail.com'
          git add -- PUBLIC_FILE_MANIFEST.json tests/framework/manager-gate/Test-ManagerGateFramework.ps1
          git commit -m 'Gate Framework r24: preserve self-test source bytes'
          git push origin HEAD:dev/framework-r24

name: Repository governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-governance:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository governance
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-RepositoryGovernance.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -Repository "$env:GITHUB_REPOSITORY" -Online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify GitHub Actions supply-chain policy
        if: always()
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-GitHubActionsPolicy.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

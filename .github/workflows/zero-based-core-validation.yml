name: Zero-based Core validation

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'core/**'
      - 'deploy/**'
      - 'tests/core/**'
      - 'tests/live/**'
      - 'spec/**'
      - '.github/workflows/zero-based-core-validation.yml'
      - '.github/workflows/zero-based-migration-windows.yml'
      - '.github/workflows/development-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - 'deploy/**'
      - 'tests/core/**'
      - 'tests/live/**'
      - 'spec/**'
      - '.github/workflows/zero-based-core-validation.yml'
      - '.github/workflows/zero-based-migration-windows.yml'
      - '.github/workflows/development-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-based-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Compile Core and live acceptance tooling
        run: python3 -m compileall -q core tests/core tests/live

      - name: Run deterministic Core tests
        run: python3 -m unittest discover -s tests/core -p 'test_*.py' -v

      - name: Smoke local CLI bootstrap and status
        run: |
          tmp="$(mktemp -d)"
          PYTHONPATH=core python3 -m keelaryn_core.cli --hub "$tmp/hub" bootstrap
          PYTHONPATH=core python3 -m keelaryn_core.cli --hub "$tmp/hub" status

      - name: Smoke Drive poller CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.drive_poller --help

      - name: Smoke Workspace CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.workspace_cli --help

      - name: Smoke Pilot CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.pilot_cli --help

      - name: Smoke VPS release-switch CLI surface
        run: python3 deploy/zero-based-vps/release_switch.py --help

      - name: Prove exact-head deterministic VPS payload
        env:
          KEELARYN_VPS_EVIDENCE: ${{ runner.temp }}/ZERO_BASED_VPS_PAYLOAD_EVIDENCE.json
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 deploy/zero-based-vps/build_payload.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" \
            --output "$tmp/first.tar.gz" > "$tmp/first.json"
          python3 deploy/zero-based-vps/build_payload.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" \
            --output "$tmp/second.tar.gz" > "$tmp/second.json"
          cmp "$tmp/first.tar.gz" "$tmp/second.tar.gz"
          payload_sha="$(python3 - "$tmp/first.json" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['payload_sha256'])
          PY
          )"
          python3 deploy/zero-based-vps/materialize_payload.py \
            --payload "$tmp/first.tar.gz" \
            --releases-root "$tmp/releases" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-payload-sha256 "$payload_sha" > "$tmp/materialized.json"
          release="$tmp/releases/$GITHUB_SHA"
          test -d "$release"
          (
            cd "$release"
            PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.py')):
              compile(path.read_bytes(), str(path), 'exec')
          PY
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=core python3 -B -m keelaryn_core.drive_poller --help >/dev/null
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=core python3 -B -m keelaryn_core.workspace_cli --help >/dev/null
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=core python3 -B -m keelaryn_core.pilot_cli --help >/dev/null
            PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/zero-based-vps/release_switch.py --help >/dev/null
          )
          if find "$release" \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Materialized release was mutated by validation bytecode output." >&2
            exit 1
          fi
          python3 - "$tmp/first.json" "$tmp/second.json" "$tmp/materialized.json" "$KEELARYN_VPS_EVIDENCE" <<'PY'
          import json
          import os
          import sys

          first = json.load(open(sys.argv[1], encoding="utf-8"))
          second = json.load(open(sys.argv[2], encoding="utf-8"))
          materialized = json.load(open(sys.argv[3], encoding="utf-8"))
          keys = ("schema", "source_commit", "file_count", "payload_sha256", "payload_size")
          if any(first[key] != second[key] for key in keys):
              raise SystemExit("deterministic payload metadata mismatch")
          if any(first[key] != materialized[key] for key in keys):
              raise SystemExit("materialized payload identity mismatch")
          evidence = {key: first[key] for key in keys}
          evidence.update(
              {
                  "deterministic_rebuild": True,
                  "materialization_verified": True,
                  "release_validation_wrote_no_bytecode": True,
                  "drive_poller_cli_verified": True,
                  "workspace_cli_verified": True,
                  "pilot_cli_verified": True,
                  "release_switch_cli_verified": True,
                  "github_run_id": os.environ["GITHUB_RUN_ID"],
                  "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
          )
          with open(sys.argv[4], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(evidence, stream, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY

      - name: Upload compact VPS payload evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-based-vps-payload-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZERO_BASED_VPS_PAYLOAD_EVIDENCE.json
          if-no-files-found: error
          retention-days: 3

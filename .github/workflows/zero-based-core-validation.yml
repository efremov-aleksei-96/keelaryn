name: Zero-based Core validation

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'core/**'
      - 'deploy/**'
      - 'tests/core/**'
      - 'tests/live/**'
      - 'spec/**'
      - '.github/workflows/zero-based-core-validation.yml'
      - '.github/workflows/zero-based-migration-windows.yml'
      - '.github/workflows/development-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - 'deploy/**'
      - 'tests/core/**'
      - 'tests/live/**'
      - 'spec/**'
      - '.github/workflows/zero-based-core-validation.yml'
      - '.github/workflows/zero-based-migration-windows.yml'
      - '.github/workflows/development-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-based-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Compile Core and live acceptance tooling
        run: python3 -m compileall -q core tests/core tests/live

      - name: Run deterministic Core tests
        run: python3 -m unittest discover -s tests/core -p 'test_*.py' -v

      - name: Prove cross-user operation relay DAC
        run: |
          set -euo pipefail

          group_name='keelaryn-ci'
          transport_user='keelaryn-xport'

          if getent group "$group_name" >/dev/null; then
            echo "Disposable shared group unexpectedly exists." >&2
            exit 1
          fi
          if getent passwd "$transport_user" >/dev/null; then
            echo "Disposable transport user unexpectedly exists." >&2
            exit 1
          fi

          sudo groupadd --system "$group_name"
          sudo useradd             --system             --no-create-home             --gid "$group_name"             --shell /usr/sbin/nologin             "$transport_user"

          transport_uid="$(id -u "$transport_user")"
          shared_gid="$(getent group "$group_name" | cut -d: -f3)"
          test "$transport_uid" -ne 0
          test -n "$shared_gid"

          tmp="$(sudo mktemp -d /tmp/keelaryn-operation-relay.XXXXXX)"
          trap 'sudo rm -rf "$tmp"' EXIT
          sudo chmod 0755 "$tmp"

          stage="$tmp/stage"
          sudo install -d -m 0755 "$stage"
          sudo cp -a "$GITHUB_WORKSPACE/core" "$stage/core"
          sudo cp             "$GITHUB_WORKSPACE/tests/live/operation_relay_cross_user.py"             "$stage/operation_relay_cross_user.py"

          sudo find "$stage/core" -type d -exec chmod 0755 {} +
          sudo find "$stage/core" -type f -exec chmod 0644 {} +
          sudo chmod 0644 "$stage/operation_relay_cross_user.py"

          sudo diff -qr "$GITHUB_WORKSPACE/core" "$stage/core"
          sudo cmp             "$GITHUB_WORKSPACE/tests/live/operation_relay_cross_user.py"             "$stage/operation_relay_cross_user.py"

          script="$stage/operation_relay_cross_user.py"
          staged_pythonpath="$stage/core"

          sudo install -d -m 0750 -o "$transport_user" -g "$group_name" "$tmp/transport"
          test "$(stat -c '%u' "$tmp/transport")" = "$transport_uid"
          test "$(stat -c '%g' "$tmp/transport")" = "$shared_gid"
          test "$(stat -c '%a' "$tmp/transport")" = "750"

          sudo -u "$transport_user"             env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath"             /usr/bin/python3 -B "$script"             transport-deliver             --root "$tmp/transport"             --source-commit "$GITHUB_SHA"

          sudo install -d -m 0700 -o root -g root             "$tmp/operations"             "$tmp/control"

          sudo setpriv             --reuid=0             --regid="$shared_gid"             --clear-groups             --bounding-set=-all             --inh-caps=-all             --ambient-caps=-all             --no-new-privs             env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath"             /usr/bin/python3 -B "$script"             agent-process             --transport-root "$tmp/transport"             --operation-root "$tmp/operations"             --control-root "$tmp/control"             --source-commit "$GITHUB_SHA"             --expected-gid "$shared_gid"

          sudo -u "$transport_user"             env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath"             /usr/bin/python3 -B "$script"             transport-publish             --root "$tmp/transport"             --source-commit "$GITHUB_SHA"

      - name: Smoke local CLI bootstrap and status
        run: |
          tmp="$(mktemp -d)"
          PYTHONPATH=core python3 -m keelaryn_core.cli --hub "$tmp/hub" bootstrap
          PYTHONPATH=core python3 -m keelaryn_core.cli --hub "$tmp/hub" status

      - name: Smoke Drive poller CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.drive_poller --help

      - name: Smoke Workspace CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.workspace_cli --help

      - name: Smoke Pilot CLI surface
        run: PYTHONPATH=core python3 -m keelaryn_core.pilot_cli --help

      - name: Smoke VPS release-switch CLI surface
        run: python3 deploy/zero-based-vps/release_switch.py --help

      - name: Smoke VPS Hub-cutover CLI surface
        run: python3 deploy/zero-based-vps/hub_cutover.py --help

      - name: Smoke durable Operation Runtime CLI surface
        run: PYTHONPATH=core python3 -B -m keelaryn_core.operation_cli --help

      - name: Smoke allowlisted Operation Agent CLI surface
        run: PYTHONPATH=core python3 -B -m keelaryn_core.operation_agent --help

      - name: Smoke GitHub operation transport CLI surface
        run: PYTHONPATH=core python3 -B -m keelaryn_core.operation_transport --help

      - name: Smoke operation control-plane bootstrap CLI surface
        run: python3 -B deploy/zero-based-vps/operation_control_plane_bootstrap.py --help

      - name: Smoke operation control-plane recovery CLI surface
        run: python3 -B deploy/zero-based-vps/operation_control_plane_recovery.py --help

      - name: Run disposable Hub-selector cutover rehearsal
        env:
          KEELARYN_HUB_CUTOVER_EVIDENCE: ${{ runner.temp }}/ZERO_BASED_HUB_CUTOVER_REHEARSAL_EVIDENCE.json
        run: |
          set -euo pipefail
          python3 -B deploy/zero-based-vps/hub_cutover_rehearsal.py \
            --source-commit "$GITHUB_SHA" \
            --output "$KEELARYN_HUB_CUTOVER_EVIDENCE"
          python3 - "$KEELARYN_HUB_CUTOVER_EVIDENCE" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "schema": "keelaryn.zero-vps-hub-cutover-rehearsal.v1",
              "source_commit": sys.argv[2],
              "accept_path_verified": True,
              "rollback_path_verified": True,
              "restart_recovery_verified": True,
              "terminal_history_verified": True,
              "selector_bytes_verified": True,
              "hub_bytes_touched": False,
          }
          if evidence != expected:
              raise SystemExit("Hub cutover rehearsal evidence mismatch")
          PY

      - name: Upload compact Hub-cutover rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-based-hub-cutover-rehearsal-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZERO_BASED_HUB_CUTOVER_REHEARSAL_EVIDENCE.json
          if-no-files-found: error
          retention-days: 3

      - name: Prove exact-head deterministic VPS payload
        env:
          KEELARYN_VPS_EVIDENCE: ${{ runner.temp }}/ZERO_BASED_VPS_PAYLOAD_EVIDENCE.json
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 deploy/zero-based-vps/build_payload.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" \
            --output "$tmp/first.tar.gz" > "$tmp/first.json"
          python3 deploy/zero-based-vps/build_payload.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" \
            --output "$tmp/second.tar.gz" > "$tmp/second.json"
          cmp "$tmp/first.tar.gz" "$tmp/second.tar.gz"
          payload_sha="$(python3 - "$tmp/first.json" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['payload_sha256'])
          PY
          )"
          install_root="$tmp/install"
          python3 deploy/zero-based-vps/materialize_payload.py \
            --payload "$tmp/first.tar.gz" \
            --releases-root "$install_root/releases" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-payload-sha256 "$payload_sha" > "$tmp/materialized.json"
          release="$install_root/releases/$GITHUB_SHA"
          test -d "$release"
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            "$release/deploy/zero-based-vps/target_host_validate.py" \
            --release "$release" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-payload-sha256 "$payload_sha" \
            > "$tmp/target-host-release.json"

          ln -s "releases/$GITHUB_SHA" "$install_root/current"
          state_root="$tmp/deployment"
          install -d -m 0700 "$state_root" "$state_root/terminal" "$state_root/history"
          install -m 0600 /dev/null "$state_root/LOCK"
          mutation_gate_root="$tmp/mutation-gate"
          install -d -m 2750 "$mutation_gate_root"
          install -m 0640 /dev/null "$mutation_gate_root/LOCK"
          selector_parent="$tmp/etc-keelaryn"
          install -d -m 0700 "$selector_parent"
          selector="$selector_parent/hub.env"
          printf 'KEELARYN_HUB_ROOT_ID=DISPOSABLE_TARGET_HOST_HUB_0001\n' > "$selector"
          chmod 0600 "$selector"
          unit_dir="$tmp/systemd"
          install -d -m 0755 "$unit_dir"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-drive.service" "$unit_dir/keelaryn-drive.service"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-drive-bootstrap.service" "$unit_dir/keelaryn-drive-bootstrap.service"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-operation-agent.service" "$unit_dir/keelaryn-operation-agent.service"
          install -m 0644 "$release/deploy/zero-based-vps/keelaryn-operation-transport.service" "$unit_dir/keelaryn-operation-transport.service"
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            "$release/deploy/zero-based-vps/target_host_validate.py" \
            --release "$release" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-payload-sha256 "$payload_sha" \
            --selector-path "$selector" \
            --installed-unit-dir "$unit_dir" \
            --install-root "$install_root" \
            --deployment-state-root "$state_root" \
            --mutation-gate-root "$mutation_gate_root" \
            > "$tmp/target-host-config.json"
          if find "$release" \( -type d -name '__pycache__' -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Materialized release was mutated by validation bytecode output." >&2
            exit 1
          fi
          python3 - "$tmp/first.json" "$tmp/second.json" "$tmp/materialized.json" "$tmp/target-host-release.json" "$tmp/target-host-config.json" "$KEELARYN_VPS_EVIDENCE" <<'PY'
          import json
          import os
          import sys

          first = json.load(open(sys.argv[1], encoding="utf-8"))
          second = json.load(open(sys.argv[2], encoding="utf-8"))
          materialized = json.load(open(sys.argv[3], encoding="utf-8"))
          target = json.load(open(sys.argv[4], encoding="utf-8"))
          host = json.load(open(sys.argv[5], encoding="utf-8"))
          keys = ("schema", "source_commit", "file_count", "payload_sha256", "payload_size")
          if any(first[key] != second[key] for key in keys):
              raise SystemExit("deterministic payload metadata mismatch")
          if any(first[key] != materialized[key] for key in keys):
              raise SystemExit("materialized payload identity mismatch")
          expected_cli = [
              "drive_poller",
              "workspace_cli",
              "pilot_cli",
              "release_switch",
              "hub_cutover",
              "hub_cutover_rehearsal",
              "deployment_state_normalize",
              "operation_runtime",
              "operation_agent",
              "operation_transport",
              "operation_control_bootstrap",
              "operation_control_recovery",
          ]
          if target.get("schema") != "keelaryn.zero-vps-target-host-validation.v3":
              raise SystemExit("target-host validation schema mismatch")
          if target.get("source_commit") != first["source_commit"]:
              raise SystemExit("target-host validation source mismatch")
          if target.get("payload_sha256") != first["payload_sha256"]:
              raise SystemExit("target-host validation payload mismatch")
          if target.get("cli_surfaces_verified") != expected_cli:
              raise SystemExit("target-host CLI surface mismatch")
          if target.get("development_test_suite_executed") is not False:
              raise SystemExit("target-host validation must not execute the development test suite")
          if target.get("release_remained_exact") is not True:
              raise SystemExit("target-host validation did not preserve exact release identity")
          if target.get("host_config_verified") is not False:
              raise SystemExit("release-only target-host proof unexpectedly claimed host config validation")
          for key in ("selector_verified", "installed_units_verified", "active_release_verified", "deployment_state_verified", "deployment_state_idle", "mutation_gate_verified", "mutation_gate_idle"):
              if target.get(key) is not False:
                  raise SystemExit(f"release-only target-host proof unexpectedly claimed {key}")
          if host.get("schema") != "keelaryn.zero-vps-target-host-validation.v3":
              raise SystemExit("host-config target-host validation schema mismatch")
          if host.get("source_commit") != first["source_commit"] or host.get("payload_sha256") != first["payload_sha256"]:
              raise SystemExit("host-config target-host validation identity mismatch")
          for key in ("host_config_verified", "selector_verified", "installed_units_verified", "active_release_verified", "deployment_state_verified", "deployment_state_idle", "mutation_gate_verified", "mutation_gate_idle", "release_remained_exact"):
              if host.get(key) is not True:
                  raise SystemExit(f"host-config target-host proof did not establish {key}")
          evidence = {key: first[key] for key in keys}
          evidence.update(
              {
                  "deterministic_rebuild": True,
                  "materialization_verified": True,
                  "release_validation_wrote_no_bytecode": True,
                  "drive_poller_cli_verified": True,
                  "workspace_cli_verified": True,
                  "pilot_cli_verified": True,
                  "release_switch_cli_verified": True,
                  "hub_cutover_cli_verified": True,
                  "hub_cutover_rehearsal_cli_verified": True,
                  "deployment_state_normalizer_cli_verified": True,
                  "operation_runtime_cli_verified": True,
                  "operation_agent_cli_verified": True,
                  "operation_transport_cli_verified": True,
                  "operation_control_bootstrap_cli_verified": True,
                  "operation_control_recovery_cli_verified": True,
                  "target_host_validator_verified": True,
                  "target_host_config_validator_verified": True,
                  "mutation_gate_validator_verified": True,
                  "development_test_suite_executed": target["development_test_suite_executed"],
                  "github_run_id": os.environ["GITHUB_RUN_ID"],
                  "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              }
          )
          with open(sys.argv[6], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(evidence, stream, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY

      - name: Upload compact VPS payload evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-based-vps-payload-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZERO_BASED_VPS_PAYLOAD_EVIDENCE.json
          if-no-files-found: error
          retention-days: 3

name: Operation control r0009 boundary capture gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0009_boundary_capture.py'
      - 'tools/operation_control_r0009_vps.py'
      - 'tools/operation_control_r0009_stage_authority.py'
      - 'tests/core/test_operation_control_r0009_boundary_capture.py'
      - '.github/workflows/operation-control-r0009-boundary-capture-gate-r0001.yml'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact issued r0009 authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("docs/authorizations/operation-control-r0009-stage")
          path = root / "92aea51ee7f80a8e8b84fffa9315bf9e.json"
          files = sorted(root.glob("*.json"))
          if files != [path]:
              raise SystemExit(f"unexpected r0009 authority set: {files}")
          raw = path.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          canonical = (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if raw != canonical:
              raise SystemExit("r0009 authority is not canonical")
          if hashlib.sha256(raw).hexdigest() != "56c16168d4ad473757342251c2791fd148ef578630136f7626226425257b4919":
              raise SystemExit("r0009 authority SHA mismatch")
          exact = {
              "transaction_id": "92aea51ee7f80a8e8b84fffa9315bf9e",
              "scope": "R0009_RELEASE_STAGE_ONLY",
              "candidate": "operation-control-r0009-20260924-01",
              "source_commit": "e42a4f156abb048f5c8f0bd1884fcae51674a55f",
              "payload_sha256": "8592a314b084a2a1ccc1608168b3c0776cccb1277ffc049f42f3efd5291d4876",
              "production_stage_authorized": True,
              "activation_authorized": False,
              "drive_content_mutation_authorized": False,
              "legacy_hub_mutation_authorized": False,
              "writer_mutation_authorized": False,
              "credential_mutation_authorized": False,
          }
          for key, expected in exact.items():
              if value.get(key) != expected:
                  raise SystemExit(f"r0009 authority mismatch: {key}")
          if value.get("issuer_checkpoint") != "86aa3a92f860d9ab96ad54c6d75f9adbcf723026":
              raise SystemExit("r0009 authority issuer checkpoint mismatch")
          if value.get("boundary_evidence_git_blob") != "0d29ddb050143b953157e961e40d6c63d75df916":
              raise SystemExit("r0009 authority boundary blob mismatch")
          if value.get("boundary_evidence_sha256") != "d6ea834ff31d9a5269cee573009c256f6871e437ba5635c8d047602d8b1f0117":
              raise SystemExit("r0009 authority boundary SHA mismatch")
          PY
          test -e docs/authorizations/operation-control-r0008-stage
          test -e docs/authorizations/operation-control-r0007-stage

      - name: Compile without residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0009_boundary_capture.py",
              "tests/core/test_operation_control_r0009_boundary_capture.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          PY
          test -z "$(git status --porcelain)"

      - name: Run boundary capture regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s tests/core -p 'test_operation_control_r0009_boundary_capture.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove narrow read-only surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0009_boundary_capture.py").read_text(encoding="utf-8")
          for needle in (
              'choices=("capture",)',
              'vps.reconcile()',
              'authority.validate_boundary_evidence(value)',
              '"production_mutations_performed": False',
              '"drive_mutations_performed": False',
          ):
              if needle not in raw:
                  raise SystemExit(f"missing boundary contract: {needle}")
          for needle in (
              "stage_once(",
              "materialize_payload(",
              "update_d0_control_plane(",
              "os.mkdir(",
              "write_text(",
              "write_bytes(",
          ):
              if needle in raw:
                  raise SystemExit(f"boundary capture write surface: {needle}")
          PY

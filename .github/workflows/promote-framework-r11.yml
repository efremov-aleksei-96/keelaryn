name: Promote Framework r11 once

on:
  push:
    branches: [framework-r11]
    paths:
      - '.github/promote-framework-r11.py'
      - '.github/workflows/promote-framework-r11.yml'

permissions:
  contents: write

concurrency:
  group: keelaryn-framework-r11-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: framework-r11
          fetch-depth: 0
          persist-credentials: true

      - name: Build exact Framework r11 repository tree
        shell: powershell
        run: |
          python "$env:GITHUB_WORKSPACE\.github\promote-framework-r11.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify promoted public repository
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit promoted tree and remove promotion mechanism
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Promote independently qualified Gate Framework r11'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:framework-r11
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

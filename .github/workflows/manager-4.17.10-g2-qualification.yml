name: Manager 4.17.10 g2 qualification

on:
  push:
    branches:
      - 'maintenance/qualify-manager-4.17.10-g2'
    paths:
      - '.github/workflows/manager-4.17.10-g2-qualification.yml'

permissions:
  contents: read

concurrency:
  group: manager-4.17.10-g2-hosted-qualification
  cancel-in-progress: false

jobs:
  hosted-g2:
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - name: Checkout exact frozen g2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 739e612ff77b218da2eedbbbd7d9dec87fcf21ad
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact production 4.17.9 provenance baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 88d01c78520a365bd504aca3e5c879320fb5da29
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen identities, manifests and Framework r24
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $candidateSha=(git -C $candidate rev-parse HEAD).Trim()
          $candidateTree=(git -C $candidate rev-parse 'HEAD^{tree}').Trim()
          $candidateParent=(git -C $candidate rev-parse 'HEAD^').Trim()
          $baselineSha=(git -C $baseline rev-parse HEAD).Trim()
          if($candidateSha-cne'739e612ff77b218da2eedbbbd7d9dec87fcf21ad'){throw('Candidate SHA mismatch: '+$candidateSha)}
          if($candidateTree-cne'a4635823662b6d5caf2e81a0f129ef5827b70766'){throw('Candidate tree mismatch: '+$candidateTree)}
          if($candidateParent-cne'5736a7773627820307bd5232049e210251ba7410'){throw('Candidate parent mismatch: '+$candidateParent)}
          if($baselineSha-cne'88d01c78520a365bd504aca3e5c879320fb5da29'){throw('Baseline SHA mismatch: '+$baselineSha)}
          $freezeDiff=@(git -C $candidate diff --name-only HEAD^ HEAD)
          if($freezeDiff.Count-ne0){throw('Frozen g2 commit is not tree-identical to validated development parent: '+([string]::Join(', ',@($freezeDiff))))}

          foreach($root in @($candidate,$baseline)){
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Check
            if($LASTEXITCODE-ne0){throw('PUBLIC_FILE_MANIFEST reproducibility failed for '+$root)}
          }

          $cm=Get-Content (Join-Path $candidate 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $bm=Get-Content (Join-Path $baseline 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $ci=Get-Content (Join-Path $candidate 'manager\product\install\INSTALLATION.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $bi=Get-Content (Join-Path $baseline 'manager\product\install\INSTALLATION.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$ci.manager_version-cne'4.17.10'){throw 'Candidate version mismatch.'}
          if([string]$bi.manager_version-cne'4.17.9'){throw 'Baseline version mismatch.'}
          if([string]$cm.manager.version-cne'4.17.10'){throw 'Candidate public manifest version mismatch.'}
          if([string]$bm.manager.version-cne'4.17.9'){throw 'Baseline public manifest version mismatch.'}
          if([string]$cm.manager.installation_sha256-cne'3d4e1102b6852e1c1502d265e913bbe8c640ce7e881b4051a9b4e5cc6e7fab25'){throw 'Candidate installation identity mismatch.'}
          if([string]$cm.manager.gate_managed_content_sha256-cne'2df8ff820d1f4c31fe8c8b537ff81ec4a3e67516325ca73f4470c561c9497cfa'){throw 'Candidate managed digest mismatch.'}
          if([string]$bm.manager.installation_sha256-cne'6072f033cca7f51b56c58ed8332410972246744c80f6c4c7d47a340e7709d357'){throw 'Baseline installation identity mismatch.'}
          if([string]$bm.manager.gate_managed_content_sha256-cne'cbffc5af41738afcbff038d1a2ca4f68e2495957f4ebe75afacc215a79190e56'){throw 'Baseline managed digest mismatch.'}
          if([int]$cm.gate_framework.revision-ne24-or[int]$bm.gate_framework.revision-ne24){throw 'Framework revision mismatch.'}
          $cRows=@($cm.gate_framework.files|ForEach-Object{([string]$_.path)+':'+([string]$_.sha256)}|Sort-Object)
          $bRows=@($bm.gate_framework.files|ForEach-Object{([string]$_.path)+':'+([string]$_.sha256)}|Sort-Object)
          if([string]::Join('|',$cRows)-cne[string]::Join('|',$bRows)){throw 'Candidate/baseline Framework bytes differ.'}

          $state=Get-Content (Join-Path $candidate 'MANAGER_DEVELOPMENT_STATE.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($state.open_release_blockers).Count-ne0){throw 'Frozen candidate source records open release blockers.'}
          if([string]$state.qualification.risk_defect_gate.status-cne'required_pass_before_freeze'){throw 'Frozen candidate does not require strict pre-freeze Risk/Defect Gate PASS.'}
          if([string]$state.qualification.candidate_4_17_10_g1.status-cne'frozen_rejected_prequalification_stale_public_manifest'){throw 'Rejected g1 provenance is not preserved in candidate state.'}
          if([string]$state.qualification.public_manifest_repair.installation_sha256-cne'3d4e1102b6852e1c1502d265e913bbe8c640ce7e881b4051a9b4e5cc6e7fab25'){throw 'Manifest repair installation identity mismatch in state.'}
          if([string]$state.qualification.public_manifest_repair.managed_digest-cne'2df8ff820d1f4c31fe8c8b537ff81ec4a3e67516325ca73f4470c561c9497cfa'){throw 'Manifest repair managed identity mismatch in state.'}
          if([string]$state.next_exact_goal.id-cne'MANAGER-41710-G2-FREEZE-001'){throw 'Candidate state does not identify the g2 freeze boundary.'}
          Write-Host 'FROZEN g2 IDENTITY / VALIDATED PARENT / MANIFESTS / BASELINE / FRAMEWORK: PASS' -ForegroundColor Green

      - name: Verify public repository boundary and Actions policy
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Verify-PublicRepository.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Verify-GitHubActionsPolicy.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Re-run permanent pre-freeze regressions on exact g2 candidate
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-ManagerRiskContextRegression.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-Manager41710ReviewRegression.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Build exact ordinary g2 Manager gate
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $out=Join-Path $env:RUNNER_TEMP 'manager-4.17.10.zip'
          $builder=Join-Path $candidate 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $builder -SourceRoot (Join-Path $candidate 'manager') -BaselineVersion '4.17.9' -GateRevision 2 -OutputPath $out -Force
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "G2_GATE=$out" >> $env:GITHUB_ENV
          "G2_GATE_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host ('Ordinary g2 gate SHA-256: '+$sha)

      - name: Run exact ordinary SourceGate g2
        shell: powershell
        run: |
          $keelaryn=Join-Path $env:RUNNER_TEMP 'keelaryn'
          $work=Join-Path $keelaryn 'tests\work'
          New-Item -ItemType Directory -Force -Path $work|Out-Null
          Expand-Archive -LiteralPath $env:G2_GATE -DestinationPath $work -Force
          $root=Join-Path $work 'manager-4.17.10'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gate\Run-KeelarynManagerSourceGate.ps1') -ManagerRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'ORDINARY SOURCE GATE g2: PASS' -ForegroundColor Green

      - name: Run disposable Full Gate g9002 over exact production 4.17.9 provenance source
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $workspace=Join-Path $env:RUNNER_TEMP 'manager-4.17.10-g9002'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-DisposableManagerFullGate.ps1') `
            -CandidateManagerRoot (Join-Path $candidate 'manager') `
            -BaselineManagerRoot (Join-Path $baseline 'manager') `
            -FrameworkRoot (Join-Path $candidate 'tests\framework\manager-gate') `
            -WorkspaceRoot $workspace `
            -CandidateRef '739e612ff77b218da2eedbbbd7d9dec87fcf21ad' `
            -BaselineRef '88d01c78520a365bd504aca3e5c879320fb5da29' `
            -GateRevision 9002
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          "DISPOSABLE_EVIDENCE=$workspace\evidence" >> $env:GITHUB_ENV

      - name: Write compact hosted qualification receipt
        shell: powershell
        run: |
          $receipt=[ordered]@{
            schema='keelaryn.manager-hosted-qualification.v1'
            classification='hosted_prequalification_only'
            manager_version='4.17.10'
            candidate_revision='g2'
            candidate_commit='739e612ff77b218da2eedbbbd7d9dec87fcf21ad'
            candidate_tree='a4635823662b6d5caf2e81a0f129ef5827b70766'
            validated_development_parent='5736a7773627820307bd5232049e210251ba7410'
            development_validation_run_id='34761995442'
            development_validation_job_id='103736344255'
            development_validation_artifact_id='10319391700'
            development_validation_artifact_sha256='3c4a95c4180dbaa66a8f8e794b3098a42bf77b429af2d3ad9dc67a30ab01cd64'
            rejected_g1_commit='57deae0e1bbd5ff58494358ba7a06c016018e9e0'
            rejected_g1_reason='stale PUBLIC_FILE_MANIFEST metadata'
            public_manifest_repair_run_id='34761794090'
            public_manifest_repair_commit='4a9b8c394dccfa5dae2c8d71e5ca88ba60693e22'
            public_manifest_guard_commit='8c288001e6a8fd815e6308e20620b59176d57b43'
            managed_digest='2df8ff820d1f4c31fe8c8b537ff81ec4a3e67516325ca73f4470c561c9497cfa'
            installation_sha256='3d4e1102b6852e1c1502d265e913bbe8c640ce7e881b4051a9b4e5cc6e7fab25'
            baseline_version='4.17.9'
            baseline_commit='88d01c78520a365bd504aca3e5c879320fb5da29'
            baseline_managed_digest='cbffc5af41738afcbff038d1a2ca4f68e2495957f4ebe75afacc215a79190e56'
            baseline_tested_update_sha256='e440aa1b25990d3dd9ce88f27d21f048fed02e7d8414149dfd59873de0bb566a'
            framework_revision=24
            qualification_gate_revision=2
            disposable_gate_revision=9002
            ordinary_gate_sha256=$env:G2_GATE_SHA
            public_manifest_reproducibility_pass=$true
            risk_context_lifecycle_regression_pass=$true
            manager_41710_registry_doctor_regression_pass=$true
            source_gate_pass=$true
            disposable_full_gate_pass=$true
            personal_hub_used=$false
            production_qualified=$false
            requires_real_current_backed_gate=$true
            completed_utc=[DateTime]::UtcNow.ToString('o')
          }
          $path=Join-Path $env:RUNNER_TEMP 'HOSTED_QUALIFICATION.json'
          [IO.File]::WriteAllText($path,(($receipt|ConvertTo-Json -Depth 10).Replace("`r`n","`n")+"`n"),(New-Object Text.UTF8Encoding($false)))
          "HOSTED_RECEIPT=$path" >> $env:GITHUB_ENV

      - name: Upload exact g2 gate and hosted evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.10-g2-hosted-qualification
          path: |
            ${{ env.G2_GATE }}
            ${{ env.HOSTED_RECEIPT }}
            ${{ env.DISPOSABLE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7

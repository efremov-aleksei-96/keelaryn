name: Manager 4.13 branch bootstrap canonical

on:
  push:
    branches: [manager-4.13.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-4.13-bootstrap-canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-canonical:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manager-4.13.0
          fetch-depth: 0

      - name: Apply asserted 4.13 source patch
        shell: powershell
        run: |
          python "$env:GITHUB_WORKSPACE\.github\manager-4.13-bootstrap.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PowerShell parser validation
        shell: powershell
        run: |
          $files = @(
            "$env:GITHUB_WORKSPACE\manager\product\runtime\Keelaryn__Manager.ps1",
            "$env:GITHUB_WORKSPACE\manager\product\tools\KeelarynMenu.ps1"
          )
          foreach ($file in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) {
              foreach ($e in @($errors)) { Write-Error ($file + ': ' + $e.Message) }
              exit 1
            }
          }

      - name: AI_CONTEXT generator preflight
        shell: powershell
        run: |
          $manager = "$env:GITHUB_WORKSPACE\manager"
          $out = Join-Path $env:RUNNER_TEMP ('ai_context_preflight_' + [guid]::NewGuid().ToString('N'))
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$manager\product\tools\New-KeelarynAIContext.ps1" -ManagerRoot $manager -OutputDirectory $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Manager and frontend SelfTests
        shell: powershell
        run: |
          $manager = "$env:GITHUB_WORKSPACE\manager"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$manager\product\tools\KeelarynMenu.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify public source boundary
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build r11 source gate and run Hub-blind SourceGate
        shell: powershell
        run: |
          $root=$env:GITHUB_WORKSPACE
          $gateZip=Join-Path $env:RUNNER_TEMP 'manager-4.13.0.zip'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\tests\framework\manager-gate\Build-ManagerGate.ps1" -SourceRoot "$root\manager" -BaselineVersion '4.12.0' -GateRevision 9001 -OutputPath $gateZip -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $labRoot=Join-Path $env:RUNNER_TEMP 'keelaryn'
          $work=Join-Path $labRoot 'tests\work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath $gateZip -DestinationPath $work -Force
          $candidate=Join-Path $work 'manager-4.13.0'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$candidate\gate\Run-KeelarynManagerSourceGate.ps1" -ManagerRoot $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated source and remove branch-only bootstrap
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $tempPaths = @(
            '.github\manager-4.13-bootstrap.py',
            '.github\manager-4.13-bootstrap-main.py',
            '.github\manager-4.13-fix1.py',
            '.github\Verify-PublicRepository-original.ps1',
            '.github\workflows\manager-4.13-bootstrap.yml',
            '.github\workflows\manager-4.13-bootstrap-canonical.yml'
          )
          foreach ($p in $tempPaths) { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Force } }
          git add -A
          if (-not (git status --porcelain)) { throw 'Bootstrap produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(manager): implement 4.13 ChatGPT exchange and workspace hygiene'
          git push origin HEAD:manager-4.13.0

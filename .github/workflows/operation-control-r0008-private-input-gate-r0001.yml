name: Operation control r0008 private input gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0008_private_input.py'
      - 'tests/core/test_operation_control_r0008_private_input.py'
      - '.github/workflows/operation-control-r0008-private-input-gate-r0001.yml'
      - 'docs/authorizations/operation-control-r0008-stage/**'
      - 'docs/evidence/R0008_STAGE_BOUNDARY_*.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact issued r0008 authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("docs/authorizations/operation-control-r0008-stage/a6383609e9a6442ad86445ba62baff93.json")
          files = sorted(Path("docs/authorizations/operation-control-r0008-stage").glob("*.json"))
          if files != [path]:
              raise SystemExit(f"unexpected r0008 authority set: {files}")
          raw = path.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          canonical = (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if raw != canonical:
              raise SystemExit("r0008 authority is not canonical")
          if hashlib.sha256(raw).hexdigest() != "2bc92df91d1272c30783879c794a36e066e5ad024a262c70ba09c33ec50e7864":
              raise SystemExit("r0008 authority SHA mismatch")
          if value.get("transaction_id") != "a6383609e9a6442ad86445ba62baff93":
              raise SystemExit("r0008 authority transaction mismatch")
          if value.get("scope") != "R0008_RELEASE_STAGE_ONLY":
              raise SystemExit("r0008 authority scope mismatch")
          if value.get("production_stage_authorized") is not True:
              raise SystemExit("r0008 authority stage permission missing")
          for key in (
              "activation_authorized",
              "drive_content_mutation_authorized",
              "legacy_hub_mutation_authorized",
              "writer_mutation_authorized",
              "credential_mutation_authorized",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"unsafe r0008 authority flag: {key}")
          PY

      - name: Compile private-input tooling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "tools/operation_control_r0008_private_input.py",
              "tests/core/test_operation_control_r0008_private_input.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run private-input regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s tests/core -p 'test_operation_control_r0008_private_input.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove isolated pre-stage surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("tools/operation_control_r0008_private_input.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "acquire")',
              '/var/lib/keelaryn/operation-control/r0008-stage-input',
              'a6383609e9a6442ad86445ba62baff93',
              '03f3e794fdcbd18e07d21dcb633c463674ce4e6b',
              '101b05042471abf7d10415cea36ba3053093364d',
              '2bc92df91d1272c30783879c794a36e066e5ad024a262c70ba09c33ec50e7864',
              'release_publication_performed": False',
              'stage_witness_mutation_performed": False',
              'activation_performed": False',
              'drive_mutations_performed": False',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing r0008 private-input contract: {needle}")
          forbidden = (
              '/r0007-stage-input',
              'parser.add_argument("--input-root"',
              'parser.add_argument("--repository-root"',
              '"activate"',
              'release_switch',
              'hub_cutover',
          )
          for needle in forbidden:
              if needle in raw:
                  raise SystemExit(f"unsafe/private-input residue: {needle}")
          PY

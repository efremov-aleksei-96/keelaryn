name: One-shot tag Manager 4.17.5 g1

on:
  push:
    branches:
      - 'dev/manager-4.17.5'
    paths:
      - '.github/workflows/tag-manager-4.17.5-g1.yml'

permissions:
  contents: write

jobs:
  tag-frozen-candidate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and tag exact frozen candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate='2ddb392a471c25c9875c1e7f3324a0b7090bf7a2'
          $expectedTree='60ce7220e4aefbc7c62ed35d3df3a140770ef8d3'
          $expectedManaged='881529011dbdef0b114a5ed6a0b1f5ab4300a13d4194557812f8b5bdbd868168'
          $tag='provenance/candidate-manager-4.17.5-g1'

          git cat-file -e ($candidate+'^{commit}')
          if($LASTEXITCODE-ne0){throw 'Frozen candidate commit is unavailable.'}
          $tree=(git rev-parse ($candidate+'^{tree}')).Trim()
          if($tree-cne$expectedTree){throw ('Frozen candidate tree mismatch: '+$tree)}
          git diff --quiet ($candidate+'^') $candidate
          if($LASTEXITCODE-ne0){throw 'Frozen candidate commit is not metadata-only/empty.'}

          $provText=(git show ($candidate+':PUBLIC_PROVENANCE.json')) -join "`n"
          $prov=$provText|ConvertFrom-Json
          if([string]$prov.source_manager_version-cne'4.17.5'){throw 'Frozen candidate version mismatch.'}
          if([string]$prov.source_manager_gate_managed_content_sha256-cne$expectedManaged){throw 'Frozen candidate managed digest mismatch.'}
          if([bool]$prov.production_validation.full_gate_pass){throw 'Frozen candidate must not claim production qualification.'}

          $existing=[string](git ls-remote --tags origin ('refs/tags/'+$tag))
          if($existing){
              $remoteSha=($existing -split '\s+')[0]
              if($remoteSha-cne$candidate){throw ('Candidate tag already points elsewhere: '+$remoteSha)}
              Write-Host ('Candidate tag already correct: '+$tag+' -> '+$candidate) -ForegroundColor Green
              exit 0
          }

          git tag $tag $candidate
          git push origin ('refs/tags/'+$tag)
          if($LASTEXITCODE-ne0){throw 'Candidate tag push failed.'}
          Write-Host ('CANDIDATE TAG: PASS - '+$tag+' -> '+$candidate) -ForegroundColor Green

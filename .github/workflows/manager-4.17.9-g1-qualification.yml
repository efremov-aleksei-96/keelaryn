name: Manager 4.17.9 g1 qualification

on:
  push:
    branches:
      - 'maintenance/qualify-manager-4.17.9-g1'
    paths:
      - '.github/workflows/manager-4.17.9-g1-qualification.yml'

permissions:
  contents: read

jobs:
  hosted-g1:
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cb036051586d567502ce31ca8f1192a39bd69ddf
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact production 4.17.8 provenance baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7183f563e644b85f7131db2707816730b5dffb6b
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen identities, development evidence and Framework r24
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $candidateSha=(git -C $candidate rev-parse HEAD).Trim()
          $candidateTree=(git -C $candidate rev-parse 'HEAD^{tree}').Trim()
          $candidateParent=(git -C $candidate rev-parse 'HEAD^').Trim()
          $baselineSha=(git -C $baseline rev-parse HEAD).Trim()
          if($candidateSha-cne'cb036051586d567502ce31ca8f1192a39bd69ddf'){throw('Candidate SHA mismatch: '+$candidateSha)}
          if($candidateTree-cne'dd9f3858ede2a1ced94a77026a36fbbb046da1ba'){throw('Candidate tree mismatch: '+$candidateTree)}
          if($candidateParent-cne'04b59748ca39ea7dc786ef7df722d1426fdc74ac'){throw('Candidate parent mismatch: '+$candidateParent)}
          if($baselineSha-cne'7183f563e644b85f7131db2707816730b5dffb6b'){throw('Baseline SHA mismatch: '+$baselineSha)}
          $freezeDiff=@(git -C $candidate diff --name-only HEAD^ HEAD)
          if($freezeDiff.Count-ne0){throw('Frozen candidate commit is not tree-identical to validated development parent: '+([string]::Join(', ',@($freezeDiff))))}
          $cm=Get-Content (Join-Path $candidate 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $bm=Get-Content (Join-Path $baseline 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $ci=Get-Content (Join-Path $candidate 'manager\product\install\INSTALLATION.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $bi=Get-Content (Join-Path $baseline 'manager\product\install\INSTALLATION.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$ci.manager_version-cne'4.17.9'){throw 'Candidate version mismatch.'}
          if([string]$bi.manager_version-cne'4.17.8'){throw 'Baseline version mismatch.'}
          if([string]$cm.manager.installation_sha256-cne'6072f033cca7f51b56c58ed8332410972246744c80f6c4c7d47a340e7709d357'){throw 'Candidate installation identity mismatch.'}
          if([string]$cm.manager.gate_managed_content_sha256-cne'cbffc5af41738afcbff038d1a2ca4f68e2495957f4ebe75afacc215a79190e56'){throw 'Candidate managed digest mismatch.'}
          if([string]$bm.manager.gate_managed_content_sha256-cne'09f405fa6e628d1cfbd45da533f86eb35865b506c017dcc764e476db54c93758'){throw 'Baseline managed digest mismatch.'}
          if([int]$cm.gate_framework.revision-ne24-or[int]$bm.gate_framework.revision-ne24){throw 'Framework revision mismatch.'}
          $cRows=@($cm.gate_framework.files|ForEach-Object{([string]$_.path)+':'+([string]$_.sha256)}|Sort-Object)
          $bRows=@($bm.gate_framework.files|ForEach-Object{([string]$_.path)+':'+([string]$_.sha256)}|Sort-Object)
          if([string]::Join('|',$cRows)-cne[string]::Join('|',$bRows)){throw 'Candidate/baseline Framework bytes differ.'}
          $state=Get-Content (Join-Path $candidate 'MANAGER_DEVELOPMENT_STATE.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($state.open_release_blockers).Count-ne0){throw 'Frozen candidate source still records open release blockers.'}
          if([string]$state.qualification.risk_defect_gate.status-cne'required_pass_before_freeze'){throw 'Frozen candidate does not require strict pre-freeze Risk/Defect Gate PASS.'}
          if([string]$state.pre_freeze_tooling_hardening.permanent_regression-cne'tools/Invoke-ManagerRiskContextRegression.ps1'){throw 'Risk-context lifecycle regression is not bound in candidate state.'}
          Write-Host 'FROZEN IDENTITY / VALIDATED PARENT / BASELINE / FRAMEWORK: PASS' -ForegroundColor Green

      - name: Verify public repository boundary and Actions policy
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Verify-PublicRepository.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Verify-GitHubActionsPolicy.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Re-run permanent pre-freeze regressions on exact candidate
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-ManagerRiskContextRegression.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-Manager4179ConvergenceRegression.ps1') -RepositoryRoot $candidate
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Build exact ordinary g1 Manager gate
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $out=Join-Path $env:RUNNER_TEMP 'manager-4.17.9.zip'
          $builder=Join-Path $candidate 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $builder -SourceRoot (Join-Path $candidate 'manager') -BaselineVersion '4.17.8' -GateRevision 1 -OutputPath $out -Force
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "G1_GATE=$out" >> $env:GITHUB_ENV
          "G1_GATE_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host ('Ordinary g1 gate SHA-256: '+$sha)

      - name: Run exact ordinary SourceGate g1
        shell: powershell
        run: |
          $keelaryn=Join-Path $env:RUNNER_TEMP 'keelaryn'
          $work=Join-Path $keelaryn 'tests\work'
          New-Item -ItemType Directory -Force -Path $work|Out-Null
          Expand-Archive -LiteralPath $env:G1_GATE -DestinationPath $work -Force
          $root=Join-Path $work 'manager-4.17.9'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gate\Run-KeelarynManagerSourceGate.ps1') -ManagerRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'ORDINARY SOURCE GATE g1: PASS' -ForegroundColor Green

      - name: Run disposable Full Gate g9001 over exact production 4.17.8 provenance source
        shell: powershell
        run: |
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $workspace=Join-Path $env:RUNNER_TEMP 'manager-4.17.9-g9001'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $candidate 'tools\Invoke-DisposableManagerFullGate.ps1') `
            -CandidateManagerRoot (Join-Path $candidate 'manager') `
            -BaselineManagerRoot (Join-Path $baseline 'manager') `
            -FrameworkRoot (Join-Path $candidate 'tests\framework\manager-gate') `
            -WorkspaceRoot $workspace `
            -CandidateRef 'cb036051586d567502ce31ca8f1192a39bd69ddf' `
            -BaselineRef '7183f563e644b85f7131db2707816730b5dffb6b' `
            -GateRevision 9001
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          "DISPOSABLE_EVIDENCE=$workspace\evidence" >> $env:GITHUB_ENV

      - name: Write compact hosted qualification receipt
        shell: powershell
        run: |
          $receipt=[ordered]@{
            schema='keelaryn.manager-hosted-qualification.v1'
            classification='hosted_prequalification_only'
            manager_version='4.17.9'
            candidate_commit='cb036051586d567502ce31ca8f1192a39bd69ddf'
            candidate_tree='dd9f3858ede2a1ced94a77026a36fbbb046da1ba'
            validated_development_parent='04b59748ca39ea7dc786ef7df722d1426fdc74ac'
            development_validation_run_id='34753434645'
            development_validation_artifact_id='10316478367'
            development_validation_artifact_sha256='d6fbfeea7f446acdd574f116f4e0c150b8e66b26b75aa4ae99d1630afc56d050'
            knowledge_closure_commit='00239eb609f84eb1ad5110ff0abffda236769aff'
            knowledge_closure_run_id='34753054865'
            managed_digest='cbffc5af41738afcbff038d1a2ca4f68e2495957f4ebe75afacc215a79190e56'
            installation_sha256='6072f033cca7f51b56c58ed8332410972246744c80f6c4c7d47a340e7709d357'
            baseline_version='4.17.8'
            baseline_commit='7183f563e644b85f7131db2707816730b5dffb6b'
            baseline_tested_update_sha256='411c91fbb470541ecf8055f4427e7297f3b7a82b040a7de11e3c5b76860a1ba6'
            framework_revision=24
            qualification_gate_revision=1
            disposable_gate_revision=9001
            ordinary_gate_sha256=$env:G1_GATE_SHA
            risk_context_lifecycle_regression_pass=$true
            manager_4179_convergence_regression_pass=$true
            source_gate_pass=$true
            disposable_full_gate_pass=$true
            personal_hub_used=$false
            production_qualified=$false
            requires_real_current_backed_gate=$true
            completed_utc=[DateTime]::UtcNow.ToString('o')
          }
          $path=Join-Path $env:RUNNER_TEMP 'HOSTED_QUALIFICATION.json'
          [IO.File]::WriteAllText($path,(($receipt|ConvertTo-Json -Depth 10).Replace("`r`n","`n")+"`n"),(New-Object Text.UTF8Encoding($false)))
          "HOSTED_RECEIPT=$path" >> $env:GITHUB_ENV

      - name: Upload exact g1 gate and hosted evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-4.17.9-g1-hosted-qualification
          path: |
            ${{ env.G1_GATE }}
            ${{ env.HOSTED_RECEIPT }}
            ${{ env.DISPOSABLE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7

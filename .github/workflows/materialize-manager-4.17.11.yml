name: Materialize Manager 4.17.11

on:
  push:
    branches:
      - 'dev/manager-4.17.11'
    paths:
      - '.github/workflows/materialize-manager-4.17.11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keelaryn-materialize-manager-4.17.11
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify exact one-shot source identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedParent='cd8dfb73cf1223cd8468ab55e53f46cf2455c1e8'
          $parent=(git rev-parse HEAD^).Trim()
          if($parent -cne $expectedParent){throw('Unexpected materialization parent: '+$parent+' expected='+$expectedParent)}
          $changed=@(git diff --name-only HEAD^ HEAD)
          if($changed.Count-ne1 -or [string]$changed[0] -cne '.github/workflows/materialize-manager-4.17.11.yml'){throw('Unexpected workflow-validator diff: '+([string]::Join(', ',@($changed))))}
          $runtime=(Get-Content -LiteralPath 'manager/product/runtime/Keelaryn__Manager.ps1' -Raw -Encoding UTF8)
          if($runtime -notmatch '(?m)^\$ManagerVersion = "4\.17\.10"$'){throw 'Expected 4.17.10 runtime base marker is absent.'}

      - name: Parse materializer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools\Apply-Manager41711ReleaseReviewFixes.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $p),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw([string]::Join(' | ',@($errors|ForEach-Object{$_.Message})))}

      - name: Materialize product
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Apply-Manager41711ReleaseReviewFixes.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Validate exact product diff and contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expected=@(
            'manager/README_FIRST.md',
            'manager/product/install/INSTALLATION.json',
            'manager/product/manager_release.json',
            'manager/product/runtime/Keelaryn__Manager.ps1'
          )
          $changed=@(git status --porcelain | ForEach-Object{$_.Substring(3).Replace('\','/')} | Sort-Object)
          $wanted=@($expected|Sort-Object)
          if([string]::Join("`n",$changed)-cne[string]::Join("`n",$wanted)){throw('Unexpected product diff: '+([string]::Join(', ',@($changed))))}

          $runtime=Join-Path $env:GITHUB_WORKSPACE 'manager\product\runtime\Keelaryn__Manager.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($runtime,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw('Runtime parser failure: '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          $text=Get-Content -LiteralPath $runtime -Raw -Encoding UTF8
          if($text -notmatch '(?m)^\$ManagerVersion = "4\.17\.11"$'){throw '4.17.11 runtime marker absent.'}
          $update=[regex]::Match($text,'(?s)function Invoke-Update \{.*?(?=\r?\nfunction )').Value
          if(-not$update){throw 'Invoke-Update body not found.'}
          $pending=[regex]::Matches($update,'(?m)^\s*\$pendingCandidates=@\(Get-ChildItem -LiteralPath \$(?<inbox>\w+) -File -Filter ''\*\.zip''')
          if($pending.Count-ne1){throw('Invoke-Update must contain exactly one pendingCandidates inventory; actual='+$pending.Count)}
          if($pending[0].Groups['inbox'].Value-cne'HubInbox'){throw('Invoke-Update pendingCandidates must inventory active $HubInbox; actual=$'+$pending[0].Groups['inbox'].Value)}

          $readme=Get-Content -LiteralPath 'manager/README_FIRST.md' -Raw -Encoding UTF8
          foreach($required in @('# Keelaryn Manager 4.17.11','production-installed Manager 4.17.10 -> 4.17.11','inherited and 4.17.11 regressions','disposable 4.17.10 -> 4.17.11 update')){if(-not$readme.Contains($required)){throw('README missing current release contract: '+$required)}}
          foreach($stale in @('production-installed Manager 4.17.6 -> 4.17.7','inherited and 4.17.7 regressions','disposable 4.17.6 -> 4.17.7 update')){if($readme.Contains($stale)){throw('README retains stale normative release contract: '+$stale)}}
          Write-Host 'Manager 4.17.11 product materialization validation: PASS' -ForegroundColor Green

      - name: Commit exact product materialization
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager/README_FIRST.md manager/product/install/INSTALLATION.json manager/product/manager_release.json manager/product/runtime/Keelaryn__Manager.ps1
          $staged=@(git diff --cached --name-only)
          if($staged.Count-ne4){throw('Expected four staged product paths; observed '+$staged.Count)}
          git commit -m 'Manager 4.17.11: fix registry pending reporting and release docs'
          git push origin HEAD:dev/manager-4.17.11

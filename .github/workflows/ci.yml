name: Corpus-first development

on:
  push:
    branches: [dev/corpus-first-p0]
  pull_request:
    branches: [dev/corpus-first-p0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-first-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - name: Validate clean state
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(cat .go-version)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("DEVELOPMENT_STATE.json").read_text())
          assert state["schema"]=="keelaryn.development-state.v2"
          assert state["authoritative_branch"]=="dev/corpus-first-p0"
          assert state["architecture_authority"]=="KEELARYN_CANONICAL.md"
          assert Path("docs/C0_ABSORPTION_MANIFEST.md").is_file()
          assert Path("docs/C0_CLEANUP_MANIFEST.md").is_file()
          PY
          go mod tidy -diff
          go test ./...

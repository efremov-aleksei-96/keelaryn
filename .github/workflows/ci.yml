name: Corpus-first development

on:
  push:
    branches:
      - 'dev/corpus-first-p0'
  pull_request:
    branches:
      - 'dev/corpus-first-p0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate current development authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("DEVELOPMENT_STATE.json").read_text(encoding="utf-8"))
          assert state["schema"] == "keelaryn.development-state.v2"
          assert state["authoritative_branch"] == "dev/corpus-first-p0"
          assert state["architecture_authority"] == "KEELARYN_CANONICAL.md"
          phase_product = (state["phase"], state["product_level"])
          allowed_phase_products = {
              ("P0_CLOSURE_QUALIFICATION", "P0_PROOF_PASS_PENDING_EXACT_HEAD_CI"),
              ("POST_P0_RELIABILITY", "P0_CLOSED"),
              ("POST_P0_INCREMENTAL_LOCAL_PROVIDER_OBSERVATION", "P0_CLOSED"),
          }
          assert phase_product in allowed_phase_products
          assert "C0_CLOSED" in state["completed"]
          assert Path("KEELARYN_CANONICAL.md").is_file()
          assert Path("docs/REUSE_LEDGER.md").is_file()
          PY

      - name: Summarize current development authority
        run: python3 scripts/development_preflight.py

      - name: Prove legacy implementation is absent
        run: |
          set -euo pipefail
          for p in manager hub core deploy spec tools tests; do
            test ! -e "$p"
          done

  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Go version
        run: go version

      - name: Go dependency lock
        run: go mod tidy -diff

      - name: Go tests
        run: go test -timeout 15m ./...

      - name: Go vet
        run: go vet ./...

name: Candidate Manager 4.12.0 Gate Revision 2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/candidate-manager-4.12.0-g2.yml'
      - 'tests/candidates/manager-4.12.0-g1/**'

permissions:
  contents: read

concurrency:
  group: keelaryn-manager-4.12.0-g2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-gate:
    runs-on: windows-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify qualified 4.11.0 public base
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Get-Content "$env:GITHUB_WORKSPACE\manager\product\install\INSTALLATION.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$install.manager_version -ne '4.11.0') { throw 'Candidate patch base must be Manager 4.11.0.' }

      - name: Reconstruct exact Manager 4.12.0 g1 bytes
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $parts = Join-Path $root 'tests\candidates\manager-4.12.0-g1'
          $patch = Join-Path $env:RUNNER_TEMP 'manager-4.12.0-g1.patch'
          cmd.exe /d /c "copy /b `"$parts\part1.patch`"+`"$parts\part2.patch`"+`"$parts\part3.patch`"+`"$parts\part4.patch`" `"$patch`" >nul"
          if ($LASTEXITCODE -ne 0) { throw 'Could not reconstruct Manager candidate patch.' }
          $patchText = [System.IO.File]::ReadAllText($patch,[System.Text.Encoding]::UTF8).Replace("`r`n","`n")
          [System.IO.File]::WriteAllText($patch,$patchText,(New-Object System.Text.UTF8Encoding($false)))
          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '644c124a32c74fa229b79a8c7e0652fc88d18ca002dd214fe17fd86c74471383') { throw "Manager candidate patch hash mismatch: $patchHash" }

          $menu = Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          $menuText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($menu)).Replace("`r`n","`n")
          [System.IO.File]::WriteAllText($menu,$menuText,(New-Object System.Text.ASCIIEncoding))
          git apply --check --whitespace=nowarn "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'Manager 4.12.0 patch does not apply cleanly.' }
          git apply --whitespace=nowarn "$patch"
          if ($LASTEXITCODE -ne 0) { throw 'Manager 4.12.0 patch application failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'LF-normalized Manager candidate failed git diff --check.' }
          $menuText = [System.IO.File]::ReadAllText($menu,[System.Text.Encoding]::ASCII).Replace("`r`n","`n").Replace("`n","`r`n")
          [System.IO.File]::WriteAllText($menu,$menuText,(New-Object System.Text.ASCIIEncoding))

          $installPath = Join-Path $root 'manager\product\install\INSTALLATION.json'
          $installHash = (Get-FileHash -LiteralPath $installPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installHash -ne '7d616af1999a0071299044ac4f5f72d14f1bd74f5bc4fb280714db2076efaf77') { throw "Candidate INSTALLATION hash mismatch: $installHash" }

      - name: Reconstruct Gate Framework r10
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $patch = Join-Path $root 'tests\candidates\manager-4.12.0-g1\framework-r10.patch'
          $patchText = [System.IO.File]::ReadAllText($patch,[System.Text.Encoding]::UTF8).Replace("`r`n","`n")
          $canonical = Join-Path $env:RUNNER_TEMP 'framework-r10.patch'
          [System.IO.File]::WriteAllText($canonical,$patchText,(New-Object System.Text.UTF8Encoding($false)))
          $hash = (Get-FileHash -LiteralPath $canonical -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '326e8e70b2d0bdae551d38638ee955d67fadf94c2063a4cfd6a27551b179822a') { throw "Framework r10 patch hash mismatch: $hash" }
          git apply --check --whitespace=nowarn "$canonical"
          if ($LASTEXITCODE -ne 0) { throw 'Framework r10 patch does not apply cleanly to frozen r9.' }
          git apply --whitespace=nowarn "$canonical"
          if ($LASTEXITCODE -ne 0) { throw 'Framework r10 patch application failed.' }
          $marker = (Get-Content "$root\tests\framework\manager-gate\FRAMEWORK_REVISION.txt" -Raw -Encoding UTF8).Trim()
          if ($marker -ne '10') { throw "Framework revision is not 10: $marker" }

      - name: Build Gate Revision 2 and bind candidate identity
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $builder = Join-Path $root 'tests\framework\manager-gate\Build-ManagerGate.ps1'
          $gateZip = Join-Path $env:RUNNER_TEMP 'manager-4.12.0.zip'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $builder -SourceRoot (Join-Path $root 'manager') -BaselineVersion '4.11.0' -GateRevision 2 -OutputPath $gateZip -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $work = Join-Path $root 'tests\work'
          Expand-Archive -LiteralPath $gateZip -DestinationPath $work -Force
          $candidate = Join-Path $work 'manager-4.12.0'
          $spec = Get-Content (Join-Path $candidate 'gate\GATE_SPEC.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$spec.candidate_version -ne '4.12.0') { throw 'Candidate version mismatch.' }
          if ([string]$spec.baseline_manager_version -ne '4.11.0') { throw 'Baseline mismatch.' }
          if ([int]$spec.framework_revision -ne 10) { throw 'Expected Gate Framework revision 10.' }
          if ([int]$spec.gate_revision -ne 2) { throw 'Expected Gate Revision 2.' }
          if ([string]$spec.candidate_installation_sha256 -ne '7d616af1999a0071299044ac4f5f72d14f1bd74f5bc4fb280714db2076efaf77') { throw 'INSTALLATION identity differs from Manager g1.' }
          if ([string]$spec.candidate_managed_content_sha256 -ne 'fb0137c9485475ba7af069d5f1b7fe97c1b16121b9b97d47b3669e0cd435b32b') { throw 'Managed-content identity differs from Manager g1.' }
          "CANDIDATE_ROOT=$candidate" >> $env:GITHUB_ENV
          "CANDIDATE_GATE_ZIP=$gateZip" >> $env:GITHUB_ENV

      - name: Run Windows PowerShell 5.1 SourceGate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:CANDIDATE_ROOT\gate\Run-KeelarynManagerSourceGate.ps1" -ManagerRoot "$env:CANDIDATE_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare immutable 4.11.0 CURRENT-backed fixture
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Keelaryn_v4.11.0_Windows.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/efremov-aleksei-96/keelaryn/releases/download/v4.11.0/Keelaryn_v4.11.0_Windows.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'c4a3412d7a6e633f892b2451576c619c6de95375b8ba13aa818deb0f7b6e4241') { throw "Published 4.11.0 distribution hash mismatch: $hash" }
          $parent = Join-Path $env:RUNNER_TEMP ('production_fixture_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $parent | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $parent -Force
          $prod = Join-Path $parent 'keelaryn'
          $runtime = Join-Path $prod 'manager\product\runtime\Keelaryn__Manager.ps1'
          $cfgPath = Join-Path $parent 'genesis.json'
          $cfg = [ordered]@{schema='keelaryn.genesis-input.v1';language='en';purpose='mixed';timezone='UTC';areas=@('Fixture');projects=@('Baseline')}
          [System.IO.File]::WriteAllText($cfgPath,(($cfg | ConvertTo-Json -Depth 5) + "`n"),(New-Object System.Text.UTF8Encoding($false)))
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -Genesis -GenesisConfigPath $cfgPath -GenesisConfirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -Doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PRODUCTION_FIXTURE=$prod" >> $env:GITHUB_ENV

      - name: Run CURRENT-backed disposable Full Gate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:CANDIDATE_ROOT\gate\Run-KeelarynManagerFullGate.ps1" -CandidateRoot "$env:CANDIDATE_ROOT" -ProductionRoot "$env:PRODUCTION_FIXTURE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Generic DISTRIBUTION for UX smoke
        shell: powershell
        run: |
          $runtime = Join-Path $env:CANDIDATE_ROOT 'product\runtime\Keelaryn__Manager.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtime -BuildRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dist = Join-Path $env:CANDIDATE_ROOT '_releases\Keelaryn__Manager_Distribution_v4.12.0.zip'
          if (-not (Test-Path -LiteralPath $dist -PathType Leaf)) { throw 'Candidate Generic DISTRIBUTION missing.' }
          "CANDIDATE_DIST=$dist" >> $env:GITHUB_ENV

      - name: Verify first-run and source-checkout recovery UX
        shell: powershell
        run: |
          function Invoke-Menu([string]$MenuPath,[string]$InputText) {
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=(Join-Path $PSHOME 'powershell.exe')
            $psi.Arguments='-NoProfile -ExecutionPolicy Bypass -File "'+$MenuPath+'" -Action Menu -NoRootLauncher'
            $psi.UseShellExecute=$false;$psi.RedirectStandardInput=$true;$psi.RedirectStandardOutput=$true;$psi.RedirectStandardError=$true
            $p=New-Object System.Diagnostics.Process;$p.StartInfo=$psi;[void]$p.Start()
            $outTask=$p.StandardOutput.ReadToEndAsync();$errTask=$p.StandardError.ReadToEndAsync()
            $p.StandardInput.Write($InputText);$p.StandardInput.Close();$p.WaitForExit()
            $output=$outTask.Result+$errTask.Result
            if($p.ExitCode-ne0){throw("Menu process failed with "+$p.ExitCode+": "+$output)}
            return $output
          }

          $first=Join-Path $env:RUNNER_TEMP ('first_'+[guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Path $first|Out-Null
          Expand-Archive -LiteralPath $env:CANDIDATE_DIST -DestinationPath $first -Force
          $menu=Join-Path $first 'keelaryn\manager\product\tools\KeelarynMenu.ps1'
          $output=Invoke-Menu $menu "3`r`n0`r`n"
          foreach($token in @('Welcome to Keelaryn','Create a new Hub','Connect an existing Hub','Everyday')){if(-not$output.Contains($token)){throw("First-run output missing: "+$token)}}

          $collision=Join-Path $env:RUNNER_TEMP ('collision_'+[guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Path $collision|Out-Null
          Expand-Archive -LiteralPath $env:CANDIDATE_DIST -DestinationPath $collision -Force
          $root=Join-Path $collision 'keelaryn';$hub=Join-Path $root 'hub';New-Item -ItemType Directory -Path $hub|Out-Null
          Set-Content -LiteralPath (Join-Path $hub 'README.md') -Value 'repository boundary marker' -Encoding ASCII
          $menu=Join-Path $root 'manager\product\tools\KeelarynMenu.ps1';$output=Invoke-Menu $menu "3`r`n0`r`n"
          foreach($token in @('not an empty first-run state','Genesis will not overwrite it','source checkout is not a clean runtime installation')){if(-not$output.Contains($token)){throw("Recovery output missing: "+$token)}}

      - name: Upload Gate Revision 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-4.12.0-gate2-r10-evidence
          path: |
            ${{ runner.temp }}/manager-4.12.0.zip
            tests/results/manager-4.12.0/**
          if-no-files-found: warn
          retention-days: 30

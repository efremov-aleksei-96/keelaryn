name: Operation control r0007 real stage transaction gate r0002

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_real_stage_transaction.py'
      - 'tests/core/test_operation_control_r0007_real_stage_transaction.py'
      - '.github/workflows/operation-control-r0007-real-stage-transaction-gate-r0002.yml'
      - 'tools/operation_control_r0007_stage_execution.py'
      - 'tools/operation_control_r0007_stage_authority.py'
      - 'tools/operation_control_r0007_stage_authority_issue.py'
      - 'tools/operation_control_r0007_production_stage.py'
      - 'tools/operation_control_r0007_stage.py'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-real-stage-transaction-gate-r0002-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove no real stage authorization or result exists
        run: |
          set -euo pipefail
          for root in \
            docs/authorizations/operation-control-r0007-stage \
            docs/evidence/operation-control-r0007-stage-results
          do
            if [ -d "$root" ] && find "$root" -type f -print -quit | grep -q .; then
              echo "D0-02J must not create real production transaction authority/result records." >&2
              exit 1
            fi
          done

      - name: Syntax-check real-stage transaction tooling without residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "tools/operation_control_r0007_real_stage_transaction.py",
              "tests/core/test_operation_control_r0007_real_stage_transaction.py",
          ):
              raw = Path(name).read_text(encoding="utf-8")
              compile(raw, name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run real-stage transaction regression tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0007_real_stage_transaction.py' -v
          test -z "$(git status --porcelain)"

      - name: Qualify concrete one-shot real-stage transaction without production mutation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/OPERATION_CONTROL_R0007_REAL_STAGE_TRANSACTION_QUALIFICATION.json"
          stdout="$RUNNER_TEMP/real-stage-transaction-stdout.json"

          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            tools/operation_control_r0007_real_stage_transaction.py qualify \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$out" \
            > "$stdout"

          cmp "$stdout" "$out"

          python3 - "$out" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_scenarios = {
              "evidence_then_authority": "PASS",
              "authority_branch_drift": "FAIL_CLOSED",
              "autonomous_exact_acquisition": "ACQUIRED_EXACT",
              "acquisition_replay": "ALREADY_ACQUIRED_EXACT",
              "foreign_private_input": "FAIL_CLOSED_UNTOUCHED",
              "one_shot_execution": "COMPLETED_EXACT",
              "result_checkpoint": "RESULT_CHECKPOINTED_EXACT",
              "result_replay": "RESULT_ALREADY_CHECKPOINTED_EXACT",
              "foreign_result_checkpoint": "FAIL_CLOSED",
              "stale_boundary": "FAIL_BEFORE_PREPARED",
          }

          if value.get("schema") != "keelaryn.operation-control-r0007-real-stage-transaction-qualification.v1":
              raise SystemExit("real-stage transaction schema mismatch")
          if value.get("gate_revision") != "operation-control-r0007-real-stage-transaction-gate-r0002":
              raise SystemExit("real-stage transaction gate revision mismatch")
          if value.get("candidate") != "operation-control-r0007-20260921-01":
              raise SystemExit("real-stage transaction candidate mismatch")
          if value.get("source_commit") != "833123b6a7ad2c61087ee8a86700bb9ad8a46298":
              raise SystemExit("real-stage source mismatch")
          if value.get("source_tree") != "bbca9e3a17162e12a7a0f649138e8c469518ad2a":
              raise SystemExit("real-stage tree mismatch")
          if value.get("payload_sha256") != "c833a385e03d313497f865a669dbce8050fa4b296dc587836dad2fa5d3f560e9":
              raise SystemExit("real-stage payload SHA mismatch")
          if value.get("payload_size") != 414534 or value.get("file_count") != 208:
              raise SystemExit("real-stage payload size/count mismatch")
          if value.get("production_repository_url") != "https://github.com/efremov-aleksei-96/keelaryn.git":
              raise SystemExit("real-stage production repository URL mismatch")
          if value.get("acquisition_model") != "VPS_GIT_FETCH_EXACT_COMMIT_VERIFY_TREE_REBUILD_TWICE":
              raise SystemExit("real-stage acquisition model mismatch")
          if value.get("private_input_model") != "TRANSACTION_BOUND_0600_IMMUTABLE_INPUT":
              raise SystemExit("real-stage private input model mismatch")
          for key in (
              "boundary_evidence_checkpoint_before_authority",
              "authority_commit_isolated",
              "authority_git_blob_captured",
              "payload_verified_before_prepared",
              "result_checkpoint_after_completed",
              "result_checkpoint_isolated",
              "activation_separate_transaction",
          ):
              if value.get(key) is not True:
                  raise SystemExit(f"real-stage invariant missing: {key}")
          if value.get("physical_commit_authority") != "EXACT_IMMUTABLE_RELEASE_DIRECTORY":
              raise SystemExit("real-stage physical authority mismatch")
          if value.get("maintainer_workstation_transport_required") is not False:
              raise SystemExit("real-stage unexpectedly requires maintainer workstation")
          for key in (
              "real_authorization_record_issued",
              "real_vps_input_acquired",
              "real_vps_stage_performed",
              "production_mutation_allowed",
              "drive_content_mutation_allowed",
              "production_qualified",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"real-stage unsafe flag: {key}")
          if value.get("scenario_count") != 10:
              raise SystemExit("real-stage scenario count mismatch")
          if value.get("scenarios") != expected_scenarios:
              raise SystemExit(f"real-stage scenarios mismatch: {value.get('scenarios')}")
          if value.get("next_action") != "FRESH_REAL_VPS_PRE_APPLY_RECONCILE_BEFORE_STAGE_AUTHORIZATION":
              raise SystemExit("real-stage next action mismatch")
          PY

          if grep -Eq '"(old_hub_root_id|new_hub_root_id|KEELARYN_GITHUB_OPERATIONS_TOKEN|token)"' "$out"; then
            echo "real-stage transaction evidence leaks forbidden authority material" >&2
            exit 1
          fi

          test -z "$(git status --porcelain)"

      - name: Upload compact real-stage transaction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0007-real-stage-transaction-gate-r0002-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0007_REAL_STAGE_TRANSACTION_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 3

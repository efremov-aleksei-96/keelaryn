name: One-shot Manager 4.17.5 corrective patch v1

on:
  push:
    branches:
      - 'dev/manager-4.17.5'
    paths:
      - '.github/workflows/manager-4.17.5-corrective-v1.yml'

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize corrective product patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $patch=Join-Path $env:GITHUB_WORKSPACE '.github\dev\Apply-Manager4175CorrectiveV1.ps1'
          $text=[IO.File]::ReadAllText($patch,[Text.Encoding]::UTF8)
          $text=$text.Replace("& `$p=`$null`r`n",'').Replace("& `$p=`$null`n",'')
          $text=$text.Replace('function R(','function Read-PatchText(').Replace('function W(','function Write-PatchText(')
          $text=[regex]::Replace($text,'(?<![\w-])R (?=\$)','Read-PatchText ')
          $text=[regex]::Replace($text,'(?<![\w-])W (?=\$)','Write-PatchText ')
          [IO.File]::WriteAllText($patch,$text,(New-Object Text.UTF8Encoding($false)))
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Validate patched development tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicPresentation.ps1" -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\tools\KeelarynMenu.ps1" -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-4175-corrective-'+$env:GITHUB_RUN_ID)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot $root -OutputDirectory $out
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'MANAGER 4.17.5 CORRECTIVE VALIDATION: PASS' -ForegroundColor Green

      - name: Commit validated product and regression changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'keelaryn-development-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager tools/Invoke-DevelopmentValidation.ps1 tools/Invoke-Manager4175ReviewRegression.ps1 PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json
          git diff --cached --check --ignore-space-at-eol
          if($LASTEXITCODE-ne0){throw 'Staged diff whitespace validation failed.'}
          if(git diff --cached --quiet){throw 'Corrective workflow produced no staged changes.'}
          git commit -m 'Manager 4.17.5: bind multi-Hub ingress and updates'
          git push origin HEAD:dev/manager-4.17.5
          Write-Host 'Validated Manager 4.17.5 product commit pushed.' -ForegroundColor Green

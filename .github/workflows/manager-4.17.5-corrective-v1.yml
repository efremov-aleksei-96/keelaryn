name: One-shot Manager 4.17.5 development finalizer

on:
  push:
    branches:
      - 'dev/manager-4.17.5'
    paths:
      - '.github/workflows/manager-4.17.5-corrective-v1.yml'

permissions:
  contents: write

jobs:
  finalize-validate-clean:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize Manager 4.17.5 development metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $readme=Join-Path $root 'manager\README_FIRST.md'
          $old='Manager 4.17.4 is the corrective successor to rejected candidate 4.17.3. It generalizes fail-if-exists directory publication to per-instance state creation, performs fresh published-baseline validation immediately before registry commits, and preserves/reports durable or ambiguous registered-Genesis commit outcomes without destructive rollback.'
          $new='Manager 4.17.5 is the corrective successor to the production-qualified but public-release-rejected Manager 4.17.4. It aligns multi-Hub CANDIDATE ingress with the active instance, binds Hub APPROVED import/update to the captured instance identity, and makes registered Genesis parent-path validation explicitly case-insensitive on Windows while preserving the existing transaction-safety and Framework r24 contracts.'+"`r`n`r`n## 4.17.4 context`r`n"+$old
          $text=[IO.File]::ReadAllText($readme,[Text.Encoding]::UTF8)
          if(([regex]::Matches($text,[regex]::Escape($old))).Count-ne1){throw 'README 4.17.4 context anchor is missing or non-unique.'}
          [IO.File]::WriteAllText($readme,$text.Replace($old,$new),$utf8)

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

          $manifest=Get-Content (Join-Path $root 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $provPath=Join-Path $root 'PUBLIC_PROVENANCE.json'
          $prov=Get-Content $provPath -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$prov.source_manager_version-cne'4.17.5'){throw 'Unexpected provenance Manager version.'}
          if([string]$prov.source_gate_baseline_manager_version-cne'4.17.4'){throw 'Unexpected provenance baseline Manager version.'}
          $prov.source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
          $prov.source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
          $json=(($prov|ConvertTo-Json -Depth 40).Replace("`r`n","`n"))+"`n"
          [IO.File]::WriteAllText($provPath,$json,$utf8)

      - name: Validate finalized development tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicPresentation.ps1" -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\tools\KeelarynMenu.ps1" -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-4175-finalize-'+$env:GITHUB_RUN_ID)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot $root -OutputDirectory $out
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'MANAGER 4.17.5 FINALIZED DEVELOPMENT TREE: PASS' -ForegroundColor Green

      - name: Publish finalized tree and remove one-shot tooling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'keelaryn-development-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/dev/Apply-Manager4175CorrectiveV1.ps1' '.github/workflows/manager-4.17.5-corrective-v1.yml'
          git add -- manager/README_FIRST.md PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          if($LASTEXITCODE-ne0){throw 'Finalized diff whitespace validation failed.'}
          if(git diff --cached --quiet){throw 'Finalizer produced no staged changes.'}
          git commit -m 'Manager 4.17.5: finalize development source'
          git push origin HEAD:dev/manager-4.17.5
          Write-Host 'Finalized Manager 4.17.5 tree pushed; one-shot tooling removed.' -ForegroundColor Green

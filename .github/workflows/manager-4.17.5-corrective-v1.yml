name: One-shot Manager 4.17.5 corrective patch v1

on:
  push:
    branches:
      - 'dev/manager-4.17.5'
    paths:
      - '.github/workflows/manager-4.17.5-corrective-v1.yml'

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Manager 4.17.5 corrective patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $runtime=Join-Path $root 'manager\product\runtime\Keelaryn__Manager.ps1'
          $menu=Join-Path $root 'manager\product\tools\KeelarynMenu.ps1'
          $install=Join-Path $root 'manager\product\install\INSTALLATION.json'
          $release=Join-Path $root 'manager\product\manager_release.json'
          $docs=Join-Path $root 'manager\product\docs\CANDIDATE_TRANSPORT.md'
          $devValidation=Join-Path $root 'tools\Invoke-DevelopmentValidation.ps1'
          $regression=Join-Path $root 'tools\Invoke-Manager4175ReviewRegression.ps1'
          $utf8=New-Object System.Text.UTF8Encoding($false)

          function Read-Text([string]$Path){return [IO.File]::ReadAllText($Path,[Text.Encoding]::UTF8)}
          function Write-Text([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$utf8)}
          function Replace-Once([string]$Path,[string]$Old,[string]$New){
            $text=Read-Text $Path
            $first=$text.IndexOf($Old,[StringComparison]::Ordinal)
            if($first-lt0){throw "Patch anchor missing: $Path :: $Old"}
            if($text.IndexOf($Old,$first+$Old.Length,[StringComparison]::Ordinal)-ge0){throw "Patch anchor is not unique: $Path :: $Old"}
            Write-Text $Path ($text.Substring(0,$first)+$New+$text.Substring($first+$Old.Length))
          }
          function Replace-OnceRegex([string]$Path,[string]$Pattern,[string]$Replacement){
            $text=Read-Text $Path
            $rx=New-Object Text.RegularExpressions.Regex($Pattern,[Text.RegularExpressions.RegexOptions]::Multiline)
            $matches=$rx.Matches($text)
            if($matches.Count-ne1){throw "Regex patch anchor count mismatch ($($matches.Count)): $Path :: $Pattern"}
            Write-Text $Path ($rx.Replace($text,$Replacement,1))
          }

          # Version surfaces.
          Replace-Once $runtime '$ManagerVersion = "4.17.4"' '$ManagerVersion = "4.17.5"'
          Replace-Once $install '"manager_version": "4.17.4"' '"manager_version": "4.17.5"'
          Replace-Once $release '"manager_version":  "4.17.4"' '"manager_version":  "4.17.5"'

          # Bind frontend Hub import/update to one captured active instance.
          Replace-Once $runtime '    [string]$GenesisInstanceName' "    [string]`$GenesisInstanceName,`r`n    [string]`$ExpectedInstanceId"
          $switchLine='if (-not [string]::IsNullOrWhiteSpace($SwitchInstanceId)) { $SwitchInstanceId=([string]$SwitchInstanceId).Trim().ToLowerInvariant() }'
          $expectedBlock=@'
if (-not [string]::IsNullOrWhiteSpace($SwitchInstanceId)) { $SwitchInstanceId=([string]$SwitchInstanceId).Trim().ToLowerInvariant() }
if (-not [string]::IsNullOrWhiteSpace($ExpectedInstanceId)) {
    $expectedGuid=[guid]::Empty
    if(-not[guid]::TryParse(([string]$ExpectedInstanceId).Trim(),[ref]$expectedGuid)-or$expectedGuid-eq[guid]::Empty){throw 'ExpectedInstanceId is invalid.'}
    $ExpectedInstanceId=$expectedGuid.ToString().ToLowerInvariant()
    if(-not($UpdateHub-or$UpdateAll)){throw 'ExpectedInstanceId is valid only with -UpdateHub or -UpdateAll.'}
}
'@.TrimEnd()
          Replace-Once $runtime $switchLine $expectedBlock

          $resolvePattern='function Resolve-RegisteredInstanceContextEarly \{\r?\n    \$registry=Read-InstanceRegistryEarly\r?\n    if\(-not\$registry\)\{return \$false\}\r?\n    \$active=Read-ActiveInstanceEarly'
          $resolveReplacement=@'
function Resolve-RegisteredInstanceContextEarly {
    $registry=Read-InstanceRegistryEarly
    if(-not$registry){
        if($ExpectedInstanceId){throw 'ExpectedInstanceId requires an initialized multi-Hub registry.'}
        return $false
    }
    $active=Read-ActiveInstanceEarly
    if($ExpectedInstanceId-and[string]$active.instance_id-ne[string]$ExpectedInstanceId){
        throw ('Active Hub changed before this Manager invocation bound its expected instance. Expected='+$ExpectedInstanceId+'; active='+[string]$active.instance_id+'. Retry the operation.')
    }
'@.TrimEnd()
          Replace-OnceRegex $runtime $resolvePattern $resolveReplacement

          # Windows paths are case-insensitive; GetFullPath does not canonicalize casing.
          Replace-Once $runtime "    if(`$parent-cne`$hubsRoot){throw('New registered Hub must be a direct child of '+`$hubsRoot+'.')}" "    if(-not `$parent.Equals(`$hubsRoot,[System.StringComparison]::OrdinalIgnoreCase)){throw('New registered Hub must be a direct child of '+`$hubsRoot+'.')}"

          # Frontend: capture instance id alongside the inbox and pass it to runtime update.
          $oldHubImport="    `$destinationInbox=`$Inbox`r`n    if(`$mode-eq'hub'){`$ctx=Get-FrontendInstanceContext;`$destinationInbox=[string]`$ctx.HubInbox;if(`$ctx.RegistryActive-and-not`$ctx.InstanceId){Fail('Multi-Hub registry is unresolved; Hub package import refused.')}}"
          if((Read-Text $menu).IndexOf($oldHubImport,[StringComparison]::Ordinal)-lt0){
            $oldHubImport=$oldHubImport.Replace("`r`n","`n")
          }
          $newHubImport=@'
    $destinationInbox=$Inbox
    $hubExpectedInstanceId=$null
    if($mode-eq'hub'){
        $ctx=Get-FrontendInstanceContext
        $destinationInbox=[string]$ctx.HubInbox
        if($ctx.RegistryActive-and-not$ctx.InstanceId){Fail('Multi-Hub registry is unresolved; Hub package import refused.')}
        if($ctx.RegistryActive){$hubExpectedInstanceId=[string]$ctx.InstanceId}
    }
'@.TrimEnd()
          Replace-Once $menu $oldHubImport $newHubImport
          Replace-Once $menu "    return Invoke-Manager @('-UpdateHub')" @'
    $hubArgs=@('-UpdateHub')
    if($hubExpectedInstanceId){$hubArgs+=@('-ExpectedInstanceId',$hubExpectedInstanceId)}
    return Invoke-Manager $hubArgs
'@.TrimEnd()

          # Expose active Hub inbox separately; global Manager inbox remains Manager-update ingress.
          Replace-Once $menu "        'StorageReport','CleanTestsWork','CompactQualificationEvidence',`r`n        'OpenInbox','OpenLogs'" "        'StorageReport','CleanTestsWork','CompactQualificationEvidence',`r`n        'OpenInbox','OpenHubInbox','OpenLogs'"
          Replace-Once $menu "        'OpenInbox' { Ensure-DirectorySafe `$Inbox 'Manager inbox'; return Open-Folder `$Inbox }" @'
        'OpenInbox' { Ensure-DirectorySafe $Inbox 'Manager inbox'; return Open-Folder $Inbox }
        'OpenHubInbox' { $ctx=Get-FrontendInstanceContext;if($ctx.RegistryActive-and-not$ctx.InstanceId){Fail('Multi-Hub registry is unresolved; active Hub inbox cannot be opened.')};$hubInbox=[string]$ctx.HubInbox;Ensure-DirectorySafe $hubInbox 'Active Hub inbox';return Open-Folder $hubInbox }
'@.TrimEnd()
          Replace-Once $menu "        Write-UiHost '  [7] Restore Hub CANDIDATE transport'" "        Write-UiHost '  [7] Restore Hub CANDIDATE transport'`r`n        Write-UiHost '  [I] Open active Hub inbox'"
          Replace-Once $menu "            '^7$' {`$null=Invoke-MenuAction 'RestoreCandidateTransport' `$null 'Restore Hub CANDIDATE transport';Pause-Menu}" "            '^7$' {`$null=Invoke-MenuAction 'RestoreCandidateTransport' `$null 'Restore Hub CANDIDATE transport';Pause-Menu}`r`n            '^(?i)i$' {`$null=Invoke-MenuAction 'OpenHubInbox' `$null 'Open active Hub inbox'}"

          # Candidate transport documentation must point to instance-scoped ingress in multi-Hub mode.
          $doc=Read-Text $docs
          $doc=$doc.Replace('Place one or more validated `Keelaryn__Hub_CANDIDATE_*.zip` files in Manager `state/inbox`, keep the matching canonical `state/baseline/Keelaryn__Hub_CURRENT.zip` in place, and run Development > Build CANDIDATE transport (compatibility command `compat/commands/BUILD_CANDIDATE_TRANSPORT.cmd`).','Place one or more validated `Keelaryn__Hub_CANDIDATE_*.zip` files in the **active Hub inbox**, then run Development > Build CANDIDATE transport (compatibility command `compat/commands/BUILD_CANDIDATE_TRANSPORT.cmd`). Use Development > Open active Hub inbox to open the authoritative ingress. In single-instance compatibility mode this is Manager `state/inbox` with `state/baseline/Keelaryn__Hub_CURRENT.zip`; after multi-Hub initialization it is `state/instances/<instance_id>/inbox` with the matching `state/instances/<instance_id>/baseline/Keelaryn__Hub_CURRENT.zip`.')
          $doc=$doc.Replace('If the original CANDIDATE ZIP is unavailable, place its transport JSON in `state/inbox` with the exact CURRENT used as `reconstruction_base`, then run Development > Restore CANDIDATE transport (compatibility command `compat/commands/RESTORE_CANDIDATE_TRANSPORT.cmd`).','If the original CANDIDATE ZIP is unavailable, place its transport JSON in the **active Hub inbox** (Development > Open active Hub inbox) with the exact instance-bound CURRENT used as `reconstruction_base`, then run Development > Restore CANDIDATE transport (compatibility command `compat/commands/RESTORE_CANDIDATE_TRANSPORT.cmd`). In multi-Hub mode the active Hub inbox is `state/instances/<instance_id>/inbox`, not global `state/inbox`.')
          Write-Text $docs $doc

          # Permanent 4.17.5 regression chain: inherited suites + new behavior.
          $regressionText=@'
[CmdletBinding()]
param([string]$RepositoryRoot=(Join-Path $PSScriptRoot '..'))
$ErrorActionPreference='Stop'
Set-StrictMode -Version 2.0
$RepositoryRoot=[IO.Path]::GetFullPath($RepositoryRoot).TrimEnd('\')
$runtimePath=Join-Path $RepositoryRoot 'manager\product\runtime\Keelaryn__Manager.ps1'
$menuPath=Join-Path $RepositoryRoot 'manager\product\tools\KeelarynMenu.ps1'
$docsPath=Join-Path $RepositoryRoot 'manager\product\docs\CANDIDATE_TRANSPORT.md'
foreach($p in @($runtimePath,$menuPath,$docsPath)){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw('Required regression input missing: '+$p)}}
function Assert([bool]$Condition,[string]$Message){if(-not$Condition){throw $Message}}
function Get-FunctionText([string]$Path,[string]$Name){
    $tokens=$null;$errors=$null
    $ast=[Management.Automation.Language.Parser]::ParseFile($Path,[ref]$tokens,[ref]$errors)
    if(@($errors).Count-ne0){throw('Parser failed for '+$Path+': '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
    $rows=@($ast.FindAll({param($n)$n-is[Management.Automation.Language.FunctionDefinitionAst]-and$n.Name-eq$Name},$true))
    if($rows.Count-ne1){throw('Expected one function '+$Name+'; actual='+$rows.Count)}
    return [string]$rows[0].Extent.Text
}
$powershell=Join-Path $PSHOME 'powershell.exe'
foreach($legacy in @('Invoke-Manager4174ReviewRegression.ps1','Invoke-Manager4174BootstrapRegression.ps1')){
    $path=Join-Path $RepositoryRoot ('tools\'+$legacy)
    & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -RepositoryRoot $RepositoryRoot
    if($LASTEXITCODE-ne0){throw($legacy+' failed with ExitCode '+$LASTEXITCODE)}
}
Write-Host '  PASS inherited Manager 4.17.4 regressions'

$runtimeText=[IO.File]::ReadAllText($runtimePath,[Text.Encoding]::UTF8)
$menuText=[IO.File]::ReadAllText($menuPath,[Text.Encoding]::UTF8)
$docsText=[IO.File]::ReadAllText($docsPath,[Text.Encoding]::UTF8)
Assert ($runtimeText.Contains('[string]$ExpectedInstanceId')) 'Runtime lacks ExpectedInstanceId guard parameter.'
Assert ($menuText.Contains("@('-ExpectedInstanceId',`$hubExpectedInstanceId)")) 'Frontend Hub import does not bind update to captured instance_id.'
Assert ($menuText.Contains("'OpenHubInbox'")) 'Frontend does not expose active Hub inbox.'
Assert ($docsText.Contains('state/instances/<instance_id>/inbox')) 'Candidate transport docs do not describe per-instance inbox.'
Assert ($docsText.Contains('Development > Open active Hub inbox')) 'Candidate transport docs do not expose the active Hub inbox route.'
Write-Host '  PASS candidate transport ingress is active-instance aware'

# Runtime guard must reject a frontend-captured A when active selection is now B.
Invoke-Expression (Get-FunctionText $runtimePath 'Resolve-RegisteredInstanceContextEarly')
$ExpectedInstanceId='11111111-1111-1111-1111-111111111111'
function Read-InstanceRegistryEarly { return [pscustomobject]@{instances=@()} }
function Read-ActiveInstanceEarly { return [pscustomobject]@{instance_id='22222222-2222-2222-2222-222222222222'} }
$blocked=$false
try{$null=Resolve-RegisteredInstanceContextEarly}catch{$blocked=$_.Exception.Message.Contains('Expected=11111111-1111-1111-1111-111111111111')}
Assert $blocked 'ExpectedInstanceId did not fail closed when active instance changed before runtime binding.'
Write-Host '  PASS Hub update expected-instance guard rejects pre-bind active-instance races'

# Windows direct-child validation must ignore path casing.
Invoke-Expression (Get-FunctionText $runtimePath 'Assert-NewRegisteredHubTargetPathSafe')
$temp=Join-Path ([IO.Path]::GetTempPath()) ('keelaryn_4175_case_'+[guid]::NewGuid().ToString('N'))
[void][IO.Directory]::CreateDirectory($temp)
try{
    $script:InstanceRegistryFile=Join-Path $temp 'instances.json';[IO.File]::WriteAllText($script:InstanceRegistryFile,'{}')
    $LayoutRoot=$temp.ToUpperInvariant();$Root=Join-Path $temp 'manager';$CanonicalTestsPath=Join-Path $temp 'tests'
    function Test-IsWindowsReservedPathSegment([string]$Name){return $false}
    function Test-KeelarynPathOverlap([string]$A,[string]$B){return $false}
    function Get-ManagerInstanceRegistry{return [pscustomobject]@{instances=@()}}
    $target=Join-Path (Join-Path $temp.ToLowerInvariant() 'hubs') 'new-hub'
    $actual=Assert-NewRegisteredHubTargetPathSafe $target
    Assert ([IO.Path]::GetFullPath($actual).Equals([IO.Path]::GetFullPath($target),[StringComparison]::OrdinalIgnoreCase)) 'Case-insensitive direct-child validation returned wrong target.'
}finally{if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Recurse -Force}}
Write-Host '  PASS registered Genesis accepts equivalent Windows path casing'

# Frontend behavioral import must pass the captured instance id into runtime.
Invoke-Expression (Get-FunctionText $menuPath 'Import-Package')
$temp=Join-Path ([IO.Path]::GetTempPath()) ('keelaryn_4175_import_'+[guid]::NewGuid().ToString('N'))
[void][IO.Directory]::CreateDirectory($temp)
try{
    $Inbox=Join-Path $temp 'manager-inbox';[void][IO.Directory]::CreateDirectory($Inbox)
    $activeInbox=Join-Path $temp 'active-inbox';[void][IO.Directory]::CreateDirectory($activeInbox)
    $pkg=Join-Path $temp 'Keelaryn__Hub_APPROVED_test.zip';[IO.File]::WriteAllText($pkg,'approved')
    $script:CapturedArgs=@()
    function Test-ReparsePoint([string]$Path){return $false}
    function Get-FrontendInstanceContext{return [pscustomobject]@{RegistryActive=$true;InstanceId='33333333-3333-3333-3333-333333333333';HubInbox=$activeInbox}}
    function Ensure-DirectorySafe([string]$Path,[string]$Purpose){if(-not(Test-Path -LiteralPath $Path)){[void][IO.Directory]::CreateDirectory($Path)}}
    function Get-FileSha256Hex([string]$Path){return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()}
    function Write-UiHost {param([object]$Object,[object]$ForegroundColor)}
    function Invoke-Manager([string[]]$ManagerArgs){$script:CapturedArgs=@($ManagerArgs);return 0}
    function Request-CommitConfirmation{return $false}
    function Set-ActionSemantic{}
    $Replace=$false
    $rc=Import-Package $pkg
    Assert ($rc-eq0) 'Behavioral Hub import did not complete.'
    Assert ($script:CapturedArgs.Count-eq3) 'Hub import did not pass exactly three runtime arguments.'
    Assert ($script:CapturedArgs[0]-ceq'-UpdateHub') 'Hub import runtime action mismatch.'
    Assert ($script:CapturedArgs[1]-ceq'-ExpectedInstanceId') 'Hub import did not pass ExpectedInstanceId.'
    Assert ($script:CapturedArgs[2]-ceq'33333333-3333-3333-3333-333333333333') 'Hub import passed wrong ExpectedInstanceId.'
    Assert (Test-Path -LiteralPath (Join-Path $activeInbox 'Keelaryn__Hub_APPROVED_test.zip') -PathType Leaf) 'Hub import did not copy to captured active Hub inbox.'
}finally{if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Recurse -Force}}
Write-Host '  PASS Hub package import/update remains bound to one captured instance'

Write-Host 'MANAGER 4.17.5 REVIEW REGRESSION: PASS' -ForegroundColor Green
'@
          Write-Text $regression $regressionText

          # Normal development validation consumes the new inherited+current regression chain.
          Replace-Once $devValidation "Write-Host '[2/5] Run Manager 4.17.4 review/bootstrap regressions...'" "Write-Host '[2/5] Run Manager 4.17.5 regression chain...'"
          Replace-Once $devValidation "foreach(`$regressionName in @('Invoke-Manager4174ReviewRegression.ps1','Invoke-Manager4174BootstrapRegression.ps1')){" "foreach(`$regressionName in @('Invoke-Manager4175ReviewRegression.ps1')){"
          Replace-Once $devValidation "if(-not(Test-Path -LiteralPath `$regression -PathType Leaf)){Fail('Manager 4.17.4 regression tool is missing: '+`$regressionName)}" "if(-not(Test-Path -LiteralPath `$regression -PathType Leaf)){Fail('Manager 4.17.5 regression tool is missing: '+`$regressionName)}"
          Replace-Once $devValidation "Write-Host 'Review/bootstrap regressions: PASS' -ForegroundColor Green" "Write-Host 'Manager 4.17.5 regression chain: PASS' -ForegroundColor Green"

          # Parse all modified PowerShell before rebuilding repository metadata.
          foreach($p in @($runtime,$menu,$devValidation,$regression)){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if(@($errors).Count-ne0){throw('Parser failed: '+$p+' :: '+([string]::Join(' | ',@($errors|ForEach-Object{$_.Message}))))}
          }

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $regression -RepositoryRoot $root
          if($LASTEXITCODE-ne0){throw "4.17.5 regression failed: exit=$LASTEXITCODE"}

          # Rebuild cryptographic public source identity after product changes.
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'tools\Build-PublicFileManifest.ps1') -RepositoryRoot $root -Write
          if($LASTEXITCODE-ne0){throw 'Build-PublicFileManifest -Write failed.'}
          $manifest=Get-Content (Join-Path $root 'PUBLIC_FILE_MANIFEST.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $provPath=Join-Path $root 'PUBLIC_PROVENANCE.json'
          $prov=Get-Content $provPath -Raw -Encoding UTF8|ConvertFrom-Json
          $prov.source_manager_version='4.17.5'
          $prov.source_gate_baseline_manager_version='4.17.4'
          $prov.source_manager_installation_sha256=[string]$manifest.manager.installation_sha256
          $prov.source_manager_gate_managed_content_sha256=[string]$manifest.manager.gate_managed_content_sha256
          $prov.production_validation.full_gate_pass=$false
          $prov.production_validation.gate_revision=$null
          $prov.production_validation.framework_revision=24
          $prov.production_validation.tested_update_sha256=$null
          $prov.production_validation.production_doctor_pass=$false
          $prov.production_validation.production_ux_smoke_pass=$false
          $prov.production_validation.production_managed_content_prefix=$null
          $prov.public_candidate_revision=8
          $prov.gate_framework.frozen_for_manager_candidate=$false
          $prov.known_nonsecret_source_hygiene_notes=@('manager/product/docs/TESTING.md retains a maintainer-local D:\0\0__Core example for historical/maintainer qualification context; it is not a product installation default.')
          $prov|ConvertTo-Json -Depth 20|Set-Content -LiteralPath $provPath -Encoding UTF8

      - name: Validate patched development tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Build-PublicFileManifest.ps1" -RepositoryRoot $root -Check
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Verify-PublicPresentation.ps1" -RepositoryRoot $root
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\runtime\Keelaryn__Manager.ps1" -SelfTest
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\manager\product\tools\KeelarynMenu.ps1" -SelfTest -NoRootLauncher
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP ('keelaryn-4175-corrective-'+$env:GITHUB_RUN_ID)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot $root -OutputDirectory $out
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Write-Host 'MANAGER 4.17.5 CORRECTIVE VALIDATION: PASS' -ForegroundColor Green

      - name: Commit validated product and regression changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'keelaryn-development-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager tools/Invoke-DevelopmentValidation.ps1 tools/Invoke-Manager4175ReviewRegression.ps1 PUBLIC_FILE_MANIFEST.json PUBLIC_PROVENANCE.json
          if(-not(git diff --cached --quiet)){ 
            git diff --cached --check --ignore-space-at-eol
            if($LASTEXITCODE-ne0){throw 'Staged diff whitespace validation failed.'}
            git commit -m 'Manager 4.17.5: bind multi-Hub ingress and updates'
            git push origin HEAD:dev/manager-4.17.5
          }else{throw 'Corrective workflow produced no staged changes.'}
          Write-Host 'Validated Manager 4.17.5 product commit pushed.' -ForegroundColor Green

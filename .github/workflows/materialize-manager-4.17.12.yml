name: Finalize Manager 4.17.12 materialization

on:
  push:
    branches:
      - dev/manager-4.17.12
    paths:
      - .github/workflows/materialize-manager-4.17.12.yml

permissions:
  contents: write

concurrency:
  group: materialize-manager-4.17.12-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-2025
    steps:
      - name: Checkout exact finalizer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: dev/manager-4.17.12

      - name: Verify finalizer identity and materialized product
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedParent = '5e9adce7d210f067dc45729bbbd569b4d8813ad2'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $parent = (git rev-parse HEAD^).Trim().ToLowerInvariant()
          if ($parent -cne $expectedParent) { throw "Unexpected finalizer parent: $parent expected $expectedParent" }
          $changed = @(git diff --name-only "$expectedParent..$head")
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/materialize-manager-4.17.12.yml') {
            throw ('Finalizer commit is not isolated: ' + ($changed -join ', '))
          }
          if ((git status --porcelain).Count -ne 0) { throw 'Checkout is not clean.' }
          $install = Get-Content -LiteralPath 'manager/product/install/INSTALLATION.json' -Raw | ConvertFrom-Json
          $release = Get-Content -LiteralPath 'manager/product/manager_release.json' -Raw | ConvertFrom-Json
          if ([string]$install.manager_version -cne '4.17.12' -or [string]$release.manager_version -cne '4.17.12') {
            throw 'Materialized Manager 4.17.12 identity is not present.'
          }
          Write-Host "Finalizer identity PASS. HEAD=$head parent=$parent"

      - name: Regenerate public source manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Build-PublicFileManifest.ps1 -RepositoryRoot $PWD.Path -Write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -cne 'PUBLIC_FILE_MANIFEST.json') {
            throw ('Manifest refresh changed unexpected paths: ' + ($changed -join ', '))
          }
          $manifest = Get-Content -LiteralPath 'PUBLIC_FILE_MANIFEST.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.manager.version -cne '4.17.12') { throw 'Generated public manifest is not Manager 4.17.12.' }
          Write-Host ('Manifest identity: installation=' + [string]$manifest.manager.installation_sha256 + ' managed=' + [string]$manifest.manager.gate_managed_content_sha256)

      - name: Remove one-shot materialization machinery and commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/materialize-manager-4.17.12.yml tools/Apply-Manager41712PostFreezeFixes.ps1
          git add -- PUBLIC_FILE_MANIFEST.json
          $staged = @(git diff --cached --name-only | Sort-Object)
          $expected = @('.github/workflows/materialize-manager-4.17.12.yml','PUBLIC_FILE_MANIFEST.json','tools/Apply-Manager41712PostFreezeFixes.ps1') | Sort-Object
          if (($staged -join "`n") -cne ($expected -join "`n")) {
            throw ('Unexpected finalization commit paths: ' + ($staged -join ', '))
          }
          git commit -m 'Finalize Manager 4.17.12 materialization metadata'
          git push origin HEAD:dev/manager-4.17.12

name: Materialize Manager 4.17.12

on:
  push:
    branches:
      - dev/manager-4.17.12
    paths:
      - .github/workflows/materialize-manager-4.17.12.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-manager-4.17.12
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: dev/manager-4.17.12

      - name: Verify one-shot identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedParent = '11038cd55d025c9b38c1a43f5e58c91b6b3e0c0d'
          $head = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -cne $expectedParent) { throw "Unexpected workflow parent: $parent expected $expectedParent" }
          $changed = @(git diff --name-only "$expectedParent..$head")
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/materialize-manager-4.17.12.yml') {
            throw ('Workflow commit is not one-shot isolated: ' + ($changed -join ', '))
          }
          if ((git status --porcelain).Count -ne 0) { throw 'Checkout is not clean before materialization.' }
          $runtime = Get-Content -LiteralPath 'manager/product/runtime/Keelaryn__Manager.ps1' -Raw
          if ($runtime -notmatch '(?m)^\$ManagerVersion = "4\.17\.11"$') { throw 'Expected Manager 4.17.11 source baseline is absent.' }
          Write-Host "One-shot identity PASS. HEAD=$head parent=$parent"

      - name: Apply Manager 4.17.12 product fixes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Apply-Manager41712PostFreezeFixes.ps1 -RepositoryRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate exact product diff and permanent regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'manager/README_FIRST.md',
            'manager/product/install/INSTALLATION.json',
            'manager/product/manager_release.json',
            'manager/product/runtime/Keelaryn__Manager.ps1',
            'manager/product/tools/KeelarynMenu.ps1'
          ) | Sort-Object
          $actual = @(git diff --name-only | Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw ('Unexpected materialization diff. expected=' + ($expected -join ',') + ' actual=' + ($actual -join ','))
          }

          foreach ($path in @('manager/product/runtime/Keelaryn__Manager.ps1','manager/product/tools/KeelarynMenu.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) { throw ('Parser failure in ' + $path + ': ' + (($errors | ForEach-Object Message) -join ' | ')) }
          }

          $install = Get-Content -LiteralPath 'manager/product/install/INSTALLATION.json' -Raw | ConvertFrom-Json
          $release = Get-Content -LiteralPath 'manager/product/manager_release.json' -Raw | ConvertFrom-Json
          $readme = Get-Content -LiteralPath 'manager/README_FIRST.md' -Raw
          $menu = Get-Content -LiteralPath 'manager/product/tools/KeelarynMenu.ps1' -Raw
          if ([string]$install.manager_version -cne '4.17.12') { throw 'INSTALLATION version mismatch.' }
          if ([string]$release.manager_version -cne '4.17.12') { throw 'manager_release version mismatch.' }
          if (-not $readme.Contains('production-installed Manager 4.17.11 -> 4.17.12')) { throw 'README transition mismatch.' }
          if (-not $menu.Contains('Active selection is invalid/unresolved. Choose a registered Hub to recover active selection.')) { throw 'Recovery UI marker missing.' }

          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Invoke-Manager41712ReviewRegression.ps1 -RepositoryRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Manager 4.17.12 exact materialization validation PASS.'

      - name: Commit product materialization
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manager/README_FIRST.md manager/product/install/INSTALLATION.json manager/product/manager_release.json manager/product/runtime/Keelaryn__Manager.ps1 manager/product/tools/KeelarynMenu.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Materialization produced no staged product changes.' }
          git commit -m 'Materialize Manager 4.17.12 corrective product fixes'
          git push origin HEAD:dev/manager-4.17.12

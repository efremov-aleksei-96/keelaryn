name: Entry reachability model validation

on:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'tests/knowledge/entry-reachability.json'
      - 'tests/knowledge/entry-reachability-control-flow.json'
      - 'tests/knowledge/invariants/multi-hub.json'
      - 'tests/knowledge/state-machines/multi-hub.json'
      - 'tests/knowledge/architecture/qualification-consolidation-4.17.13.json'
      - 'tools/Build-ManagerEntryReachabilityPlan.ps1'
      - 'tools/Test-ManagerQualificationArchitecture.ps1'
      - '.github/workflows/entry-reachability-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keelaryn-entry-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-model:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify GitHub Actions supply-chain policy
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-GitHubActionsPolicy.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify qualification architecture
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Test-ManagerQualificationArchitecture.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Derive bounded entry plan
        shell: powershell
        run: |
          $evidence=Join-Path $env:RUNNER_TEMP 'MANAGER_ENTRY_PLAN.json'
          "KEELARYN_ENTRY_PLAN=$evidence" >> $env:GITHUB_ENV
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Build-ManagerEntryReachabilityPlan.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -OutputPath "$evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compact entry plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-entry-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.KEELARYN_ENTRY_PLAN }}
          if-no-files-found: error
          retention-days: 3

# This workflow validates the declarative process-entry model only. It intentionally does not
# repeat the expensive real process-entry proof already owned by the pre-freeze execution boundary.
# Fresh execution remains mandatory at candidate freeze, Source Gate, Full Gate and production acceptance.

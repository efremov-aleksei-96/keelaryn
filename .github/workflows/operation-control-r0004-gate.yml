name: Operation control r0004 gate

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0004_vps.py'
      - '.github/workflows/operation-control-r0004-gate.yml'
      - 'docs/candidates/operation-control-r0004-20260920-01.json'
      - 'docs/candidates/operation-control-r0004-20260920-01.gate.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0004-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SelfTest r0004 qualification driver
        run: |
          set -euo pipefail
          python3 -B tools/operation_control_r0004_vps.py selftest > "$RUNNER_TEMP/selftest.json"
          python3 -m py_compile tools/operation_control_r0004_vps.py

      - name: Check out exact frozen r0004 source
        env:
          FROZEN_COMMIT: 819dcbd11b531180763ddcf55d2273a8b6da1c5e
          FROZEN_TREE: 7e00fadba2aff9b40a941f68175af7275f208413
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          git worktree add --detach "$work" "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git -C "$work" status --porcelain)"

      - name: Run focused frozen operation-control regressions
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover             -s "$work/tests/core"             -p 'test_operation_*.py'

      - name: Rebuild exact frozen r0004 candidate payload
        env:
          FROZEN_COMMIT: 819dcbd11b531180763ddcf55d2273a8b6da1c5e
          EXPECTED_PAYLOAD: d814b27f4fe7fa9ceb5271002fa17044f427cda1a58f4e554e5168f1a8b5aa89
          EXPECTED_SIZE: '361869'
          EXPECTED_COUNT: '190'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"

          python3 "$work/deploy/zero-based-vps/build_payload.py"             --repo-root "$work"             --source-commit "$FROZEN_COMMIT"             --output "$RUNNER_TEMP/first.tar.gz" > "$RUNNER_TEMP/first.json"
          python3 "$work/deploy/zero-based-vps/build_payload.py"             --repo-root "$work"             --source-commit "$FROZEN_COMMIT"             --output "$RUNNER_TEMP/second.tar.gz" > "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.tar.gz" "$RUNNER_TEMP/second.tar.gz"

          python3 - "$RUNNER_TEMP/first.json" "$EXPECTED_PAYLOAD" "$EXPECTED_SIZE" "$EXPECTED_COUNT" <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          expected={
              "payload_sha256":sys.argv[2],
              "payload_size":int(sys.argv[3]),
              "file_count":int(sys.argv[4]),
              "source_commit":"819dcbd11b531180763ddcf55d2273a8b6da1c5e",
          }
          observed={key:v[key] for key in expected}
          if observed != expected:
              raise SystemExit(f"frozen payload mismatch: {observed}")
          PY

      - name: Emit compact r0004 gate evidence
        env:
          OUT: ${{ runner.temp }}/OPERATION_CONTROL_R0004_GATE.json
        run: |
          python3 - "$OUT" <<'PY'
          import json, os, sys
          value={
              "schema":"keelaryn.operation-control-gate-evidence.v1",
              "gate_revision":"operation-control-gate-r0006",
              "candidate":"operation-control-r0004-20260920-01",
              "frozen_source_commit":"819dcbd11b531180763ddcf55d2273a8b6da1c5e",
              "frozen_source_tree":"7e00fadba2aff9b40a941f68175af7275f208413",
              "payload_sha256":"d814b27f4fe7fa9ceb5271002fa17044f427cda1a58f4e554e5168f1a8b5aa89",
              "payload_size":361869,
              "file_count":190,
              "rejected_predecessor":"operation-control-r0003-20260920-01",
              "driver_selftest":True,
              "driver_read_only_reconcile_surface":True,
              "driver_separate_rejected_r0003_recovery_surface":True,
              "driver_separate_materialize_surface":True,
              "driver_read_only_qualify_surface":True,
              "driver_bootstrap_resume_surface":True,
              "driver_recovery_authority_validation":True,
              "driver_preserves_rejected_r0003_release":True,
              "frozen_focused_operation_tests":True,
              "live_authenticated_github_readiness_in_frozen_payload":True,
              "exact_runtime_state_recovery_in_frozen_payload":True,
              "filesystem_layout_bound_recovery_authority":True,
              "deterministic_rebuild":True,
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "production_qualified":False,
          }
          with open(sys.argv[1],"w",encoding="utf-8",newline="\n") as f:
              json.dump(value,f,ensure_ascii=False,sort_keys=True,separators=(",",":"))
              f.write("\n")
          PY

      - name: Upload compact r0004 gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0004-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0004_GATE.json
          if-no-files-found: error
          retention-days: 3

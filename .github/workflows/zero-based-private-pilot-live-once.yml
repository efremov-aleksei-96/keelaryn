name: Zero-based Private Pilot Live Once

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - '.github/workflows/zero-based-private-pilot-live-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-based-private-pilot-live-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-pilot-live:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      KEELARYN_DISPOSABLE_ENABLE: ${{ secrets.KEELARYN_DISPOSABLE_ENABLE }}
      KEELARYN_GOOGLE_CLIENT_ID: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_ID }}
      KEELARYN_GOOGLE_CLIENT_SECRET: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_SECRET }}
      KEELARYN_GOOGLE_REFRESH_TOKEN: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed unless disposable credentials are enabled
        shell: pwsh
        run: |
          if ($env:KEELARYN_DISPOSABLE_ENABLE -ne 'YES') { throw 'Disposable Drive is not explicitly enabled.' }
          foreach ($name in 'KEELARYN_GOOGLE_CLIENT_ID','KEELARYN_GOOGLE_CLIENT_SECRET','KEELARYN_GOOGLE_REFRESH_TOKEN') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required secret: $name" }
          }

      - name: Build sanitized Windows pilot pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'core'
          $root = Join-Path $env:RUNNER_TEMP 'private-pilot-live'
          $source = Join-Path $root 'source'
          $pack = Join-Path $root 'pack'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $source 'README.md'), [Text.Encoding]::UTF8.GetBytes("SANITIZED PRIVATE PILOT`r`nWINDOWS + DRIVE.FILE END TO END`r`n"))
          $manifest = '{"schema":"keelaryn.pilot-source.v1","pilot_id":"windows-live-private-pilot","entries":[{"source":"README.md","target":"legacy-readme.md"}]}' + "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'PILOT_SOURCE.json'), $manifest, (New-Object Text.UTF8Encoding($false)))
          python -m keelaryn_core.pilot_cli pack-build --source-root $source --source-manifest (Join-Path $root 'PILOT_SOURCE.json') --output-dir $pack
          python -m keelaryn_core.pilot_cli pack-verify --pack-dir $pack
          "KEELARYN_PRIVATE_PILOT_PACK=$pack" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real Windows Drive private pilot through Core transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'core'
          $output = python -m keelaryn_core.pilot_cli live-import --pack-dir $env:KEELARYN_PRIVATE_PILOT_PACK
          if ($LASTEXITCODE -ne 0) { throw "live-import failed with exit code $LASTEXITCODE" }
          $value = $output | ConvertFrom-Json
          if ($value.live_pilot.pilot.outcome -ne 'COMMITTED') { throw 'Pilot did not COMMIT.' }
          if ([int]$value.live_pilot.pilot.canonical_epoch -ne 1) { throw 'Pilot canonical epoch is not 1.' }
          if (-not $value.live_pilot.safety_root_verified -or -not $value.live_pilot.sentinel_verified -or -not $value.live_pilot.disposable_hub_verified) {
            throw 'Pilot structural verification flags are not all true.'
          }
          Write-Host 'WINDOWS LIVE PRIVATE PILOT: PASS'
          Write-Host ('source_sha=' + $env:GITHUB_SHA)
          Write-Host ('outcome=' + $value.live_pilot.pilot.outcome)
          Write-Host ('epoch=' + $value.live_pilot.pilot.canonical_epoch)

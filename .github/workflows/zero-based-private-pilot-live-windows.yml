name: Zero-based Private Pilot Live Windows

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'core/keelaryn_core/pilot_live.py'
      - 'core/keelaryn_core/pilot_cli.py'
      - 'core/keelaryn_core/pilot_pack.py'
      - 'tests/live/run_private_pilot_live.py'
      - '.github/workflows/zero-based-private-pilot-live-windows.yml'

permissions:
  contents: read

concurrency:
  group: zero-based-private-pilot-live-windows
  cancel-in-progress: false

jobs:
  live-private-pilot:
    if: github.actor == 'efremov-aleksei-96' && contains(github.event.head_commit.message, '[live-private-pilot]')
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      KEELARYN_DISPOSABLE_ENABLE: ${{ secrets.KEELARYN_DISPOSABLE_ENABLE }}
      KEELARYN_GOOGLE_CLIENT_ID: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_ID }}
      KEELARYN_GOOGLE_CLIENT_SECRET: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_CLIENT_SECRET }}
      KEELARYN_GOOGLE_REFRESH_TOKEN: ${{ secrets.KEELARYN_DISPOSABLE_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed unless disposable credentials are explicitly enabled
        shell: pwsh
        run: |
          if ($env:KEELARYN_DISPOSABLE_ENABLE -ne 'YES') {
            throw 'Disposable Drive execution is not explicitly enabled.'
          }
          foreach ($name in @(
            'KEELARYN_GOOGLE_CLIENT_ID',
            'KEELARYN_GOOGLE_CLIENT_SECRET',
            'KEELARYN_GOOGLE_REFRESH_TOKEN'
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Required disposable secret is missing: $name"
            }
          }
          "KEELARYN_PRIVATE_PILOT_EVIDENCE=$env:RUNNER_TEMP\PRIVATE_PILOT_LIVE_EVIDENCE.json" >> $env:GITHUB_ENV

      - name: Show Python runtime
        shell: pwsh
        run: python --version

      - name: Compile exact live pilot path
        shell: pwsh
        run: python -m compileall -q core tests/live/run_private_pilot_live.py

      - name: Run fresh synthetic private-subset pilot against real Google Drive
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: core
        run: python -B tests/live/run_private_pilot_live.py

      - name: Upload sanitized private pilot live evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-based-private-pilot-live-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.KEELARYN_PRIVATE_PILOT_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3

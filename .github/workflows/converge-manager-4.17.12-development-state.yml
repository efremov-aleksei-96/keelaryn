name: Converge Manager 4.17.12 development state

on:
  push:
    branches:
      - dev/manager-4.17.12
    paths:
      - .github/workflows/converge-manager-4.17.12-development-state.yml

permissions:
  contents: write

concurrency:
  group: converge-manager-4.17.12-development-state
  cancel-in-progress: false

jobs:
  converge:
    runs-on: windows-2025
    steps:
      - name: Checkout exact convergence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: dev/manager-4.17.12

      - name: Verify one-shot identity and parser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedParent = '7be22fdc4344ac886ceb3c9738103e035016619f'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $parent = (git rev-parse HEAD^).Trim().ToLowerInvariant()
          if ($parent -cne $expectedParent) { throw "Unexpected convergence parent: $parent expected $expectedParent" }
          $changed = @(git diff --name-only "$expectedParent..$head")
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/converge-manager-4.17.12-development-state.yml') {
            throw ('Convergence workflow commit is not isolated: ' + ($changed -join ', '))
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Converge-Manager41712DevelopmentState.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw ('Converger parser failure: ' + (($errors | ForEach-Object Message) -join ' | ')) }
          Write-Host "Convergence identity + parser: PASS. HEAD=$head"

      - name: Build and validate coherent development state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Converge-Manager41712DevelopmentState.ps1 -RepositoryRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = @(git diff --name-only | Sort-Object)
          $expected = @(
            '.github/workflows/development-validation.yml',
            '.github/workflows/manager-risk-defect-gate.yml',
            'MANAGER_DEVELOPMENT_STATE.json',
            'PUBLIC_PROVENANCE.json',
            'tests/knowledge/defects/manager-4.17.11-postfreeze.json',
            'tests/knowledge/risk-map.json',
            'tools/Invoke-ManagerRiskContextRegression.ps1'
          ) | Sort-Object
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw ('Unexpected converger output paths: ' + ($actual -join ', '))
          }
          Write-Host 'Converger exact output set: PASS.'

      - name: Commit coherent unqualified state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/converge-manager-4.17.12-development-state.yml tools/Converge-Manager41712DevelopmentState.ps1
          git add -- .github/workflows/development-validation.yml .github/workflows/manager-risk-defect-gate.yml MANAGER_DEVELOPMENT_STATE.json PUBLIC_PROVENANCE.json tests/knowledge/defects/manager-4.17.11-postfreeze.json tests/knowledge/risk-map.json tools/Invoke-ManagerRiskContextRegression.ps1
          $actual = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
            '.github/workflows/converge-manager-4.17.12-development-state.yml',
            '.github/workflows/development-validation.yml',
            '.github/workflows/manager-risk-defect-gate.yml',
            'MANAGER_DEVELOPMENT_STATE.json',
            'PUBLIC_PROVENANCE.json',
            'tests/knowledge/defects/manager-4.17.11-postfreeze.json',
            'tests/knowledge/risk-map.json',
            'tools/Converge-Manager41712DevelopmentState.ps1',
            'tools/Invoke-ManagerRiskContextRegression.ps1'
          ) | Sort-Object
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw ('Unexpected staged convergence paths: ' + ($actual -join ', '))
          }
          git commit -m 'Converge Manager 4.17.12 unqualified development state'
          git push origin HEAD:dev/manager-4.17.12

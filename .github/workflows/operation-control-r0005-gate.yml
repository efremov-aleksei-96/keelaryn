name: Operation control r0005 gate

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0005_vps.py'
      - '.github/workflows/operation-control-r0005-gate.yml'
      - 'docs/candidates/operation-control-r0005-20260921-01.json'
      - 'docs/candidates/operation-control-r0005-20260921-01.gate.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0005-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SelfTest r0005 qualification driver
        run: |
          set -euo pipefail
          python3 -B tools/operation_control_r0005_vps.py selftest > "$RUNNER_TEMP/selftest.json"
          python3 -m py_compile tools/operation_control_r0005_vps.py

      - name: Check out exact frozen r0005 source
        env:
          FROZEN_COMMIT: 08f2e211f53764590f6ff0f05f86b2de62c14418
          FROZEN_TREE: 8b73bb1e19f554099c81374cb957c588f479d666
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          git worktree add --detach "$work" "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(git -C "$work" rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git -C "$work" status --porcelain)"

      - name: Run focused frozen operation-control regressions
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s "$work/tests/core" \
            -p 'test_operation_*.py'

      - name: Prove frozen cross-user relay DAC
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          group_name='keelaryn-r0005-ci'
          transport_user='keelaryn-r0005-xport'

          sudo groupadd --system "$group_name"
          sudo useradd --system --no-create-home --gid "$group_name" \
            --shell /usr/sbin/nologin "$transport_user"

          transport_uid="$(id -u "$transport_user")"
          shared_gid="$(getent group "$group_name" | cut -d: -f3)"
          test "$transport_uid" -ne 0
          test -n "$shared_gid"

          tmp="$(sudo mktemp -d /tmp/keelaryn-r0005-relay.XXXXXX)"
          trap 'sudo rm -rf "$tmp"' EXIT
          sudo chmod 0755 "$tmp"

          stage="$tmp/stage"
          sudo install -d -m 0755 "$stage"
          sudo cp -a "$work/core" "$stage/core"
          sudo cp "$work/tests/ci/operation_relay_cross_user.py" \
            "$stage/operation_relay_cross_user.py"
          sudo find "$stage/core" -type d -exec chmod 0755 {} +
          sudo find "$stage/core" -type f -exec chmod 0644 {} +
          sudo chmod 0644 "$stage/operation_relay_cross_user.py"
          sudo diff -qr "$work/core" "$stage/core"
          sudo cmp "$work/tests/ci/operation_relay_cross_user.py" \
            "$stage/operation_relay_cross_user.py"

          script="$stage/operation_relay_cross_user.py"
          staged_pythonpath="$stage/core"

          sudo install -d -m 0750 -o "$transport_user" -g "$group_name" \
            "$tmp/transport"
          test "$(stat -c '%u' "$tmp/transport")" = "$transport_uid"
          test "$(stat -c '%g' "$tmp/transport")" = "$shared_gid"
          test "$(stat -c '%a' "$tmp/transport")" = "750"

          sudo -u "$transport_user" \
            env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath" \
            /usr/bin/python3 -B "$script" transport-deliver \
            --root "$tmp/transport" \
            --source-commit "$FROZEN_COMMIT"

          sudo install -d -m 0700 -o root -g root \
            "$tmp/operations" "$tmp/control"

          sudo setpriv \
            --reuid=0 \
            --regid="$shared_gid" \
            --clear-groups \
            --bounding-set=-all \
            --inh-caps=-all \
            --ambient-caps=-all \
            --no-new-privs \
            env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath" \
            /usr/bin/python3 -B "$script" agent-process \
            --transport-root "$tmp/transport" \
            --operation-root "$tmp/operations" \
            --control-root "$tmp/control" \
            --source-commit "$FROZEN_COMMIT" \
            --expected-gid "$shared_gid"

          sudo -u "$transport_user" \
            env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$staged_pythonpath" \
            /usr/bin/python3 -B "$script" transport-publish \
            --root "$tmp/transport" \
            --source-commit "$FROZEN_COMMIT"

      - name: Rebuild exact frozen r0005 candidate payload
        env:
          FROZEN_COMMIT: 08f2e211f53764590f6ff0f05f86b2de62c14418
          EXPECTED_PAYLOAD: 6272afbe918d33c29a3f72354baca9e781b3960b3f0f465e1598b5bbc794a7e7
          EXPECTED_SIZE: '365052'
          EXPECTED_COUNT: '190'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frozen-source"
          python3 "$work/deploy/zero-based-vps/build_payload.py" \
            --repo-root "$work" --source-commit "$FROZEN_COMMIT" \
            --output "$RUNNER_TEMP/first.tar.gz" > "$RUNNER_TEMP/first.json"
          python3 "$work/deploy/zero-based-vps/build_payload.py" \
            --repo-root "$work" --source-commit "$FROZEN_COMMIT" \
            --output "$RUNNER_TEMP/second.tar.gz" > "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.tar.gz" "$RUNNER_TEMP/second.tar.gz"

          python3 - "$RUNNER_TEMP/first.json" "$EXPECTED_PAYLOAD" "$EXPECTED_SIZE" "$EXPECTED_COUNT" <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1],encoding="utf-8"))
          expected={
              "payload_sha256":sys.argv[2],
              "payload_size":int(sys.argv[3]),
              "file_count":int(sys.argv[4]),
              "source_commit":"08f2e211f53764590f6ff0f05f86b2de62c14418",
          }
          observed={key:v[key] for key in expected}
          if observed != expected:
              raise SystemExit(f"frozen payload mismatch: {observed}")
          PY

      - name: Emit compact r0005 gate evidence
        env:
          OUT: ${{ runner.temp }}/OPERATION_CONTROL_R0005_GATE.json
        run: |
          python3 - "$OUT" <<'PY'
          import json, os, sys
          value={
              "schema":"keelaryn.operation-control-gate-evidence.v1",
              "gate_revision":"operation-control-gate-r0007",
              "candidate":"operation-control-r0005-20260921-01",
              "frozen_source_commit":"08f2e211f53764590f6ff0f05f86b2de62c14418",
              "frozen_source_tree":"8b73bb1e19f554099c81374cb957c588f479d666",
              "payload_sha256":"6272afbe918d33c29a3f72354baca9e781b3960b3f0f465e1598b5bbc794a7e7",
              "payload_size":365052,
              "file_count":190,
              "rejected_predecessor":"operation-control-r0004-20260920-01",
              "historical_r0003_recovery_prepared_sha256":"1a254b06fe3167e0b437b93606a37df14285e8ba3a167947824fc0b684a4468b",
              "historical_r0003_recovery_completed_sha256":"eef349e2f6d7f12047212e221003341129294d44f5dc669f1579a4d13fb1bca4",
              "driver_selftest":True,
              "driver_read_only_reconcile_surface":True,
              "driver_separate_rejected_r0004_recovery_surface":True,
              "driver_preserves_historical_r0003_authority":True,
              "driver_separate_materialize_surface":True,
              "driver_read_only_qualify_surface":True,
              "driver_bootstrap_resume_surface":True,
              "frozen_focused_operation_tests":True,
              "cross_user_relay_dac_verified":True,
              "agent_capability_free_contract_verified":True,
              "no_sgid_dependency":True,
              "deterministic_rebuild":True,
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "production_qualified":False,
          }
          with open(sys.argv[1],"w",encoding="utf-8",newline="\n") as f:
              json.dump(value,f,ensure_ascii=False,sort_keys=True,separators=(",",":"))
              f.write("\n")
          PY

      - name: Upload compact r0005 gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-control-r0005-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OPERATION_CONTROL_R0005_GATE.json
          if-no-files-found: error
          retention-days: 3

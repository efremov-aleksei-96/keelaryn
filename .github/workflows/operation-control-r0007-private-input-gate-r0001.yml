name: Operation control r0007 private input gate r0001

on:
  push:
    branches:
      - 'dev/zero-based-keelaryn'
    paths:
      - 'tools/operation_control_r0007_private_input.py'
      - 'tests/core/test_operation_control_r0007_private_input.py'
      - '.github/workflows/operation-control-r0007-private-input-gate-r0001.yml'
      - 'docs/authorizations/operation-control-r0007-stage/**'
      - 'docs/evidence/R0007_STAGE_BOUNDARY_*.json'
      - 'DEVELOPMENT_STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operation-control-r0007-private-input-gate-r0001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact issued transaction authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("docs/authorizations/operation-control-r0007-stage")
          files = sorted(path for path in root.glob("*.json") if path.is_file())
          expected = root / "e7869ce5efd9d63da191e30f7c4e2c2b.json"
          if files != [expected]:
              raise SystemExit(f"unexpected real authority set: {files}")

          raw = expected.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          canonical = (
              json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n"
          ).encode("utf-8")
          if raw != canonical:
              raise SystemExit("real authority is not canonical JSON")
          if hashlib.sha256(raw).hexdigest() != "002c725f8ddcd5ad1a579116d37ec4aad58521356bf11e57103f0babe81527f8":
              raise SystemExit("real authority SHA-256 mismatch")
          if value.get("scope") != "R0007_RELEASE_STAGE_ONLY":
              raise SystemExit("real authority scope mismatch")
          if value.get("production_stage_authorized") is not True:
              raise SystemExit("real authority does not permit inert stage")
          for key in (
              "activation_authorized",
              "drive_content_mutation_authorized",
              "legacy_hub_mutation_authorized",
              "writer_mutation_authorized",
              "credential_mutation_authorized",
          ):
              if value.get(key) is not False:
                  raise SystemExit(f"unsafe real authority flag: {key}")
          PY

      - name: Syntax-check private-input tooling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "tools/operation_control_r0007_private_input.py",
              "tests/core/test_operation_control_r0007_private_input.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain)"

      - name: Run private-input regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s tests/core -p 'test_operation_control_r0007_private_input.py' -v
          test -z "$(git status --porcelain)"

      - name: Prove operational surface remains pre-stage only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          raw = Path("tools/operation_control_r0007_private_input.py").read_text(encoding="utf-8")
          required = (
              'choices=("reconcile", "acquire")',
              'release_publication_performed": False',
              'stage_witness_mutation_performed": False',
              'activation_performed": False',
              'drive_mutations_performed": False',
              '/var/lib/keelaryn/operation-control/r0007-stage-input',
              'input_root=DEFAULT_INPUT_ROOT',
              'repository_root=SCRIPT_REPOSITORY_ROOT',
          )
          for needle in required:
              if needle not in raw:
                  raise SystemExit(f"missing private-input safety contract: {needle}")
          forbidden_cli = (
              'parser.add_argument("--input-root"',
              'parser.add_argument("--output"',
              'parser.add_argument("--expected-branch-tip"',
              'parser.add_argument("--repository-root"',
              'args.input_root',
              'args.output',
              'args.expected_branch_tip',
          )
          for needle in forbidden_cli:
              if needle in raw:
                  raise SystemExit(f"unsafe private-input CLI override: {needle}")
          PY

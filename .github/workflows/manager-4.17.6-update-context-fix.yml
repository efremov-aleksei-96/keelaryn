name: One-shot Manager 4.17.6 update-context validation

on:
  push:
    branches:
      - 'dev/manager-4.17.6'
    paths:
      - '.github/workflows/manager-4.17.6-update-context-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-context:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize update-context fix
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Materialize-Manager4176UpdateContextFix.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused update-context regression
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-Manager4176UpdateContextRegression.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify manifest and public repository
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Build-PublicFileManifest.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Verify-PublicRepository.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full development validation on corrected tree
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP ('manager-4.17.6-update-context-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\Invoke-DevelopmentValidation.ps1" -RepositoryRoot "$env:GITHUB_WORKSPACE" -OutputDirectory $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore disposable legacy regression adaptation
        shell: powershell
        run: |
          git checkout -- tools/Invoke-Manager4175ReviewRegression.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate and publish corrected product bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $allowed=@(
            'PUBLIC_FILE_MANIFEST.json',
            'PUBLIC_PROVENANCE.json',
            'manager/README_FIRST.md',
            'manager/product/runtime/Keelaryn__Manager.ps1',
            'manager/product/tools/KeelarynMenu.ps1'
          )
          $changed=@(git status --porcelain | ForEach-Object { ([string]$_).Substring(3).Replace('\','/') })
          if($changed.Count-ne$allowed.Count){throw('Unexpected changed-file count: '+$changed.Count+'; '+($changed-join', '))}
          foreach($path in $changed){if($allowed-notcontains$path){throw('Unexpected product change: '+$path)}}
          foreach($path in $allowed){if($changed-notcontains$path){throw('Expected product change missing: '+$path)}}
          git -c core.whitespace=cr-at-eol diff --check
          if($LASTEXITCODE-ne0){throw 'git diff --check failed'}
          git config user.name 'Keelaryn Development Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $allowed
          git -c core.whitespace=cr-at-eol diff --cached --check
          if($LASTEXITCODE-ne0){throw 'staged diff check failed'}
          git commit -m 'Manager 4.17.6: preserve Hub context across update restart'
          if($LASTEXITCODE-ne0){throw 'product commit failed'}
          git push origin HEAD:dev/manager-4.17.6
          if($LASTEXITCODE-ne0){throw 'product push failed'}
          Write-Host 'MANAGER 4.17.6 UPDATE-CONTEXT PRODUCT PUBLISHED AFTER PASS' -ForegroundColor Green
